<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>الحصص المباشرة | جنود الهدى</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    background:#f4f7f5;
    color:#222;
}

header{
    background:linear-gradient(135deg,#075e54,#0b806f);
    color:white;
    text-align:center;
    padding:25px 15px;
}

.logo{
    font-size:45px;
}

header h1{
    font-size:27px;
    margin-top:5px;
}

header p{
    margin-top:6px;
    font-size:14px;
}

.container{
    max-width:700px;
    margin:auto;
    padding:20px 14px;
}

.card{
    background:white;
    border-radius:18px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 4px 15px rgba(0,0,0,.07);
}

h2{
    color:#075e54;
    text-align:center;
    margin-bottom:18px;
}

input{
    width:100%;
    padding:15px;
    border:1px solid #ddd;
    border-radius:11px;
    font-size:18px;
    margin-bottom:12px;
    text-align:center;
    outline:none;
}

input:focus{
    border-color:#075e54;
}

button{
    width:100%;
    border:0;
    border-radius:11px;
    padding:14px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
}

.primary{
    background:#075e54;
    color:white;
}

.danger{
    background:#dc3545;
    color:white;
}

.message{
    display:none;
    padding:13px;
    border-radius:10px;
    text-align:center;
    margin-bottom:15px;
    line-height:1.8;
}

.error-message{
    background:#ffe8e8;
    color:#a00000;
}

.success-message{
    background:#e8f7f2;
    color:#075e54;
}

.dashboard{
    display:none;
}

.student-info{
    background:#eef8f5;
    border:1px solid #c9e5dd;
    border-radius:14px;
    padding:16px;
    line-height:2.1;
    margin-bottom:18px;
}

.student-name{
    color:#075e54;
    font-size:21px;
    font-weight:bold;
    text-align:center;
    margin-bottom:8px;
}

.lesson{
    background:#f8faf9;
    border-radius:14px;
    padding:17px;
    margin-bottom:14px;
    border-right:5px solid #0b806f;
    line-height:2;
}

.lesson-title{
    color:#075e54;
    font-size:20px;
    font-weight:bold;
    margin-bottom:10px;
}

.status{
    display:inline-block;
    padding:4px 10px;
    border-radius:7px;
    background:#e8f7f2;
    color:#075e54;
    font-weight:bold;
}

.join-button{
    display:block;
    width:100%;
    text-align:center;
    background:#198754;
    color:white;
    text-decoration:none;
    padding:14px;
    border-radius:11px;
    margin-top:14px;
    font-size:17px;
    font-weight:bold;
}

.wait-button{
    display:block;
    width:100%;
    text-align:center;
    background:#6c757d;
    color:white;
    padding:13px;
    border-radius:11px;
    margin-top:14px;
    font-weight:bold;
}

.empty{
    text-align:center;
    color:#777;
    background:#fafafa;
    padding:25px;
    border-radius:11px;
    line-height:2;
}

.loading{
    text-align:center;
    padding:25px;
    color:#777;
}

.logout{
    margin-top:15px;
}

.note{
    background:#fff8df;
    border:1px solid #ead58a;
    color:#705b00;
    padding:12px;
    border-radius:10px;
    text-align:center;
    line-height:1.9;
    margin-top:15px;
}

footer{
    margin-top:25px;
    background:#075e54;
    color:white;
    text-align:center;
    padding:20px;
    font-size:13px;
    line-height:2;
}

@media(max-width:600px){

    .container{
        padding:15px 10px;
    }

}

</style>

</head>

<body>

<header>

<div class="logo">🕌</div>

<h1>جنود الهدى</h1>

<p>الحصص المباشرة</p>

</header>

<div class="container">

<!-- =========================
     دخول الطالب
========================= -->

<div
id="loginCard"
class="card">

<h2>
🎓 دخول الطالب
</h2>

<div
id="loginMessage"
class="message error-message">
</div>

<input
id="studentCode"
type="text"
inputmode="numeric"
maxlength="6"
placeholder="اكتب كود الطالب">

<button
id="loginButton"
class="primary">

🔐 دخول الطالب

</button>

<div class="note">

🔐 استخدم الكود الخاص بك فقط.

<br>

لا يمكن لك رؤية حصص طالب آخر.

</div>

</div>


<!-- =========================
     لوحة الطالب
========================= -->

<div
id="dashboard"
class="dashboard">

<div class="card">

<h2>
🎓 حساب الطالب
</h2>

<div
id="studentInfo"
class="student-info">

جاري تحميل بيانات الطالب...

</div>

<button
id="logoutButton"
class="danger logout">

🚪 تسجيل الخروج

</button>

</div>


<div class="card">

<h2>
📚 حصصي
</h2>

<div
id="lessonsList"
class="loading">

⏳ جاري تحميل الحصص...

</div>

</div>

</div>

</div>


<footer>

جنود الهدى © 2026

<br>

أكاديمية القرآن الكريم

</footer>


<script type="module">

/* =========================
   Firebase
========================= */

import {
    db
} from "./firebase.js";

import {
    collection,
    getDocs,
    query,
    where
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
   العناصر
========================= */

const loginCard =
document.getElementById("loginCard");

const dashboard =
document.getElementById("dashboard");

const studentCodeInput =
document.getElementById("studentCode");

const loginButton =
document.getElementById("loginButton");

const loginMessage =
document.getElementById("loginMessage");

const logoutButton =
document.getElementById("logoutButton");

const studentInfo =
document.getElementById("studentInfo");

const lessonsList =
document.getElementById("lessonsList");


/* =========================
   الطالب الحالي
========================= */

let currentStudent = null;


/* =========================
   حماية النص
========================= */

function safe(value){

    return String(value ?? "")

    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   رسالة الدخول
========================= */

function showLoginMessage(
    text,
    success = false
){

    loginMessage.textContent =
    text;

    loginMessage.className =
    success
    ? "message success-message"
    : "message error-message";

    loginMessage.style.display =
    text
    ? "block"
    : "none";

}


/* =========================
   إظهار تسجيل الدخول
========================= */

function showLogin(){

    loginCard.style.display =
    "block";

    dashboard.style.display =
    "none";

}


/* =========================
   إظهار لوحة الطالب
========================= */

function showDashboard(){

    loginCard.style.display =
    "none";

    dashboard.style.display =
    "block";

}


/* =========================
   عرض بيانات الطالب
========================= */

function displayStudent(){

    if(!currentStudent){

        return;

    }

    studentInfo.innerHTML = `

        <div class="student-name">

            👤
            ${safe(
                currentStudent.name ||
                "بدون اسم"
            )}

        </div>

        📱 الهاتف:
        ${safe(
            currentStudent.phone ||
            "-"
        )}

        <br>

        🎂 العمر:
        ${safe(
            currentStudent.age ||
            "-"
        )}

        <br>

        👨‍🏫 المدرس:
        ${safe(
            currentStudent.teacher ||
            "لم يتم تحديده"
        )}

        <br>

        🔐 كود الطالب:
        <strong>
        ${safe(
            currentStudent.code ||
            "-"
        )}
        </strong>

    `;

}


/* =========================
   دخول الطالب
========================= */

loginButton.addEventListener(
"click",
async function(){

    const code =
    studentCodeInput.value.trim();

    if(!code){

        showLoginMessage(
            "⚠️ اكتب كود الطالب."
        );

        return;

    }

    if(!/^\d{6}$/.test(code)){

        showLoginMessage(
            "⚠️ كود الطالب يجب أن يكون 6 أرقام."
        );

        return;

    }

    loginButton.disabled =
    true;

    loginButton.textContent =
    "⏳ جاري التحقق...";

    try{

        const studentsQuery =
        query(

            collection(
                db,
                "students"
            ),

            where(
                "code",
                "==",
                code
            )

        );

        const result =
        await getDocs(
            studentsQuery
        );

        if(result.empty){

            showLoginMessage(
                "❌ كود الطالب غير صحيح."
            );

            return;

        }

        const studentDoc =
        result.docs[0];

        const student =
        studentDoc.data();


        if(student.active === false){

            showLoginMessage(
                "⛔ حساب الطالب غير نشط."
            );

            return;

        }


        currentStudent = {

            id:
            studentDoc.id,

            ...student

        };


        localStorage.setItem(

            "jund_alhuda_student",

            JSON.stringify(
                currentStudent
            )

        );


        showLoginMessage("");

        showDashboard();

        displayStudent();

        await loadStudentLessons();


    }catch(error){

        console.error(
            error
        );

        showLoginMessage(
            "❌ تعذر تسجيل الدخول: " +
            error.message
        );

    }finally{

        loginButton.disabled =
        false;

        loginButton.textContent =
        "🔐 دخول الطالب";

    }

});


/* =========================
   Enter
========================= */

studentCodeInput.addEventListener(
"keydown",
function(event){

    if(event.key === "Enter"){

        loginButton.click();

    }

});


/* =========================
   تحميل حصص الطالب فقط
========================= */

async function loadStudentLessons(){

    lessonsList.innerHTML =
    "⏳ جاري تحميل حصصك...";

    if(
        !currentStudent ||
        !currentStudent.id
    ){

        showLogin();

        return;

    }

    try{

        /*
        نبحث فقط عن الحصص التي
        studentId فيها يساوي
        ID الطالب الحالي.
        */

        const lessonsQuery =
        query(

            collection(
                db,
                "liveSessions"
            ),

            where(
                "studentId",
                "==",
                currentStudent.id
            )

        );


        const result =
        await getDocs(
            lessonsQuery
        );


        const lessons = [];


        result.forEach(
        function(item){

            const data =
            item.data();


            /*
            حماية إضافية
            */

            if(
                String(
                    data.studentId || ""
                )
                !==
                String(
                    currentStudent.id
                )
            ){

                return;

            }


            lessons.push({

                id:
                item.id,

                ...data

            });

        });


        if(!lessons.length){

            lessonsList.innerHTML = `

                <div class="empty">

                    📚 لا توجد حصة مخصصة لك حاليًا.

                    <br><br>

                    إذا كانت هناك حصة لطالب آخر
                    فلن تظهر لك.

                </div>

            `;

            return;

        }


        lessons.sort(
        function(a,b){

            const dateA =
            String(
                a.lessonDate || ""
            ) +
            " " +
            String(
                a.startTime || ""
            );


            const dateB =
            String(
                b.lessonDate || ""
            ) +
            " " +
            String(
                b.startTime || ""
            );


            return dateA.localeCompare(
                dateB
            );

        });


        lessonsList.innerHTML =
        "";


        lessons.forEach(
        function(lesson){

            /*
            لا تعرض الحصة إذا كانت
            ليست للطالب الحالي.
            */

            if(
                String(
                    lesson.studentId || ""
                )
                !==
                String(
                    currentStudent.id
                )
            ){

                return;

            }


            const div =
            document.createElement(
                "div"
            );

            div.className =
            "lesson";


            const now =
            new Date();


            let lessonStart =
            null;

            let lessonEnd =
            null;


            if(
                lesson.lessonDate &&
                lesson.startTime
            ){

                lessonStart =
                new Date(
                    lesson.lessonDate +
                    "T" +
                    lesson.startTime
                );

            }


            if(
                lesson.lessonDate &&
                lesson.endTime
            ){

                lessonEnd =
                new Date(
                    lesson.lessonDate +
                    "T" +
                    lesson.endTime
                );

            }


            const lessonIsNow =
            lessonStart &&
            lessonEnd &&
            now >= lessonStart &&
            now <= lessonEnd;


            const lessonFinished =
            lessonEnd &&
            now > lessonEnd;


            let joinArea = "";


            if(
                lesson.status ===
                "cancelled"
            ){

                joinArea = `

                    <div class="wait-button">

                        🔴 هذه الحصة ملغاة

                    </div>

                `;

            }

            else if(
                !lesson.meetingUrl
            ){

                joinArea = `

                    <div class="wait-button">

                        ⚠️ لم يتم إضافة رابط الحصة

                    </div>

                `;

            }

            else if(
                lessonFinished
            ){

                joinArea = `

                    <div class="wait-button">

                        ⏰ انتهت الحصة

                    </div>

                `;

            }

            else if(
                lessonIsNow
            ){

                /*
                مهم:
                لا نرسل رابط Meet مباشرة.

                نرسل sessionId إلى class.html
                لكي يتم التحقق من الطالب مرة أخرى.
                */

                joinArea = `

                    <a
                        href="class.html?sessionId=${encodeURIComponent(
                            lesson.id
                        )}"
                        class="join-button">

                        🎥 دخول الحصة الآن

                    </a>

                `;

            }

            else{

                joinArea = `

                    <div class="wait-button">

                        ⏳ الحصة لم تبدأ بعد

                    </div>

                `;

            }


            let statusText =
            "🟢 مجدولة";


            if(
                lesson.status ===
                "cancelled"
            ){

                statusText =
                "🔴 ملغاة";

            }


            div.innerHTML = `

                <div class="lesson-title">

                    📚
                    ${safe(
                        lesson.subject ||
                        "بدون مادة"
                    )}

                </div>

                👨‍🎓 الطالب:

                <strong>
                ${safe(
                    lesson.studentName ||
                    currentStudent.name ||
                    "-"
                )}
                </strong>

                <br>

                👨‍🏫 المدرس:

                ${safe(
                    lesson.teacherName ||
                    "-"
                )}

                <br>

                📅 التاريخ:

                ${safe(
                    lesson.lessonDate ||
                    "-"
                )}

                <br>

                🟢 بداية الحصة:

                <strong>
                ${safe(
                    lesson.startTime ||
                    "-"
                )}
                </strong>

                <br>

                🔴 نهاية الحصة:

                <strong>
                ${safe(
                    lesson.endTime ||
                    "-"
                )}
                </strong>

                <br>

                📊 الحالة:

                <span class="status">

                    ${statusText}

                </span>

                ${joinArea}

            `;


            lessonsList.appendChild(
                div
            );

        });


        if(
            lessonsList.innerHTML.trim()
            === ""
        ){

            lessonsList.innerHTML = `

                <div class="empty">

                    📚 لا توجد حصة مخصصة لك حاليًا.

                </div>

            `;

        }


    }catch(error){

        console.error(
            "Lessons error:",
            error
        );


        lessonsList.innerHTML = `

            <div class="empty">

                ❌ تعذر تحميل حصص الطالب.

                <br><br>

                ${safe(
                    error.message
                )}

            </div>

        `;

    }

}


/* =========================
   تسجيل الخروج
========================= */

logoutButton.addEventListener(
"click",
function(){

    currentStudent =
    null;

    localStorage.removeItem(
        "jund_alhuda_student"
    );

    studentCodeInput.value =
    "";

    showLogin();

});


/* =========================
   استعادة الطالب
========================= */

async function restoreStudent(){

    try{

        const saved =
        localStorage.getItem(
            "jund_alhuda_student"
        );


        if(!saved){

            showLogin();

            return;

        }


        const savedStudent =
        JSON.parse(
            saved
        );


        if(
            !savedStudent ||
            !savedStudent.code
        ){

            localStorage.removeItem(
                "jund_alhuda_student"
            );

            showLogin();

            return;

        }


        /*
        لا نعتمد على البيانات القديمة
        الموجودة في localStorage.

        نبحث عن الطالب مرة أخرى
        باستخدام الكود.
        */

        const studentsQuery =
        query(

            collection(
                db,
                "students"
            ),

            where(
                "code",
                "==",
                String(
                    savedStudent.code
                )
            )

        );


        const result =
        await getDocs(
            studentsQuery
        );


        if(result.empty){

            localStorage.removeItem(
                "jund_alhuda_student"
            );

            showLogin();

            return;

        }


        const studentDoc =
        result.docs[0];

        const student =
        studentDoc.data();


        if(
            student.active === false
        ){

            localStorage.removeItem(
                "jund_alhuda_student"
            );

            showLogin();

            showLoginMessage(
                "⛔ حساب الطالب غير نشط."
            );

            return;

        }


        currentStudent = {

            id:
            studentDoc.id,

            ...student

        };


        localStorage.setItem(

            "jund_alhuda_student",

            JSON.stringify(
                currentStudent
            )

        );


        showDashboard();

        displayStudent();

        await loadStudentLessons();


    }catch(error){

        console.error(
            "Restore student error:",
            error
        );

        localStorage.removeItem(
            "jund_alhuda_student"
        );

        showLogin();

    }

}


/* =========================
   تشغيل
========================= */

restoreStudent();

console.log(
    "✅ online.html يعمل"
);

</script>

</body>

    </html>
