<script type="module">


/* =========================================
   Firebase
========================================= */

import {
    db
}
from "./firebase.js";


import {
    collection,
    getDocs,
    query,
    where
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================
   العناصر
========================================= */

const loginCard =
document.getElementById(
    "loginCard"
);

const dashboard =
document.getElementById(
    "dashboard"
);

const studentCodeInput =
document.getElementById(
    "studentCode"
);

const loginButton =
document.getElementById(
    "loginButton"
);

const loginMessage =
document.getElementById(
    "loginMessage"
);

const dashboardMessage =
document.getElementById(
    "dashboardMessage"
);

const studentName =
document.getElementById(
    "studentName"
);

const teacherName =
document.getElementById(
    "teacherName"
);

const lessonTime =
document.getElementById(
    "lessonTime"
);

const lessonDuration =
document.getElementById(
    "lessonDuration"
);

const lessonName =
document.getElementById(
    "lessonName"
);

const statusBox =
document.getElementById(
    "statusBox"
);

const statusIcon =
document.getElementById(
    "statusIcon"
);

const statusTitle =
document.getElementById(
    "statusTitle"
);

const countdown =
document.getElementById(
    "countdown"
);

const joinButton =
document.getElementById(
    "joinButton"
);

const logoutButton =
document.getElementById(
    "logoutButton"
);

const meetingBox =
document.getElementById(
    "meetingBox"
);


/* =========================================
   بيانات الطالب والحصة
========================================= */

let currentStudent = null;

let currentLesson = null;

let timer = null;


/* =========================================
   دخول الطالب
========================================= */

loginButton.addEventListener(
    "click",
    async function(){

        const code =
        studentCodeInput.value
        .trim();


        if(!code){

            showLoginError(
                "⚠️ اكتب كود الطالب."
            );

            return;

        }


        if(!/^\d{6}$/.test(code)){

            showLoginError(
                "⚠️ كود الطالب يجب أن يكون 6 أرقام."
            );

            return;

        }


        loginButton.disabled =
        true;

        loginButton.textContent =
        "⏳ جاري التحقق...";


        try{

            /* =========================
               البحث عن الطالب
            ========================= */

            const result =
            await getDocs(
                query(
                    collection(
                        db,
                        "students"
                    ),
                    where(
                        "code",
                        "==",
                        code
                    )
                )
            );


            if(result.empty){

                showLoginError(
                    "❌ كود الطالب غير صحيح."
                );

                return;

            }


            const studentDoc =
            result.docs[0];


            const student =
            studentDoc.data();


            if(student.active === false){

                showLoginError(
                    "🔴 هذا الحساب غير نشط. يرجى مراجعة الإدارة."
                );

                return;

            }


            currentStudent = {

                id:
                studentDoc.id,

                ...student

            };


            /* =========================
               البحث عن حصة الطالب
            ========================= */

            await loadStudentLesson();


            /* =========================
               عرض لوحة الطالب
            ========================= */

            showStudentDashboard();


        }catch(error){

            console.error(
                "Student login error:",
                error
            );


            showLoginError(
                "❌ تعذر الاتصال بالنظام. حاول مرة أخرى."
            );

        }finally{

            loginButton.disabled =
            false;

            loginButton.textContent =
            "دخول الحصة";

        }

    }
);


/* =========================================
   تحميل حصة الطالب من liveSessions
========================================= */

async function loadStudentLesson(){

    currentLesson =
    null;


    try{

        /*
         * نبحث باستخدام studentId
         */

        const result =
        await getDocs(
            query(
                collection(
                    db,
                    "liveSessions"
                ),
                where(
                    "studentId",
                    "==",
                    currentStudent.id
                )
            )
        );


        if(result.empty){

            return;

        }


        /*
         * نختار الحصة المناسبة.
         *
         * إذا كان هناك أكثر من حصة،
         * نختار آخر حصة موجودة.
         */

        const lessons =
        result.docs.map(
            function(item){

                return {

                    id:
                    item.id,

                    ...item.data()

                };

            }
        );


        lessons.sort(
            function(a,b){

                const dateA =
                String(
                    a.lessonDate || ""
                )
                +
                " " +
                String(
                    a.startTime || ""
                );


                const dateB =
                String(
                    b.lessonDate || ""
                )
                +
                " " +
                String(
                    b.startTime || ""
                );


                return dateB.localeCompare(
                    dateA
                );

            }
        );


        /*
         * الحصة الأولى هي الأحدث
         */

        currentLesson =
        lessons[0];


    }catch(error){

        console.error(
            "Load lesson error:",
            error
        );


        throw error;

    }

}


/* =========================================
   عرض الطالب
========================================= */

function showStudentDashboard(){

    loginCard.style.display =
    "none";


    dashboard.style.display =
    "block";


    studentName.textContent =
    "👤 " +
    (
        currentStudent.name ||
        "الطالب"
    );


    /*
     * إذا وجدنا حصة في liveSessions
     */

    if(currentLesson){

        teacherName.textContent =
        currentLesson.teacherName ||
        currentStudent.teacher ||
        "لم يتم تحديد المدرس";


        lessonTime.textContent =
        formatLessonDateTime(
            currentLesson.lessonDate,
            currentLesson.startTime
        );


        lessonDuration.textContent =
        calculateDuration(
            currentLesson.startTime,
            currentLesson.endTime
        );


        lessonName.textContent =
        currentLesson.subject ||
        "الحصة القرآنية";


        /*
         * إظهار رابط Meet للتأكد
         */

        const meetingURL =
        normalizeMeetingUrl(
            currentLesson.meetingUrl
        );


        if(meetingURL){

            meetingBox.textContent =
            "🎥 رابط الحصة: " +
            meetingURL;

            meetingBox.style.display =
            "block";

        }else{

            meetingBox.style.display =
            "none";

        }


    }else{

        /*
         * لا توجد حصة في liveSessions
         */

        teacherName.textContent =
        currentStudent.teacher ||
        "لم يتم تحديد المدرس";


        lessonTime.textContent =
        "لا توجد حصة مجدولة";


        lessonDuration.textContent =
        "30 دقيقة";


        lessonName.textContent =
        "الحصة القرآنية";


        meetingBox.style.display =
        "none";

    }


    startLessonTimer();

}


/* =========================================
   حساب مدة الحصة
========================================= */

function calculateDuration(
    start,
    end
){

    if(!start || !end){

        return "30 دقيقة";

    }


    const startParts =
    String(start).split(":");


    const endParts =
    String(end).split(":");


    if(
        startParts.length < 2 ||
        endParts.length < 2
    ){

        return "30 دقيقة";

    }


    const startMinutes =
    Number(startParts[0]) * 60 +
    Number(startParts[1]);


    const endMinutes =
    Number(endParts[0]) * 60 +
    Number(endParts[1]);


    const duration =
    endMinutes -
    startMinutes;


    if(duration <= 0){

        return "30 دقيقة";

    }


    return duration +
    " دقيقة";

}


/* =========================================
   تشغيل المؤقت
========================================= */

function startLessonTimer(){

    if(timer){

        clearInterval(timer);

    }


    updateLessonStatus();


    timer =
    setInterval(
        updateLessonStatus,
        1000
    );

}


/* =========================================
   حالة الحصة
========================================= */

function updateLessonStatus(){

    if(!currentStudent){

        return;

    }


    /*
     * يجب وجود حصة من الإدارة
     */

    if(!currentLesson){

        setWaitingStatus(
            "⏳ لا توجد حصة مجدولة",
            "يرجى مراجعة الإدارة."
        );

        return;

    }


    const date =
    currentLesson.lessonDate;


    const startTime =
    currentLesson.startTime;


    const endTime =
    currentLesson.endTime;


    if(!date || !startTime){

        setWaitingStatus(
            "⚠️ بيانات الحصة غير مكتملة",
            "يرجى مراجعة الإدارة."
        );

        return;

    }


    const start =
    getLessonDate(
        date,
        startTime
    );


    if(!start){

        setWaitingStatus(
            "⚠️ موعد الحصة غير صحيح",
            "يرجى مراجعة الإدارة."
        );

        return;

    }


    let end;


    if(endTime){

        end =
        getLessonDate(
            date,
            endTime
        );

    }


    /*
     * إذا لم يوجد وقت انتهاء
     * نستخدم 30 دقيقة
     */

    if(!end){

        end =
        new Date(
            start.getTime() +
            30 * 60 * 1000
        );

    }


    const now =
    new Date();


    /*
     * قبل الحصة
     */

    if(now < start){

        const difference =
        start.getTime() -
        now.getTime();


        setWaitingStatus(
            "⏳ لم تبدأ الحصة بعد",
            "موعد حصتك:"
        );


        countdown.textContent =
        formatCountdown(
            difference
        );


        return;

    }


    /*
     * الحصة الآن
     */

    if(
        now >= start &&
        now < end
    ){

        setReadyStatus(
            end.getTime() -
            now.getTime()
        );


        return;

    }


    /*
     * انتهت الحصة
     */

    setFinishedStatus();

}


/* =========================================
   تحويل تاريخ ووقت الحصة
========================================= */

function getLessonDate(
    dateValue,
    timeValue
){

    const dateText =
    String(
        dateValue || ""
    ).trim();


    const timeText =
    String(
        timeValue || ""
    ).trim();


    const dateMatch =
    dateText.match(
        /^(\d{4})-(\d{2})-(\d{2})$/
    );


    const timeMatch =
    timeText.match(
        /^(\d{1,2}):(\d{2})$/
    );


    if(
        !dateMatch ||
        !timeMatch
    ){

        return null;

    }


    const year =
    Number(
        dateMatch[1]
    );


    const month =
    Number(
        dateMatch[2]
    ) - 1;


    const day =
    Number(
        dateMatch[3]
    );


    const hour =
    Number(
        timeMatch[1]
    );


    const minute =
    Number(
        timeMatch[2]
    );


    if(
        month < 0 ||
        month > 11 ||
        day < 1 ||
        day > 31 ||
        hour < 0 ||
        hour > 23 ||
        minute < 0 ||
        minute > 59
    ){

        return null;

    }


    return new Date(
        year,
        month,
        day,
        hour,
        minute,
        0,
        0
    );

}


/* =========================================
   عرض تاريخ ووقت الحصة
========================================= */

function formatLessonDateTime(
    date,
    time
){

    if(!date && !time){

        return "لم يتم تحديد الموعد";

    }


    let result = "";


    if(date){

        result +=
        formatDateArabic(
            date
        );

    }


    if(time){

        if(result){

            result +=
            " — ";

        }


        result +=
        formatLessonTime(
            time
        );

    }


    return result ||
    "لم يتم تحديد الموعد";

}


/* =========================================
   تنسيق التاريخ
========================================= */

function formatDateArabic(
    value
){

    const date =
    new Date(
        String(value) +
        "T00:00:00"
    );


    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return value;

    }


    return date.toLocaleDateString(
        "ar-SA",
        {
            year:"numeric",
            month:"long",
            day:"numeric"
        }
    );

}


/* =========================================
   تحويل الوقت
========================================= */

function formatLessonTime(
    value
){

    if(!value){

        return "لم يتم تحديد الموعد";

    }


    const match =
    String(
        value
    ).match(
        /^(\d{1,2}):(\d{2})$/
    );


    if(!match){

        return value;

    }


    let hour =
    Number(
        match[1]
    );


    const minute =
    match[2];


    const period =
    hour >= 12
    ?
    "مساءً"
    :
    "صباحًا";


    hour =
    hour % 12 ||
    12;


    return (
        hour +
        ":" +
        minute +
        " " +
        period
    );

}


/* =========================================
   قبل الحصة
========================================= */

function setWaitingStatus(
    title,
    text
){

    statusBox.className =
    "status-box waiting";


    statusIcon.textContent =
    "⏳";


    statusTitle.textContent =
    title;


    if(text){

        countdown.textContent =
        text;

    }else{

        countdown.textContent =
        "";

    }


    joinButton.style.display =
    "none";

}


/* =========================================
   الحصة بدأت
========================================= */

function setReadyStatus(
    remaining
){

    statusBox.className =
    "status-box ready";


    statusIcon.textContent =
    "🟢";


    statusTitle.textContent =
    "الحصة متاحة الآن";


    countdown.textContent =
    "الوقت المتبقي: " +
    formatCountdown(
        remaining
    );


    /*
     * إظهار زر الدخول
     */

    joinButton.style.display =
    "block";

}


/* =========================================
   انتهاء الحصة
========================================= */

function setFinishedStatus(){

    statusBox.className =
    "status-box finished";


    statusIcon.textContent =
    "🔴";


    statusTitle.textContent =
    "انتهت الحصة";


    countdown.textContent =
    "انتهى وقت الحصة.";


    joinButton.style.display =
    "none";

}


/* =========================================
   تطبيع رابط Google Meet
========================================= */

function normalizeMeetingUrl(
    value
){

    let url =
    String(
        value || ""
    ).trim();


    if(!url){

        return "";

    }


    /*
     * إذا كتب المدير:
     *
     * meet.google.com/usr-jfhn-hxs
     *
     * نضيف https://
     */

    if(
        !/^https?:\/\//i.test(
            url
        )
    ){

        url =
        "https://" +
        url;

    }


    return url;

}


/* =========================================
   زر دخول الحصة
========================================= */

joinButton.addEventListener(
    "click",
    function(){

        /*
         * الرابط يأتي من liveSessions
         */

        if(!currentLesson){

            showDashboardMessage(
                "⚠️ لم يتم العثور على الحصة.",
                false
            );

            return;

        }


        const meetingURL =
        normalizeMeetingUrl(
            currentLesson.meetingUrl
        );


        if(!meetingURL){

            showDashboardMessage(
                "⚠️ الحصة بدأت، لكن الإدارة لم تضع رابط Google Meet بعد.",
                false
            );

            return;

        }


        /*
         * فتح Google Meet
         */

        window.open(
            meetingURL,
            "_blank",
            "noopener,noreferrer"
        );

    }
);

/* =========================================
   العد التنازلي
========================================= */

function formatCountdown(
    milliseconds
){

    if(milliseconds <= 0){

        return "00:00:00";

    }


    let totalSeconds =
    Math.floor(
        milliseconds / 1000
    );


    const hours =
    Math.floor(
        totalSeconds / 3600
    );


    totalSeconds %=
    3600;


    const minutes =
    Math.floor(
        totalSeconds / 60
    );


    const seconds =
    totalSeconds %
    60;


    return (
        String(hours)
        .padStart(2,"0")
        +
        ":" +
        String(minutes)
        .padStart(2,"0")
        +
        ":" +
        String(seconds)
        .padStart(2,"0")
    );

}


/* =========================================
   رسالة تسجيل الدخول
========================================= */

function showLoginError(
    text
){

    loginMessage.textContent =
    text;


    loginMessage.style.display =
    text
    ?
    "block"
    :
    "none";

}


/* =========================================
   رسالة لوحة الطالب
========================================= */

function showDashboardMessage(
    text,
    success
){

    dashboardMessage.textContent =
    text;


    dashboardMessage.className =
    "message " +
    (
        success
        ?
        "success"
        :
        "error"
    );


    dashboardMessage.style.display =
    "block";


    setTimeout(
        function(){

            dashboardMessage.style.display =
            "none";

        },
        5000
    );

}
