<script type="module">


/* =========================================
   Firebase
========================================= */

import {
    db
}
from "./firebase.js";


import {
    collection,
    getDocs,
    query,
    where
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================
   العناصر
========================================= */

const loginCard =
document.getElementById(
    "loginCard"
);

const dashboard =
document.getElementById(
    "dashboard"
);

const studentCodeInput =
document.getElementById(
    "studentCode"
);

const loginButton =
document.getElementById(
    "loginButton"
);

const loginMessage =
document.getElementById(
    "loginMessage"
);

const dashboardMessage =
document.getElementById(
    "dashboardMessage"
);

const studentName =
document.getElementById(
    "studentName"
);

const teacherName =
document.getElementById(
    "teacherName"
);

const lessonTime =
document.getElementById(
    "lessonTime"
);

const lessonDuration =
document.getElementById(
    "lessonDuration"
);

const lessonName =
document.getElementById(
    "lessonName"
);

const statusBox =
document.getElementById(
    "statusBox"
);

const statusIcon =
document.getElementById(
    "statusIcon"
);

const statusTitle =
document.getElementById(
    "statusTitle"
);

const countdown =
document.getElementById(
    "countdown"
);

const joinButton =
document.getElementById(
    "joinButton"
);

const logoutButton =
document.getElementById(
    "logoutButton"
);

const meetingBox =
document.getElementById(
    "meetingBox"
);


/* =========================================
   البيانات
========================================= */

let currentStudent = null;

let currentLesson = null;

let timer = null;


/* =========================================
   إصلاح رابط Google Meet
========================================= */

function fixMeetingUrl(url){

    let fixedUrl =
    String(
        url || ""
    ).trim();


    if(!fixedUrl){

        return "";

    }


    if(
        !fixedUrl.startsWith("https://") &&
        !fixedUrl.startsWith("http://")
    ){

        fixedUrl =
        "https://" +
        fixedUrl;

    }


    return fixedUrl;

}


/* =========================================
   دخول الطالب
========================================= */

loginButton.addEventListener(
    "click",
    async function(){

        const code =
        studentCodeInput.value.trim();


        if(!code){

            showLoginError(
                "⚠️ اكتب كود الطالب."
            );

            return;

        }


        if(!/^\d{6}$/.test(code)){

            showLoginError(
                "⚠️ كود الطالب يجب أن يكون 6 أرقام."
            );

            return;

        }


        loginButton.disabled =
        true;

        loginButton.textContent =
        "⏳ جاري التحقق...";


        try{

            const result =
            await getDocs(
                query(
                    collection(
                        db,
                        "students"
                    ),
                    where(
                        "code",
                        "==",
                        code
                    )
                )
            );


            if(result.empty){

                showLoginError(
                    "❌ كود الطالب غير صحيح."
                );

                return;

            }


            const studentDoc =
            result.docs[0];


            const student =
            studentDoc.data();


            if(student.active === false){

                showLoginError(
                    "🔴 هذا الحساب غير نشط. يرجى مراجعة الإدارة."
                );

                return;

            }


            currentStudent = {

                id:
                studentDoc.id,

                ...student

            };


            await loadStudentLesson();


            showStudentDashboard();


        }catch(error){

            console.error(
                "Student login error:",
                error
            );


            showLoginError(
                "❌ تعذر الاتصال بالنظام. حاول مرة أخرى."
            );

        }finally{

            loginButton.disabled =
            false;

            loginButton.textContent =
            "دخول الحصة";

        }

    }
);


/* =========================================
   تحميل حصة الطالب
========================================= */

async function loadStudentLesson(){

    currentLesson =
    null;


    /*
    البحث أولًا بواسطة studentId
    */

    let result =
    await getDocs(
        query(
            collection(
                db,
                "liveSessions"
            ),
            where(
                "studentId",
                "==",
                currentStudent.id
            )
        )
    );


    /*
    إذا لم نجد الحصة بواسطة studentId
    نبحث باسم الطالب
    */

    if(result.empty){

        result =
        await getDocs(
            query(
                collection(
                    db,
                    "liveSessions"
                ),
                where(
                    "studentName",
                    "==",
                    currentStudent.name
                )
            )
        );

    }


    if(result.empty){

        return;

    }


    const lessons =
    result.docs.map(
        function(item){

            return {

                id:
                item.id,

                ...item.data()

            };

        }
    );


    /*
    ترتيب الحصص
    */

    lessons.sort(
        function(a,b){

            const dateA =
            String(
                a.lessonDate || ""
            )
            +
            " " +
            String(
                a.startTime || ""
            );


            const dateB =
            String(
                b.lessonDate || ""
            )
            +
            " " +
            String(
                b.startTime || ""
            );


            return dateA.localeCompare(
                dateB
            );

        }
    );


    /*
    اختيار أقرب حصة مستقبلية
    أو آخر حصة إذا لم توجد مستقبلية
    */

    const now =
    new Date();


    let selectedLesson =
    null;


    for(
        const lesson
        of lessons
    ){

        const start =
        getLessonDate(
            lesson.lessonDate,
            lesson.startTime
        );


        if(
            start &&
            start >= now &&
            lesson.status !== "cancelled"
        ){

            selectedLesson =
            lesson;

            break;

        }

    }


    /*
    إذا لم توجد حصة مستقبلية
    نأخذ آخر حصة
    */

    if(!selectedLesson){

        selectedLesson =
        lessons[lessons.length - 1];

    }


    currentLesson =
    selectedLesson;

}


/* =========================================
   عرض الطالب
========================================= */

function showStudentDashboard(){

    loginCard.style.display =
    "none";


    dashboard.style.display =
    "block";


    studentName.textContent =
    "👤 " +
    (
        currentStudent.name ||
        "الطالب"
    );


    if(currentLesson){

        teacherName.textContent =
        currentLesson.teacherName ||
        "لم يتم تحديد المدرس";


        lessonTime.textContent =
        formatLessonDateTime(
            currentLesson.lessonDate,
            currentLesson.startTime
        );


        lessonDuration.textContent =
        calculateDuration(
            currentLesson.startTime,
            currentLesson.endTime
        );


        lessonName.textContent =
        currentLesson.subject ||
        "الحصة القرآنية";


        /*
        =====================================
        رابط الحصة من Firebase
        =====================================
        */

        const meetingUrl =
        fixMeetingUrl(
            currentLesson.meetingUrl
        );


        if(meetingUrl){

            meetingBox.textContent =
            "🎥 رابط الحصة: " +
            meetingUrl;


            meetingBox.style.display =
            "block";

        }else{

            meetingBox.textContent =
            "⚠️ لم يتم إضافة رابط الحصة من الإدارة";


            meetingBox.style.display =
            "block";

        }

    }else{

        teacherName.textContent =
        currentStudent.teacher ||
        "لم يتم تحديد المدرس";


        lessonTime.textContent =
        "لا توجد حصة مجدولة";


        lessonDuration.textContent =
        "30 دقيقة";


        lessonName.textContent =
        "الحصة القرآنية";


        meetingBox.textContent =
        "⚠️ لا توجد حصة مرتبطة بهذا الطالب";


        meetingBox.style.display =
        "block";

    }


    startLessonTimer();

}


/* =========================================
   حساب مدة الحصة
========================================= */

function calculateDuration(
    start,
    end
){

    if(!start || !end){

        return "30 دقيقة";

    }


    const startParts =
    String(start).split(":");


    const endParts =
    String(end).split(":");


    if(
        startParts.length < 2 ||
        endParts.length < 2
    ){

        return "30 دقيقة";

    }


    const startMinutes =
    Number(startParts[0]) * 60 +
    Number(startParts[1]);


    const endMinutes =
    Number(endParts[0]) * 60 +
    Number(endParts[1]);


    const duration =
    endMinutes -
    startMinutes;


    if(duration <= 0){

        return "30 دقيقة";

    }


    return duration +
    " دقيقة";

}


/* =========================================
   المؤقت
========================================= */

function startLessonTimer(){

    if(timer){

        clearInterval(timer);

    }


    updateLessonStatus();


    timer =
    setInterval(
        updateLessonStatus,
        1000
    );

}


/* =========================================
   حالة الحصة
========================================= */

function updateLessonStatus(){

    if(!currentStudent){

        return;

    }


    if(!currentLesson){

        setWaitingStatus(
            "⏳ لا توجد حصة مجدولة",
            "يرجى مراجعة الإدارة."
        );

        return;

    }


    if(
        currentLesson.status ===
        "cancelled"
    ){

        setWaitingStatus(
            "🔴 الحصة ملغاة",
            "يرجى مراجعة الإدارة."
        );

        return;

    }


    const date =
    currentLesson.lessonDate;


    const startTime =
    currentLesson.startTime;


    const endTime =
    currentLesson.endTime;


    if(!date || !startTime){

        setWaitingStatus(
            "⚠️ بيانات الحصة غير مكتملة",
            "يرجى مراجعة الإدارة."
        );

        return;

    }


    const start =
    getLessonDate(
        date,
        startTime
    );


    if(!start){

        setWaitingStatus(
            "⚠️ موعد الحصة غير صحيح",
            "يرجى مراجعة الإدارة."
        );

        return;

    }


    let end =
    getLessonDate(
        date,
        endTime
    );


    if(!end){

        end =
        new Date(
            start.getTime()
            +
            30 * 60 * 1000
        );

    }


    const now =
    new Date();


    if(now < start){

        setWaitingStatus(
            "⏳ لم تبدأ الحصة بعد",
            "موعد حصتك:"
        );


        countdown.textContent =
        formatCountdown(
            start.getTime()
            -
            now.getTime()
        );


        return;

    }


    if(
        now >= start &&
        now < end
    ){

        setReadyStatus(
            end.getTime()
            -
            now.getTime()
        );


        return;

    }


    setFinishedStatus();

}


/* =========================================
   قبل الحصة
========================================= */

function setWaitingStatus(
    title,
    text
){

    statusBox.className =
    "status-box waiting";


    statusIcon.textContent =
    "⏳";


    statusTitle.textContent =
    title;


    countdown.textContent =
    text || "";


    joinButton.style.display =
    "none";

}


/* =========================================
   الحصة متاحة
========================================= */

function setReadyStatus(
    remaining
){

    statusBox.className =
    "status-box ready";


    statusIcon.textContent =
    "🟢";


    statusTitle.textContent =
    "الحصة متاحة الآن";


    countdown.textContent =
    "الوقت المتبقي: " +
    formatCountdown(
        remaining
    );


    /*
    إظهار زر الدخول فقط إذا
    كان هناك رابط محفوظ في Firebase
    */

    const meetingUrl =
    fixMeetingUrl(
        currentLesson.meetingUrl
    );


    if(meetingUrl){

        joinButton.style.display =
        "block";

    }else{

        joinButton.style.display =
        "none";

        countdown.textContent =
        "⚠️ لم يتم إضافة رابط الحصة من الإدارة";

    }

}


/* =========================================
   انتهاء الحصة
========================================= */

function setFinishedStatus(){

    statusBox.className =
    "status-box finished";


    statusIcon.textContent =
    "🔴";


    statusTitle.textContent =
    "انتهت الحصة";


    countdown.textContent =
    "انتهى وقت الحصة.";


    joinButton.style.display =
    "none";

}


/* =========================================
   دخول Google Meet
========================================= */

joinButton.addEventListener(
    "click",
    function(){

        if(!currentLesson){

            return;

        }


        const meetingUrl =
        fixMeetingUrl(
            currentLesson.meetingUrl
        );


        if(!meetingUrl){

            alert(
                "⚠️ لم يتم إضافة رابط الحصة."
            );

            return;

        }


        window.open(
            meetingUrl,
            "_blank"
        );

    }
);


/* =========================================
   إنشاء تاريخ الحصة
========================================= */

function getLessonDate(
    dateValue,
    timeValue
){

    if(!dateValue || !timeValue){

        return null;

    }


    const dateMatch =
    String(dateValue).match(
        /^(\d{4})-(\d{2})-(\d{2})$/
    );


    const timeMatch =
    String(timeValue).match(
        /^(\d{1,2}):(\d{2})$/
    );


    if(
        !dateMatch ||
        !timeMatch
    ){

        return null;

    }


    const year =
    Number(dateMatch[1]);


    const month =
    Number(dateMatch[2]) - 1;


    const day =
    Number(dateMatch[3]);


    const hour =
    Number(timeMatch[1]);


    const minute =
    Number(timeMatch[2]);


    return new Date(
        year,
        month,
        day,
        hour,
        minute,
        0,
        0
    );

}


/* =========================================
   تنسيق الموعد
========================================= */

function formatLessonDateTime(
    date,
    time
){

    let result = "";


    if(date){

        result =
        formatDateArabic(
            date
        );

    }


    if(time){

        if(result){

            result +=
            " — ";

        }


        result +=
        formatLessonTime(
            time
        );

    }


    return result ||
    "لم يتم تحديد الموعد";

}


/* =========================================
   التاريخ
========================================= */

function formatDateArabic(
    value
){

    const date =
    new Date(
        String(value)
        +
        "T00:00:00"
    );


    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return value;

    }


    return date.toLocaleDateString(
        "ar-SA",
        {
            year:"numeric",
            month:"long",
            day:"numeric"
        }
    );

}


/* =========================================
   الوقت
========================================= */

function formatLessonTime(
    value
){

    const match =
    String(value)
    .match(
        /^(\d{1,2}):(\d{2})$/
    );


    if(!match){

        return value;

    }


    let hour =
    Number(match[1]);


    const minute =
    match[2];


    const period =
    hour >= 12
    ?
    "مساءً"
    :
    "صباحًا";


    hour =
    hour % 12 || 12;


    return (
        hour +
        ":" +
        minute +
        " " +
        period
    );

}


/* =========================================
   العد التنازلي
========================================= */

function formatCountdown(
    milliseconds
){

    if(milliseconds <= 0){

        return "00:00:00";

    }


    let totalSeconds =
    Math.floor(
        milliseconds / 1000
    );


    const hours =
    Math.floor(
        totalSeconds / 3600
    );


    totalSeconds %=
    3600;


    const minutes =
    Math.floor(
        totalSeconds / 60
    );


    const seconds =
    totalSeconds %
    60;


    return (
        String(hours)
        .padStart(2,"0")
        +
        ":" +
        String(minutes)
        .padStart(2,"0")
        +
        ":" +
        String(seconds)
        .padStart(2,"0")
    );

}

/* =========================================
   رسالة الدخول
========================================= */

function showLoginError(
    text
){

    loginMessage.textContent =
    text;


    loginMessage.style.display =
    text
    ?
    "block"
    :
    "none";

}


/* =========================================
   رسالة لوحة الطالب
========================================= */

function showDashboardMessage(
    text,
    success
){

    dashboardMessage.textContent =
    text;


    dashboardMessage.className =
    "message " +
    (
        success
        ?
        "success"
        :
        "error"
    );


    dashboardMessage.style.display =
    "block";


    setTimeout(
        function(){

            dashboardMessage.style.display =
            "none";

        },
        5000
    );

}
