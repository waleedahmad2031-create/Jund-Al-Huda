<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>الحصة المباشرة | جنود الهدى</title><style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    background:#f4f7f5;
    color:#222;
}

header{
    background:linear-gradient(135deg,#075e54,#0b806f);
    color:white;
    text-align:center;
    padding:25px 15px;
}

.logo{
    font-size:42px;
}

header h1{
    font-size:27px;
}

header p{
    margin-top:5px;
}

.container{
    max-width:800px;
    margin:auto;
    padding:20px 14px;
}

.card{
    background:white;
    border-radius:18px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 4px 15px rgba(0,0,0,.07);
}

h2{
    color:#075e54;
    text-align:center;
    margin-bottom:18px;
}

.room-box{
    display:grid;
    gap:12px;
}

input,
select{
    width:100%;
    padding:15px;
    border:1px solid #ddd;
    border-radius:11px;
    font-size:17px;
    outline:none;
    text-align:center;
}

input:focus,
select:focus{
    border-color:#075e54;
}

button{
    width:100%;
    border:0;
    border-radius:11px;
    padding:14px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.primary{
    background:#075e54;
    color:white;
}

.secondary{
    background:#0b806f;
    color:white;
}

.danger{
    background:#dc3545;
    color:white;
}

.muted{
    background:#555;
    color:white;
}

.status{
    margin-top:15px;
    padding:14px;
    border-radius:11px;
    text-align:center;
    line-height:1.8;
}

.waiting{
    background:#fff8e1;
    color:#856404;
}

.success{
    background:#e8f7f2;
    color:#075e54;
}

.error{
    background:#ffe8e8;
    color:#a00000;
}

.videos{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:15px;
}

.video-box{
    position:relative;
    background:#111;
    border-radius:15px;
    overflow:hidden;
    min-height:220px;
}

video{
    width:100%;
    height:100%;
    min-height:220px;
    object-fit:cover;
    background:#111;
}

.video-title{
    position:absolute;
    bottom:8px;
    right:8px;
    background:rgba(0,0,0,.65);
    color:white;
    padding:5px 9px;
    border-radius:7px;
    font-size:13px;
}

.controls{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
    margin-top:15px;
}

.controls button{
    font-size:14px;
}

.hidden{
    display:none !important;
}

.room-id{
    background:#f1f6f5;
    padding:12px;
    border-radius:10px;
    text-align:center;
    margin-top:12px;
    word-break:break-all;
}

.note{
    background:#f8faf9;
    color:#666;
    padding:14px;
    border-radius:10px;
    margin-top:15px;
    text-align:center;
    font-size:13px;
    line-height:1.8;
}

@media(max-width:600px){

    .videos{
        grid-template-columns:1fr;
    }

    .video-box,
    video{
        min-height:250px;
    }

    .controls{
        grid-template-columns:1fr;
    }

}

</style></head><body><header><div class="logo">🕌</div><h1>جنود الهدى</h1><p>الحصة المباشرة</p></header><div class="container"><div
id="setupCard"
class="card"><h2>
🎥 بدء / دخول الحصة
</h2><div class="room-box"><select id="role"><option value="teacher">
👨‍🏫 المدرس
</option><option value="student">
👨‍🎓 الطالب
</option></select><input
id="roomInput"
type="text"
placeholder="اكتب رقم الحصة مثل 1234"
maxlength="30"
autocomplete="off">

<button
id="startButton"
class="primary">

🎥 دخول الحصة

</button></div><div
id="setupStatus"
class="status waiting">اكتب رقم الحصة ثم اضغط دخول.

</div><div class="note">للتجربة فقط: افتح هذه الصفحة في هاتفين،
واستخدم نفس رقم الحصة في الهاتفين.

</div></div><div
id="callCard"
class="card hidden"><h2>
📹 الحصة المباشرة
</h2><div
id="roomInfo"
class="room-id">
</div><div class="videos"><div class="video-box"><video
id="localVideo"
autoplay
playsinline
muted>
</video>

<div class="video-title">
جهازك
</div></div><div class="video-box"><video
id="remoteVideo"
autoplay
playsinline>
</video>

<div class="video-title">
الطرف الآخر
</div></div></div><div class="controls"><button
id="micButton"
class="secondary">

🎙️ كتم الميكروفون

</button><button
id="cameraButton"
class="secondary">

📷 إيقاف الكاميرا

</button><button
id="leaveButton"
class="danger">

🔴 إنهاء الحصة

</button></div><div
id="callStatus"
class="status waiting">⏳ جاري الاتصال...

</div></div></div><script type="module">


/* =========================================
   Firebase
========================================= */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getFirestore,
    doc,
    setDoc,
    updateDoc,
    getDoc,
    collection,
    addDoc,
    onSnapshot,
    deleteDoc
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================
   إعداد Firebase
========================================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyBCnQWX_kKckwncvS9rnfi5YHsDbCWhtoU",

    authDomain:
    "jundalhuda.firebaseapp.com",

    projectId:
    "jundalhuda",

    storageBucket:
    "jundalhuda.firebasestorage.app",

    messagingSenderId:
    "275883570506",

    appId:
    "1:275883570506:web:fb5e72953a3d5a66ef3db3",

    measurementId:
    "G-ZZNZKN73BQ"

};


const app =
initializeApp(firebaseConfig);


const db =
getFirestore(app);


/* =========================================
   العناصر
========================================= */

const setupCard =
document.getElementById("setupCard");

const callCard =
document.getElementById("callCard");

const role =
document.getElementById("role");

const roomInput =
document.getElementById("roomInput");

const startButton =
document.getElementById("startButton");

const setupStatus =
document.getElementById("setupStatus");

const localVideo =
document.getElementById("localVideo");

const remoteVideo =
document.getElementById("remoteVideo");

const roomInfo =
document.getElementById("roomInfo");

const callStatus =
document.getElementById("callStatus");

const micButton =
document.getElementById("micButton");

const cameraButton =
document.getElementById("cameraButton");

const leaveButton =
document.getElementById("leaveButton");


/* =========================================
   المتغيرات
========================================= */

let peerConnection = null;

let localStream = null;

let roomRef = null;

let unsubscribeRoom = null;

let unsubscribeCandidates = null;

let currentRole = null;

let currentRoom = null;


/* =========================================
   خوادم STUN
========================================= */

const configuration = {

    iceServers:[

        {
            urls:
            "stun:stun.l.google.com:19302"
        },

        {
            urls:
            "stun:stun1.l.google.com:19302"
        }

    ]

};


/* =========================================
   بدء الحصة
========================================= */

startButton.addEventListener(
    "click",
    async function(){

        const room =
        roomInput.value.trim();


        if(!room){

            showSetupError(
                "⚠️ اكتب رقم الحصة أولًا."
            );

            return;

        }


        currentRole =
        role.value;


        currentRoom =
        room;


        startButton.disabled =
        true;


        startButton.textContent =
        "⏳ جاري التجهيز...";


        try{

            await startCall(room);

        }catch(error){

            console.error(error);


            showSetupError(
                "❌ تعذر تشغيل الحصة. "
                +
                "تأكد من السماح بالكاميرا والميكروفون."
            );


            startButton.disabled =
            false;

            startButton.textContent =
            "🎥 دخول الحصة";

        }

    }
);


/* =========================================
   تشغيل الاتصال
========================================= */

async function startCall(room){

    /*
    الحصول على الكاميرا والميكروفون
    */

    localStream =
    await navigator.mediaDevices.getUserMedia({

        video:true,

        audio:true

    });


    localVideo.srcObject =
    localStream;


    /*
    إنشاء PeerConnection
    */

    peerConnection =
    new RTCPeerConnection(
        configuration
    );


    localStream
    .getTracks()
    .forEach(function(track){

        peerConnection.addTrack(
            track,
            localStream
        );

    });


    /*
    استقبال فيديو الطرف الآخر
    */

    peerConnection.ontrack =
    function(event){

        if(
            event.streams &&
            event.streams[0]
        ){

            remoteVideo.srcObject =
            event.streams[0];

        }

    };


    /*
    غرفة Firestore
    */

    roomRef =
    doc(
        db,
        "liveSessions",
        room
    );


    /*
    مرشح الاتصال ICE
    */

    peerConnection.onicecandidate =
    async function(event){

        if(!event.candidate){

            return;

        }


        const candidateData = {

            candidate:
            event.candidate.candidate,

            sdpMid:
            event.candidate.sdpMid,

            sdpMLineIndex:
            event.candidate.sdpMLineIndex

        };


        const side =
        currentRole === "teacher"
        ?
        "teacherCandidates"
        :
        "studentCandidates";


        await addDoc(

            collection(
                roomRef,
                side
            ),

            candidateData

        );

    };


    /*
    =====================================
    المدرس
    =====================================
    */

    if(currentRole === "teacher"){

        await createTeacherRoom();

    }


    /*
    =====================================
    الطالب
    =====================================
    */

    else{

        await joinStudentRoom();

    }


    setupCard.classList.add(
        "hidden"
    );

    callCard.classList.remove(
        "hidden"
    );


    roomInfo.textContent =
    "رقم الحصة: " + room;


    callStatus.className =
    "status waiting";


    callStatus.textContent =
    "⏳ جاري انتظار الطرف الآخر...";

}


/* =========================================
   إنشاء غرفة المدرس
========================================= */

async function createTeacherRoom(){

    const offer =
    await peerConnection.createOffer();


    await peerConnection.setLocalDescription(
        offer
    );


    await setDoc(
        roomRef,
        {

            role:
            "teacher",

            createdAt:
            new Date().toISOString(),

            offer:{

                type:
                offer.type,

                sdp:
                offer.sdp

            }

        },
        {
            merge:true
        }
    );


    /*
    مراقبة إجابة الطالب
    */

    unsubscribeRoom =
    onSnapshot(
        roomRef,
        async function(snapshot){

            if(!snapshot.exists()){

                return;

            }


            const data =
            snapshot.data();


            if(
                data.answer &&
                !peerConnection.currentRemoteDescription
            ){

                await peerConnection.setRemoteDescription(

                    new RTCSessionDescription(
                        data.answer
                    )

                );


                callStatus.className =
                "status success";


                callStatus.textContent =
                "🟢 تم اتصال الطالب.";

            }

        }
    );


    /*
    استقبال مرشحات الطالب
    */

    unsubscribeCandidates =
    onSnapshot(

        collection(
            roomRef,
            "studentCandidates"
        ),

        function(snapshot){

            snapshot.docChanges()
            .forEach(
                async function(change){

                    if(
                        change.type !==
                        "added"
                    ){

                        return;

                    }


                    const data =
                    change.doc.data();


                    try{

                        await peerConnection.addIceCandidate(

                            new RTCIceCandidate(
                                data
                            )

                        );

                    }catch(error){

                        console.error(error);

                    }

                }
            );

        }

    );

}


/* =========================================
   دخول الطالب
========================================= */

async function joinStudentRoom(){

    const snapshot =
    await getDoc(
        roomRef
    );


    if(!snapshot.exists()){

        throw new Error(
            "الغرفة غير موجودة"
        );

    }


    const data =
    snapshot.data();


    if(!data.offer){

        throw new Error(
            "لم يبدأ المدرس الحصة"
        );

    }


    await peerConnection.setRemoteDescription(

        new RTCSessionDescription(
            data.offer
        )

    );


    const answer =
    await peerConnection.createAnswer();


    await peerConnection.setLocalDescription(
        answer
    );


    await updateDoc(
        roomRef,
        {

            answer:{

                type:
                answer.type,

                sdp:
                answer.sdp

            }

        }
    );


    /*
    استقبال مرشحات المدرس
    */

    unsubscribeCandidates =
    onSnapshot(

        collection(
            roomRef,
            "teacherCandidates"
        ),

        function(snapshot){

            snapshot.docChanges()
            .forEach(
                async function(change){

                    if(
                        change.type !==
                        "added"
                    ){

                        return;

                    }


                    const data =
                    change.doc.data();


                    try{

                        await peerConnection.addIceCandidate(

                            new RTCIceCandidate(
                                data
                            )

                        );

                    }catch(error){

                        console.error(error);

                    }

                }
            );

        }

    );


    callStatus.className =
    "status success";


    callStatus.textContent =
    "🟢 تم إرسال طلب الاتصال للمدرس.";

}


/* =========================================
   الميكروفون
========================================= */

micButton.addEventListener(
    "click",
    function(){

        if(!localStream){

            return;

        }


        const audioTracks =
        localStream.getAudioTracks();


        if(!audioTracks.length){

            return;

        }


        const enabled =
        audioTracks[0].enabled;


        audioTracks.forEach(
            function(track){

                track.enabled =
                !enabled;

            }
        );


        if(enabled){

            micButton.textContent =
            "🎙️ تشغيل الميكروفون";

        }else{

            micButton.textContent =
            "🔇 كتم الميكروفون";

        }

    }
);


/* =========================================
   الكاميرا
========================================= */

cameraButton.addEventListener(
    "click",
    function(){

        if(!localStream){

            return;

        }


        const videoTracks =
        localStream.getVideoTracks();


        if(!videoTracks.length){

            return;

        }


        const enabled =
        videoTracks[0].enabled;


        videoTracks.forEach(
            function(track){

                track.enabled =
                !enabled;

            }
        );


        if(enabled){

            cameraButton.textContent =
            "📷 تشغيل الكاميرا";

        }else{

            cameraButton.textContent =
            "📷 إيقاف الكاميرا";

        }

    }
);


/* =========================================
   إنهاء الحصة
========================================= */

leaveButton.addEventListener(
    "click",
    async function(){

        try{

            if(unsubscribeRoom){

                unsubscribeRoom();

            }


            if(unsubscribeCandidates){

                unsubscribeCandidates();

            }


            if(localStream){

                localStream
                .getTracks()
                .forEach(
                    function(track){

                        track.stop();

                    }
                );

            }


            if(peerConnection){

                peerConnection.close();

            }


            /*
            نحذف الغرفة في النهاية
            */

            if(roomRef){

                await deleteDoc(
                    roomRef
                );

            }

        }catch(error){

            console.error(error);

        }


        location.reload();

    }
);


/* =========================================
   رسالة الإعداد
========================================= */

function showSetupError(text){

    setupStatus.className =
    "status error";


    setupStatus.textContent =
    text;

}

</script></body></html>
