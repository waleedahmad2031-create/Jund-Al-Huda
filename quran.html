<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>القرآن الكريم | جنود الهدى</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    background:#f4f1e8;
    color:#222;
}

/* =========================
   الهيدر
========================= */

header{
    background:#0f5132;
    color:white;
    padding:17px 15px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,.18);
}

.logo{
    font-size:27px;
    font-weight:bold;
}

.subtitle{
    margin-top:5px;
    font-size:13px;
    opacity:.9;
}


/* =========================
   العودة
========================= */

.back{
    display:block;
    width:92%;
    max-width:600px;
    margin:15px auto;
    background:white;
    color:#0f5132;
    text-decoration:none;
    padding:12px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,.07);
}


/* =========================
   عنوان القرآن
========================= */

.hero{
    background:linear-gradient(135deg,#0f5132,#176b45);
    color:white;
    padding:27px 20px;
    text-align:center;
}

.hero h1{
    font-size:26px;
    margin-bottom:8px;
}

.hero p{
    font-size:14px;
}


/* =========================
   قائمة السور
========================= */

.container{
    max-width:850px;
    margin:auto;
    padding:20px 14px;
}

.search{
    width:100%;
    padding:15px;
    border:1px solid #ddd;
    border-radius:12px;
    font-size:15px;
    outline:none;
    margin-bottom:15px;
    background:white;
}

.search:focus{
    border-color:#0f5132;
}

.surahs{
    display:flex;
    flex-direction:column;
    gap:9px;
}

.surah{
    background:#fffdf7;
    border:1px solid #e2ddcf;
    border-radius:10px;
    padding:13px 12px;
    cursor:pointer;
    display:flex;
    align-items:center;
    min-height:68px;
    box-shadow:0 2px 5px rgba(0,0,0,.04);
    transition:.15s;
}

.surah:active{
    transform:scale(.98);
    background:#f8f5eb;
}

.surah-number{
    width:43px;
    height:43px;
    line-height:43px;
    text-align:center;
    border:1px solid #c7a85b;
    color:#805f18;
    border-radius:50%;
    font-weight:bold;
    margin-left:13px;
    flex-shrink:0;
}

.surah-details{
    flex:1;
}

.surah-name{
    color:#183d2b;
    font-size:17px;
    font-weight:bold;
}

.surah-info{
    display:block;
    color:#777;
    font-size:11px;
    margin-top:5px;
}

.surah-arrow{
    color:#999;
    font-size:18px;
}

.empty{
    display:none;
    background:white;
    padding:25px;
    border-radius:12px;
    text-align:center;
    color:#777;
}


/* =========================
   قارئ المصحف
========================= */

.reader{
    display:none;
    position:fixed;
    inset:0;
    background:#e9e3d2;
    z-index:1000;
    overflow:hidden;
}


/* رأس المصحف */

.reader-header{
    height:72px;
    background:#0f5132;
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 14px;
    position:absolute;
    top:0;
    right:0;
    left:0;
    z-index:5;
}

.reader-title{
    text-align:center;
    flex:1;
}

.reader-title h2{
    font-size:19px;
}

.page-number-top{
    font-size:11px;
    margin-top:4px;
    opacity:.85;
}

.close{
    background:white;
    color:#0f5132;
    border:0;
    padding:9px 13px;
    border-radius:8px;
    cursor:pointer;
}


/* =========================
   منطقة المصحف
========================= */

.reader-body{
    position:absolute;
    top:72px;
    bottom:75px;
    left:0;
    right:0;
    overflow:hidden;
    padding:10px;
}

.mushaf-page{
    height:100%;
    max-width:720px;
    margin:auto;
    background:#fffdf5;
    border:1px solid #d4c8aa;
    border-radius:5px;
    box-shadow:0 2px 12px rgba(0,0,0,.13);
    overflow-y:auto;
    padding:25px 20px 30px;
    direction:rtl;
    touch-action:pan-y;
}

.page-surah-title{
    text-align:center;
    color:#805f18;
    font-size:20px;
    font-weight:bold;
    margin-bottom:14px;
}

.bismillah{
    text-align:center;
    color:#183d2b;
    font-size:22px;
    font-weight:bold;
    line-height:2;
    margin-bottom:15px;
}

.quran-text{
    font-family:Tahoma,Arial,sans-serif;
    color:#29251c;
    font-size:23px;
    line-height:2.25;
    text-align:justify;
}

.ayah-number{
    color:#9a741d;
    font-size:16px;
    margin:0 4px;
}


/* =========================
   أزرار التحكم
========================= */

.reader-controls{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    height:75px;
    background:#0f5132;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    padding:8px;
    z-index:5;
}

.control{
    border:0;
    background:white;
    color:#0f5132;
    padding:10px 12px;
    border-radius:8px;
    cursor:pointer;
    font-size:12px;
}

.control:disabled{
    opacity:.4;
}

.page-counter{
    color:white;
    font-size:12px;
    min-width:70px;
    text-align:center;
}


/* =========================
   تحميل وخطأ
========================= */

.loading{
    background:#fffdf5;
    padding:35px 20px;
    border-radius:10px;
    text-align:center;
    color:#0f5132;
    line-height:2;
}

.error{
    background:#fff3f3;
    color:#a00;
    padding:25px 15px;
    border-radius:10px;
    text-align:center;
    line-height:2;
}


/* =========================
   الفوتر
========================= */

footer{
    margin-top:25px;
    background:#0f5132;
    color:white;
    text-align:center;
    padding:20px;
    font-size:13px;
}


/* =========================
   الجوال
========================= */

@media(max-width:500px){

    .surah-name{
        font-size:16px;
    }

    .mushaf-page{
        padding:22px 15px 25px;
    }

    .quran-text{
        font-size:21px;
        line-height:2.15;
    }

    .bismillah{
        font-size:20px;
    }

    .reader-controls{
        gap:4px;
    }

    .control{
        padding:9px 8px;
        font-size:11px;
    }

}

</style>

</head>


<body>


<header>

<div class="logo">
🕌 جنود الهدى
</div>

<div class="subtitle">
أكاديمية القرآن الكريم
</div>

</header>


<a href="index.html" class="back">
⬅️ العودة إلى الرئيسية
</a>


<section class="hero">

<h1>
📖 القرآن الكريم
</h1>

<p>
اقرأ كتاب الله وتدبر آياته
</p>

</section>


<div class="container">


<input
type="text"
id="search"
class="search"
placeholder="🔎 ابحث عن اسم السورة..."
oninput="searchSurahs()"
>


<div id="surahs" class="surahs"></div>


<div id="empty" class="empty">
لم يتم العثور على السورة
</div>


</div>


<footer>

جنود الهدى © 2026

<br>

أكاديمية القرآن الكريم

</footer>



<!-- =========================
     قارئ المصحف
========================= -->

<div id="reader" class="reader">


<div class="reader-header">

<button
class="close"
onclick="closeReader()">
إغلاق
</button>


<div class="reader-title">

<h2 id="readerTitle">
القرآن الكريم
</h2>

<div
id="pageNumberTop"
class="page-number-top">
صفحة 1
</div>

</div>


<div style="width:55px;"></div>

</div>



<div
id="readerBody"
class="reader-body">


<div
id="mushafPage"
class="mushaf-page">

<div
id="pageContent">
</div>

</div>


</div>



<div class="reader-controls">


<button
id="prevButton"
class="control"
onclick="previousPage()">
← السابق
</button>


<button
class="control"
onclick="changeFontSize(2)">
تكبير
</button>


<div
id="pageCounter"
class="page-counter">
صفحة 1
</div>


<button
class="control"
onclick="changeFontSize(-2)">
تصغير
</button>


<button
id="nextButton"
class="control"
onclick="nextPage()">
التالي →
</button>


</div>


</div>



<script>


/*
=========================================
أسماء سور القرآن الكريم
=========================================
*/

const surahs = [

"الفاتحة",
"البقرة",
"آل عمران",
"النساء",
"المائدة",
"الأنعام",
"الأعراف",
"الأنفال",
"التوبة",
"يونس",
"هود",
"يوسف",
"الرعد",
"إبراهيم",
"الحجر",
"النحل",
"الإسراء",
"الكهف",
"مريم",
"طه",
"الأنبياء",
"الحج",
"المؤمنون",
"النور",
"الفرقان",
"الشعراء",
"النمل",
"القصص",
"العنكبوت",
"الروم",
"لقمان",
"السجدة",
"الأحزاب",
"سبأ",
"فاطر",
"يس",
"الصافات",
"ص",
"الزمر",
"غافر",
"فصلت",
"الشورى",
"الزخرف",
"الدخان",
"الجاثية",
"الأحقاف",
"محمد",
"الفتح",
"الحجرات",
"ق",
"الذاريات",
"الطور",
"النجم",
"القمر",
"الرحمن",
"الواقعة",
"الحديد",
"المجادلة",
"الحشر",
"الممتحنة",
"الصف",
"الجمعة",
"المنافقون",
"التغابن",
"الطلاق",
"التحريم",
"الملك",
"القلم",
"الحاقة",
"المعارج",
"نوح",
"الجن",
"المزمل",
"المدثر",
"القيامة",
"الإنسان",
"المرسلات",
"النبأ",
"النازعات",
"عبس",
"التكوير",
"الانفطار",
"المطففين",
"الانشقاق",
"البروج",
"الطارق",
"الأعلى",
"الغاشية",
"الفجر",
"البلد",
"الشمس",
"الليل",
"الضحى",
"الشرح",
"التين",
"العلق",
"القدر",
"البينة",
"الزلزلة",
"العاديات",
"القارعة",
"التكاثر",
"العصر",
"الهمزة",
"الفيل",
"قريش",
"الماعون",
"الكوثر",
"الكافرون",
"النصر",
"المسد",
"الإخلاص",
"الفلق",
"الناس"

];


/*
=========================================
متغيرات المصحف
=========================================
*/

let currentSurah = 0;

let currentPage = 0;

let pages = [];

let fontSize = 23;

let touchStartX = 0;

let touchEndX = 0;


/*
=========================================
عرض السور
=========================================
*/

function displaySurahs(list = surahs){

    const container =
        document.getElementById("surahs");

    const empty =
        document.getElementById("empty");

    container.innerHTML = "";


    if(list.length === 0){

        empty.style.display = "block";

        return;

    }


    empty.style.display = "none";


    list.forEach(name => {

        const number =
            surahs.indexOf(name) + 1;


        const div =
            document.createElement("div");


        div.className = "surah";


        div.onclick = function(){

            openSurah(number,name);

        };


        div.innerHTML = `

            <span class="surah-number">
                ${number}
            </span>

            <div class="surah-details">

                <span class="surah-name">
                    ${name}
                </span>

                <span class="surah-info">
                    سورة رقم ${number}
                </span>

            </div>

            <span class="surah-arrow">
                ‹
            </span>

        `;


        container.appendChild(div);

    });

}


/*
=========================================
البحث
=========================================
*/

function searchSurahs(){

    const value =
        document
        .getElementById("search")
        .value
        .trim();


    const filtered =
        surahs.filter(name =>
            name.includes(value)
        );


    displaySurahs(filtered);

}


/*
=========================================
فتح السورة
=========================================
*/

async function openSurah(number,name){

    currentSurah = number;

    currentPage = 0;

    pages = [];


    const reader =
        document.getElementById("reader");


    const title =
        document.getElementById("readerTitle");


    const content =
        document.getElementById("pageContent");


    reader.style.display = "block";


    title.textContent = name;


    content.innerHTML = `

        <div class="loading">

            ⏳ جاري تحميل سورة ${name}

            <br>

            يرجى الانتظار قليلاً...

        </div>

    `;


    try{

        const response =
            await fetch(
                "https://api.alquran.cloud/v1/surah/"
                + number
                + "/quran-uthmani"
            );


        if(!response.ok){

            throw new Error("فشل الاتصال");

        }


        const data =
            await response.json();


        if(
            !data.data ||
            !data.data.ayahs
        ){

            throw new Error(
                "لم تصل بيانات السورة"
            );

        }


        /*
        الآيات
        */

        const ayahs =
            data.data.ayahs;


        /*
        تقسيم الآيات إلى صفحات

        عدد متوسط مناسب للجوال.
        */

        pages =
            makePages(
                ayahs,
                name
            );


        /*
        استرجاع آخر صفحة
        */

        const saved =
            localStorage.getItem(
                "junood_last_page_" + number
            );


        if(saved !== null){

            const savedPage =
                parseInt(saved);


            if(
                savedPage >= 0 &&
                savedPage < pages.length
            ){

                currentPage =
                    savedPage;

            }

        }


        renderPage();


    }catch(error){

        console.error(error);


        content.innerHTML = `

            <div class="error">

                ⚠️ تعذر تحميل الآيات حاليًا.

                <br><br>

                تأكد من اتصال الإنترنت
                ثم حاول مرة أخرى.

            </div>

        `;

    }

}


/*
=========================================
تقسيم السورة إلى صفحات
=========================================
*/

function makePages(ayahs,name){

    const result = [];

    let current = [];

    /*
    عدد الآيات التقريبي في الصفحة.
    نستخدم 8 في الجوال تقريبًا.
    */

    const perPage =
        window.innerWidth <= 500 ? 7 : 9;


    ayahs.forEach((ayah,index) => {

        current.push(ayah);


        if(
            current.length >= perPage ||
            index === ayahs.length - 1
        ){

            result.push({

                name:name,

                ayahs:current

            });


            current = [];

        }

    });


    return result;

}


/*
=========================================
عرض الصفحة الحالية
=========================================
*/

function renderPage(){

    if(!pages.length){

        return;

    }


    const page =
        pages[currentPage];


    const content =
        document.getElementById(
            "pageContent"
        );


    const title =
        document.getElementById(
            "readerTitle"
        );


    const pageCounter =
        document.getElementById(
            "pageCounter"
        );


    const pageTop =
        document.getElementById(
            "pageNumberTop"
        );


    let html = `

        <div class="page-surah-title">

            سورة ${page.name}

        </div>

    `;


    /*
    البسملة
    */

    if(
        currentSurah !== 9 &&
        currentPage === 0
    ){

        html += `

            <div class="bismillah">

                بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ

            </div>

        `;

    }


    html += `<div class="quran-text">`;


    page.ayahs.forEach(ayah => {

        html += `

            ${ayah.text}

            <span class="ayah-number">

                ﴿${ayah.numberInSurah}﴾

            </span>

        `;

    });


    html += `</div>`;


    content.innerHTML = html;


    /*
    تحديث رقم الصفحة
    */

    const number =
        currentPage + 1;


    const total =
        pages.length;


    pageCounter.textContent =
        "صفحة " + number + " من " + total;


    pageTop.textContent =
        "صفحة " + number;


    /*
    الأزرار
    */

    document
        .getElementById("prevButton")
        .disabled =
        currentPage === 0;


    document
        .getElementById("nextButton")
        .disabled =
        currentPage === pages.length - 1;


    /*
    حفظ الصفحة
    */

    localStorage.setItem(

        "junood_last_page_" +
        currentSurah,

        currentPage

    );


    /*
    نرجع أعلى الصفحة
    */

    document
        .getElementById("mushafPage")
        .scrollTop = 0;

}


/*
=========================================
الصفحة التالية
=========================================
*/

function nextPage(){

    if(
        currentPage <
        pages.length - 1
    ){

        currentPage++;

        renderPage();

    }

}


/*
=========================================
الصفحة السابقة
=========================================
*/

function previousPage(){

    if(currentPage > 0){

        currentPage--;

        renderPage();

    }

}


/*
=========================================
إغلاق المصحف
=========================================
*/

function closeReader(){

    document
        .getElementById("reader")
        .style.display = "none";

}


/*
=========================================
تكبير وتصغير الخط
=========================================
*/

function changeFontSize(amount){

    fontSize += amount;


    if(fontSize < 17){

        fontSize = 17;

    }


    if(fontSize > 32){

        fontSize = 32;

    }


    document
        .querySelectorAll(".quran-text")
        .forEach(element => {

            element.style.fontSize =
                fontSize + "px";

        });

}


/*
=========================================
السحب باللمس
=========================================
*/

const mushaf =
    document.getElementById(
        "mushafPage"
    );


mushaf.addEventListener(
    "touchstart",
    function(event){

        touchStartX =
            event.changedTouches[0].screenX;

    },
    {passive:true}
);


mushaf.addEventListener(
    "touchend",
    function(event){

        touchEndX =
            event.changedTouches[0].screenX;


        handleSwipe();

    },
    {passive:true}
);


function handleSwipe(){

    const difference =
        touchStartX - touchEndX;


    /*
    سحب لليسار = الصفحة التالية
    */

    if(difference > 60){

        nextPage();

    }


    /*
    سحب لليمين = الصفحة السابقة
    */

    if(difference < -60){

        previousPage();

    }

}


/*
=========================================
تشغيل الصفحة
=========================================
*/

displaySurahs();

</script>


</body>

  </html>
