<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>دخول الإدارة | جنود الهدى</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#f5f7f6;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#222;
}

.container{
    width:92%;
    max-width:420px;
}

.card{
    background:white;
    border-radius:18px;
    padding:30px 22px;
    box-shadow:0 5px 20px rgba(0,0,0,.10);
}

.logo{
    text-align:center;
    font-size:42px;
    margin-bottom:10px;
}

.title{
    text-align:center;
    color:#0f5132;
    font-size:25px;
    font-weight:bold;
}

.subtitle{
    text-align:center;
    color:#777;
    font-size:13px;
    margin-top:7px;
    margin-bottom:25px;
}

.form-group{
    margin-bottom:16px;
}

label{
    display:block;
    color:#0f5132;
    font-size:13px;
    font-weight:bold;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:10px;
    background:#fafafa;
    font-size:14px;
    outline:none;
    direction:ltr;
    text-align:left;
}

input:focus{
    border-color:#198754;
    background:white;
}

.login-btn{
    width:100%;
    border:0;
    padding:14px;
    border-radius:10px;
    background:#198754;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    margin-top:5px;
}

.login-btn:disabled{
    background:#aaa;
    cursor:not-allowed;
}

.error{
    display:none;
    background:#fff1f1;
    color:#a00000;
    border-right:4px solid #c00;
    padding:12px;
    border-radius:9px;
    margin-top:15px;
    font-size:13px;
    line-height:1.8;
    text-align:center;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#0f5132;
    text-decoration:none;
    font-size:13px;
}

.security{
    margin-top:20px;
    background:#f4f8f5;
    border-radius:10px;
    padding:13px;
    color:#666;
    font-size:11px;
    line-height:1.8;
    text-align:center;
}

footer{
    text-align:center;
    color:#888;
    font-size:11px;
    margin-top:18px;
}

</style>

</head>


<body>


<div class="container">


<div class="card">


<div class="logo">
🕌
</div>


<div class="title">
جنود الهدى
</div>


<div class="subtitle">
🔐 تسجيل دخول الإدارة
</div>


<form
id="loginForm">


<div class="form-group">

<label>
📧 البريد الإلكتروني
</label>

<input
type="email"
id="email"
placeholder="أدخل بريد المدير"
autocomplete="username"
required>

</div>


<div class="form-group">

<label>
🔑 كلمة المرور
</label>

<input
type="password"
id="password"
placeholder="أدخل كلمة المرور"
autocomplete="current-password"
required>

</div>


<button
type="submit"
id="loginButton"
class="login-btn">

🔐 دخول الإدارة

</button>


</form>


<div
id="error"
class="error">
</div>


<div class="security">

🔒 هذه الصفحة مخصصة لإدارة
أكاديمية جنود الهدى فقط.

<br>

لا تشارك بيانات الدخول مع أي شخص.

</div>


<a
href="index.html"
class="back">

⬅️ العودة إلى الرئيسية

</a>


</div>


<footer>

جنود الهدى © 2026

</footer>


</div>



<script type="module">


/*
=========================================
Firebase
=========================================
*/

import {

    initializeApp

}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

    getAuth,

    signInWithEmailAndPassword,

    onAuthStateChanged

}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const firebaseConfig = {

    apiKey:
    "AIzaSyBCnQWX_kKckwncvS9rnfi5YHsDbCWhtoU",

    authDomain:
    "jundalhuda.firebaseapp.com",

    projectId:
    "jundalhuda",

    storageBucket:
    "jundalhuda.firebasestorage.app",

    messagingSenderId:
    "275883570506",

    appId:
    "1:275883570506:web:fb5e72953a3d5a66ef3db3",

    measurementId:
    "G-ZZNZKN73BQ"

};


const app =
    initializeApp(
        firebaseConfig
    );


const auth =
    getAuth(app);


/*
=========================================
العناصر
=========================================
*/

const form =
    document.getElementById(
        "loginForm"
    );


const emailInput =
    document.getElementById(
        "email"
    );


const passwordInput =
    document.getElementById(
        "password"
    );


const loginButton =
    document.getElementById(
        "loginButton"
    );


const errorBox =
    document.getElementById(
        "error"
    );


/*
=========================================
رسالة الخطأ
=========================================
*/

function showError(message){

    errorBox.textContent =
        message;

    errorBox.style.display =
        "block";

}


/*
=========================================
إخفاء الخطأ
=========================================
*/

function hideError(){

    errorBox.style.display =
        "none";

}


/*
=========================================
إذا كان المدير مسجل دخول
=========================================
*/

onAuthStateChanged(

    auth,

    function(user){

        if(user){

            window.location.href =
                "admin.html";

        }

    }

);


/*
=========================================
تسجيل الدخول
=========================================
*/

form.addEventListener(

    "submit",

    async function(event){

        event.preventDefault();


        hideError();


        const email =
            emailInput
            .value
            .trim();


        const password =
            passwordInput
            .value;


        if(!email || !password){

            showError(
                "⚠️ أدخل البريد الإلكتروني وكلمة المرور."
            );

            return;

        }


        loginButton.disabled =
            true;


        loginButton.textContent =
            "⏳ جاري تسجيل الدخول...";


        try{

            await signInWithEmailAndPassword(

                auth,

                email,

                password

            );


            window.location.href =
                "admin.html";


        }catch(error){

            console.error(error);


            let message =
                "❌ تعذر تسجيل الدخول.";


            if(
                error.code ===
                "auth/invalid-credential"
            ){

                message =
                    "❌ البريد الإلكتروني أو كلمة المرور غير صحيحة.";

            }


            else if(
                error.code ===
                "auth/user-not-found"
            ){

                message =
                    "❌ لا يوجد حساب بهذا البريد.";

            }


            else if(
                error.code ===
                "auth/wrong-password"
            ){

                message =
                    "❌ كلمة المرور غير صحيحة.";

            }


            else if(
                error.code ===
                "auth/invalid-email"
            ){

                message =
                    "❌ البريد الإلكتروني غير صحيح.";

            }


            else if(
                error.code ===
                "auth/too-many-requests"
            ){

                message =
                    "⚠️ محاولات كثيرة. حاول لاحقًا.";

            }


            else if(
                error.code ===
                "auth/network-request-failed"
            ){

                message =
                    "⚠️ تحقق من اتصال الإنترنت.";

            }


            showError(message);


        }finally{

            loginButton.disabled =
                false;

            loginButton.textContent =
                "🔐 دخول الإدارة";

        }

    }

);

</script>


</body>

</html>
