<div class="container">

<script type="module">
    /* =========================
   Firebase
========================= */

import {
    db
}
from "./firebase.js";


import {
    collection,
    getDocs,
    query,
    where
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
   عناصر الصفحة
========================= */

const loginCard =
document.getElementById(
    "loginCard"
);

const teacherPage =
document.getElementById(
    "teacherPage"
);

const teacherCodeInput =
document.getElementById(
    "teacherCodeInput"
);

const loginButton =
document.getElementById(
    "loginButton"
);

const loginMessage =
document.getElementById(
    "loginMessage"
);

const pageMessage =
document.getElementById(
    "pageMessage"
);

const teacherName =
document.getElementById(
    "teacherName"
);

const teacherCode =
document.getElementById(
    "teacherCode"
);

const studentsList =
document.getElementById(
    "studentsList"
);

const logoutButton =
document.getElementById(
    "logoutButton"
);


/* =========================
   المدرس الحالي
========================= */

let currentTeacher = null;


/* =========================
   تسجيل دخول المدرس
========================= */

loginButton.addEventListener(
    "click",
    async function(){

        const code =
        teacherCodeInput.value.trim();


        if(!code){

            showLoginMessage(
                "⚠️ أدخل كود المدرس.",
                false
            );

            return;

        }


        if(
            !/^\d{6}$/.test(code)
        ){

            showLoginMessage(
                "⚠️ كود المدرس يجب أن يكون 6 أرقام.",
                false
            );

            return;

        }


        loginButton.disabled =
        true;

        loginButton.textContent =
        "⏳ جاري التحقق...";


        try{

            const result =
            await getDocs(

                query(

                    collection(
                        db,
                        "teachers"
                    ),

                    where(
                        "code",
                        "==",
                        code
                    )

                )

            );


            if(result.empty){

                showLoginMessage(
                    "❌ كود المدرس غير صحيح.",
                    false
                );

                return;

            }


            const teacherDoc =
            result.docs[0];


            const teacher =
            teacherDoc.data();


            if(
                teacher.active === false
            ){

                showLoginMessage(
                    "⛔ هذا المدرس غير نشط حاليًا.",
                    false
                );

                return;

            }


            currentTeacher = {

                id:
                teacherDoc.id,

                ...teacher

            };


            localStorage.setItem(
                "jundTeacherId",
                teacherDoc.id
            );


            localStorage.setItem(
                "jundTeacherCode",
                teacher.code || ""
            );


            localStorage.setItem(
                "jundTeacherName",
                teacher.name || ""
            );


            openTeacherPage();


        }catch(error){

            console.error(
                "Teacher login error:",
                error
            );


            showLoginMessage(
                "❌ تعذر الدخول: " +
                error.message,
                false
            );

        }finally{

            loginButton.disabled =
            false;

            loginButton.textContent =
            "🔐 دخول المدرس";

        }

    }
);


/* =========================
   فتح صفحة المدرس
========================= */

async function openTeacherPage(){

    loginCard.style.display =
    "none";

    teacherPage.style.display =
    "block";


    teacherName.textContent =
    currentTeacher.name ||
    "المدرس";


    teacherCode.textContent =
    currentTeacher.code ||
    "-";


    await loadTeacherStudents();

}
    /* =========================
   تحميل طلاب وحصص المدرس
========================= */

async function loadTeacherStudents(){

    studentsList.innerHTML = `

        <div class="loading">

            ⏳ جاري تحميل الطلاب والحصص...

        </div>

    `;


    try{

        /* =========================
           تحميل طلاب المدرس
        ========================= */

        const studentsResult =
        await getDocs(

            query(

                collection(
                    db,
                    "students"
                ),

                where(
                    "teacherId",
                    "==",
                    currentTeacher.id
                )

            )

        );


        /* =========================
           تحميل الحصص
        ========================= */

        const lessonsResult =
        await getDocs(

            collection(
                db,
                "liveSessions"
            )

        );


        const lessons = [];


        lessonsResult.forEach(
            function(item){

                const lesson =
                item.data();


                const lessonTeacherId =
                String(
                    lesson.teacherId || ""
                ).trim();


                const lessonTeacherName =
                String(
                    lesson.teacherName || ""
                ).trim();


                const currentTeacherId =
                String(
                    currentTeacher.id || ""
                ).trim();


                const currentTeacherName =
                String(
                    currentTeacher.name || ""
                ).trim();


                /*
                الربط الأساسي:
                teacherId

                الربط الاحتياطي:
                teacherName
                */

                const isSameTeacher =
                    (
                        lessonTeacherId &&
                        lessonTeacherId ===
                        currentTeacherId
                    )
                    ||
                    (
                        !lessonTeacherId &&
                        lessonTeacherName ===
                        currentTeacherName
                    );


                if(
                    isSameTeacher
                    &&
                    lesson.status !==
                    "cancelled"
                ){

                    lessons.push({

                        id:
                        item.id,

                        ...lesson

                    });

                }

            }
        );


        /* =========================
           إذا لا يوجد طلاب ولا حصص
        ========================= */

        if(
            studentsResult.empty &&
            lessons.length === 0
        ){

            studentsList.innerHTML = `

                <div class="empty">

                    📚 لا يوجد طلاب أو حصص مجدولة لك حاليًا.

                </div>

            `;

            return;

        }


        studentsList.innerHTML =
        "";


        /* =========================
           عرض الطلاب
        ========================= */

        studentsResult.forEach(
            function(item){

                const student =
                item.data();


                const div =
                document.createElement(
                    "div"
                );


                div.className =
                "student-item";


                /* =========================
                   البحث عن حصص الطالب
                ========================= */

                const studentLessons =
                lessons.filter(
                    function(lesson){

                        const lessonStudentId =
                        String(
                            lesson.studentId || ""
                        ).trim();


                        const currentStudentId =
                        String(
                            item.id || ""
                        ).trim();


                        if(
                            lessonStudentId &&
                            currentStudentId
                        ){

                            return (
                                lessonStudentId ===
                                currentStudentId
                            );

                        }


                        return String(
                            lesson.studentName || ""
                        ).trim()
                        ===
                        String(
                            student.name || ""
                        ).trim();

                    }
                );


                let lessonsHTML =
                "";


                if(
                    studentLessons.length === 0
                ){

                    lessonsHTML = `

                        <div class="lesson">

                            <div class="lesson-title">

                                📖 الحصة

                            </div>

                            ⚠️ لا توجد حصة مجدولة لهذا الطالب حاليًا.

                        </div>

                    `;

                }

                else{

                    studentLessons.forEach(
                        function(lesson){

                            let meetingButton =
                            "";


                            /*
                             * رابط الحصة يظهر حسب
                             * منطق الوقت الموجود عندك.
                             */

                            if(
                                lesson.meetingUrl
                            ){

                                meetingButton = `

                                    <a
                                        class="online-button"
                                        href="${
                                            escapeHTML(
                                                lesson.meetingUrl
                                            )
                                        }"
                                        target="_blank"
                                        rel="noopener">

                                        🎥 دخول الحصة المباشرة

                                    </a>

                                `;

                            }


                            /* =========================
                               زر إرسال واتساب
                            ========================= */

                            let whatsappButton =
                            "";


                            if(
                                student.phone &&
                                lesson.meetingUrl
                            ){

                                whatsappButton = `

                                    <button
                                        type="button"
                                        class="whatsapp-button"
                                        onclick='sendLessonWhatsApp(
                                            ${JSON.stringify({
                                                phone: String(student.phone || ""),
                                                studentName: String(student.name || "الطالب"),
                                                lessonDate: String(lesson.lessonDate || "-"),
                                                lessonTime: String(lesson.lessonTime || "-"),
                                                meetingUrl: String(lesson.meetingUrl || "")
                                            }).replace(/'/g, "&#39;")}
                                        )'>

                                        📱 إرسال تفاصيل الحصة للطالب

                                    </button>

                                `;

                            }


                            lessonsHTML += `

                                <div class="lesson">

                                    <div class="lesson-title">

                                        📖 الحصة المجدولة

                                    </div>

                                    📚 المادة:

                                    ${
                                        escapeHTML(
                                            lesson.subject ||
                                            "بدون مادة"
                                        )
                                    }

                                    <br>

                                    📅 التاريخ:

                                    ${
                                        escapeHTML(
                                            lesson.lessonDate ||
                                            "-"
                                        )
                                    }

                                    <br>

                                    🕐 الوقت:

                                    ${
                                        escapeHTML(
                                            lesson.lessonTime ||
                                            "-"
                                        )
                                    }

                                    <br>

                                    📊 الحالة:

                                    ${
                                        lesson.status ===
                                        "scheduled"

                                        ?

                                        "🟢 مجدولة"

                                        :

                                        escapeHTML(
                                            lesson.status ||
                                            "-"
                                        )
                                    }

                                    ${
                                        meetingButton
                                    }

                                    ${
                                        whatsappButton
                                    }

                                </div>

                            `;

                        }
                    );

                }


                div.innerHTML = `

                    <strong>

                        👤 ${
                            escapeHTML(
                                student.name ||
                                "بدون اسم"
                            )
                        }

                    </strong>

                    <br>

                    📱 الهاتف:

                    ${
                        escapeHTML(
                            student.phone ||
                            "-"
                        )
                    }

                    <br>

                    🔐 كود الطالب:

                    ${
                        escapeHTML(
                            student.code ||
                            "-"
                        )
                    }

                    <br>

                    📚 المستوى:

                    ${
                        escapeHTML(
                            student.level ||
                            "-"
                        )
                    }

                    ${lessonsHTML}

                `;


                studentsList.appendChild(
                    div
                );

            }
        );

    /* =========================
   الحصص التي لا ترتبط
   بطالب موجود
========================= */

const displayedLessonIds =
new Set();


studentsResult.forEach(
    function(item){

        const student =
        item.data();


        lessons.forEach(
            function(lesson){

                const lessonStudentId =
                String(
                    lesson.studentId || ""
                ).trim();


                const studentId =
                String(
                    item.id || ""
                ).trim();


                const sameStudent =
                    (
                        lessonStudentId &&
                        lessonStudentId ===
                        studentId
                    )
                    ||
                    (
                        !lessonStudentId &&
                        String(
                            lesson.studentName || ""
                        ).trim()
                        ===
                        String(
                            student.name || ""
                        ).trim()
                    );


                if(
                    sameStudent
                ){

                    displayedLessonIds.add(
                        lesson.id
                    );

                }

            }
        );

    }
);


const unlinkedLessons =
lessons.filter(
    function(lesson){

        return !
        displayedLessonIds.has(
            lesson.id
        );

    }
);


if(
    unlinkedLessons.length > 0
){

    const title =
    document.createElement(
        "div"
    );


    title.style.cssText = `

        margin-top:18px;
        margin-bottom:12px;
        color:#075e54;
        font-size:18px;
        font-weight:bold;

    `;


    title.textContent =
    "📅 حصص مجدولة";


    studentsList.appendChild(
        title
    );


    unlinkedLessons.forEach(
        function(lesson){

            const div =
            document.createElement(
                "div"
            );


            div.className =
            "student-item";


            let meetingButton =
            "";


            if(
                lesson.meetingUrl
            ){

                meetingButton = `

                    <a
                        class="online-button"
                        href="${
                            escapeHTML(
                                lesson.meetingUrl
                            )
                        }"
                        target="_blank"
                        rel="noopener">

                        🎥 دخول الحصة المباشرة

                    </a>

                `;

            }


            /*
             * لا نضيف إرسال واتساب هنا
             * لأن هذه الحصة غير مرتبطة
             * بطالب محدد.
             */


            div.innerHTML = `

                👨‍🎓 <strong>

                    الطالب:

                    ${
                        escapeHTML(
                            lesson.studentName ||
                            "-"
                        )
                    }

                </strong>

                <div class="lesson">

                    <div class="lesson-title">

                        📖 الحصة المجدولة

                    </div>

                    📚 المادة:

                    ${
                        escapeHTML(
                            lesson.subject ||
                            "-"
                        )
                    }

                    <br>

                    📅 التاريخ:

                    ${
                        escapeHTML(
                            lesson.lessonDate ||
                            "-"
                        )
                    }

                    <br>

                    🕐 الوقت:

                    ${
                        escapeHTML(
                            lesson.lessonTime ||
                            "-"
                        )
                    }

                    <br>

                    📊 الحالة:

                    ${
                        lesson.status ===
                        "scheduled"

                        ?

                        "🟢 مجدولة"

                        :

                        escapeHTML(
                            lesson.status ||
                            "-"
                        )
                    }

                    ${
                        meetingButton
                    }

                </div>

            `;


            studentsList.appendChild(
                div
            );

        }
    );

}


    }catch(error){

        console.error(
            "Load teacher students error:",
            error
        );


        studentsList.innerHTML = `

            <div class="empty">

                ❌ تعذر تحميل الطلاب والحصص.

                <br><br>

                ${
                    escapeHTML(
                        error.message ||
                        ""
                    )
                }

            </div>

        `;

    }

}


/* =========================
   إرسال الحصة عبر واتساب
========================= */

window.sendLessonWhatsApp =
function(data){

    if(!data){

        return;

    }


    let phone =
    String(
        data.phone || ""
    ).replace(
        /[^0-9+]/g,
        ""
    );


    /*
     * إذا كان الرقم يبدأ بـ 05
     * نحوله تلقائيًا إلى
     * صيغة السعودية 966
     */

    if(
        phone.startsWith("05")
    ){

        phone =
        "966" +
        phone.substring(1);

    }


    /*
     * إذا كتب الرقم بدون مفتاح
     * وكان 9 أرقام يبدأ بـ 5
     */

    else if(
        phone.startsWith("5") &&
        phone.length === 9
    ){

        phone =
        "966" +
        phone;

    }


    if(!phone){

        alert(
            "❌ لا يوجد رقم جوال للطالب."
        );

        return;

    }


    const studentName =
    data.studentName ||
    "الطالب";


    const lessonDate =
    data.lessonDate ||
    "-";


    const lessonTime =
    data.lessonTime ||
    "-";


    const meetingUrl =
    data.meetingUrl ||
    "";


    const message =
`السلام عليكم ورحمة الله وبركاته 🌹

يا ${studentName}،
تم تحديد موعد حصتك في أكاديمية جنود الهدى 📖

📅 التاريخ: ${lessonDate}
🕐 الوقت: ${lessonTime}

🎥 رابط الحصة المباشرة:
${meetingUrl}

ننتظرك في الموعد بإذن الله 🌿`;


    const whatsappUrl =
    "https://wa.me/" +
    phone +
    "?text=" +
    encodeURIComponent(
        message
    );


    window.open(
        whatsappUrl,
        "_blank"
    );

};


/* =========================
   تسجيل الخروج
========================= */

logoutButton.addEventListener(
    "click",
    function(){

        localStorage.removeItem(
            "jundTeacherId"
        );

        localStorage.removeItem(
            "jundTeacherCode"
        );

        localStorage.removeItem(
            "jundTeacherName"
        );


        currentTeacher =
        null;


        teacherPage.style.display =
        "none";


        loginCard.style.display =
        "block";


        teacherCodeInput.value =
        "";


        showLoginMessage(
            "",
            false
        );

    }
);
/* =========================
   استعادة الجلسة
========================= */

async function restoreTeacher(){

    const savedId =
    localStorage.getItem(
        "jundTeacherId"
    );


    if(!savedId){

        return;

    }


    try{

        const result =
        await getDocs(
            collection(
                db,
                "teachers"
            )
        );


        const teacherDoc =
        result.docs.find(
            function(item){

                return item.id ===
                savedId;

            }
        );


        if(!teacherDoc){

            localStorage.removeItem(
                "jundTeacherId"
            );

            return;

        }


        const teacher =
        teacherDoc.data();


        if(
            teacher.active === false
        ){

            localStorage.removeItem(
                "jundTeacherId"
            );

            return;

        }


        currentTeacher = {

            id:
            teacherDoc.id,

            ...teacher

        };


        openTeacherPage();


    }catch(error){

        console.error(
            "Restore teacher error:",
            error
        );

    }

}

/* =========================
   حماية النص
========================= */

function escapeHTML(value){

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}
