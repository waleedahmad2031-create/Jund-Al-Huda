<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>المدرس | جنود الهدى</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    background:#f4f7f5;
    color:#222;
}

header{
    background:linear-gradient(135deg,#075e54,#0b806f);
    color:white;
    text-align:center;
    padding:25px 15px;
}

.logo{
    font-size:42px;
}

header h1{
    font-size:27px;
    margin-top:5px;
}

header p{
    margin-top:6px;
    font-size:13px;
    opacity:.9;
}

.container{
    max-width:700px;
    margin:auto;
    padding:20px 14px;
}

.card{
    background:white;
    border-radius:17px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 4px 15px rgba(0,0,0,.07);
}

h2{
    color:#075e54;
    font-size:20px;
    margin-bottom:15px;
}

.teacher-info{
    background:#e8f7f2;
    border-radius:12px;
    padding:15px;
    line-height:2;
    margin-bottom:18px;
}

.lesson{
    background:white;
    border-radius:15px;
    padding:17px;
    margin-bottom:12px;
    border-right:5px solid #198754;
    box-shadow:0 2px 9px rgba(0,0,0,.06);
}

.lesson-name{
    color:#075e54;
    font-size:18px;
    font-weight:bold;
    margin-bottom:10px;
}

.lesson-info{
    color:#666;
    font-size:13px;
    line-height:2;
}

.status{
    margin-top:13px;
    padding:13px;
    border-radius:10px;
    text-align:center;
    font-weight:bold;
    line-height:1.8;
}

.waiting{
    background:#fff8e1;
    color:#856404;
}

.live{
    background:#e8f7f2;
    color:#075e54;
}

.finished{
    background:#eee;
    color:#666;
}

.start-btn{
    width:100%;
    margin-top:10px;
    border:0;
    border-radius:10px;
    padding:14px;
    background:#075e54;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    display:none;
}

.logout{
    width:100%;
    border:0;
    border-radius:10px;
    padding:13px;
    background:#dc3545;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.message{
    display:none;
    padding:13px;
    border-radius:10px;
    text-align:center;
    margin-bottom:15px;
    line-height:1.8;
}

.error{
    background:#ffe8e8;
    color:#a00000;
}

.success{
    background:#e8f7f2;
    color:#075e54;
}

.empty{
    text-align:center;
    color:#777;
    background:#fafafa;
    padding:25px;
    border-radius:10px;
}

.loading{
    text-align:center;
    padding:30px;
    color:#777;
}

footer{
    margin-top:25px;
    background:#075e54;
    color:white;
    text-align:center;
    padding:20px;
    font-size:13px;
}

</style>

</head>


<body>


<header>

<div class="logo">
🕌
</div>

<h1>
جنود الهدى
</h1>

<p>
لوحة المدرس
</p>

</header>


<div class="container">


<div
id="message"
class="message">
</div>


<div class="card">

<h2>
👨‍🏫 أهلاً بالمدرس
</h2>

<div
class="teacher-info">

👨‍🏫 المدرس:

<strong id="teacherName">
جاري التحقق...
</strong>

<br>

📚 هذه الصفحة تعرض الحصص الخاصة بك.

</div>


<button
id="logoutButton"
class="logout">

🚪 تسجيل الخروج

</button>

</div>


<div class="card">

<h2>
📚 حصص اليوم
</h2>


<div
id="lessons">

<div class="loading">
⏳ جاري تحميل الحصص...
</div>

</div>

</div>


</div>


<footer>

جنود الهدى © 2026

<br>

أكاديمية القرآن الكريم

</footer>



<script type="module">


/* =====================================
   Firebase
===================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getFirestore,
    collection,
    getDocs
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


import {
    getAuth,
    onAuthStateChanged,
    signOut
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


/* =====================================
   إعداد Firebase
===================================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyBCnQWX_kKckwncvS9rnfi5YHsDbCWhtoU",

    authDomain:
    "jundalhuda.firebaseapp.com",

    projectId:
    "jundalhuda",

    storageBucket:
    "jundalhuda.firebasestorage.app",

    messagingSenderId:
    "275883570506",

    appId:
    "1:275883570506:web:fb5e72953a3d5a66ef3db3",

    measurementId:
    "G-ZZNZKN73BQ"

};


const app =
initializeApp(firebaseConfig);


const db =
getFirestore(app);


const auth =
getAuth(app);


let timer = null;


/* =====================================
   التحقق من تسجيل الدخول
===================================== */

onAuthStateChanged(
    auth,
    async function(user){

        if(!user){

            window.location.href =
            "login.html";

            return;

        }


        document
        .getElementById(
            "teacherName"
        )
        .textContent =
        user.email ||
        "المدرس";


        loadLessons();

    }
);


/* =====================================
   تحميل حصص الطلاب
===================================== */

async function loadLessons(){

    const container =
    document.getElementById(
        "lessons"
    );


    container.innerHTML = `
        <div class="loading">
            ⏳ جاري تحميل الحصص...
        </div>
    `;


    try{

        const result =
        await getDocs(
            collection(
                db,
                "students"
            )
        );


        if(result.empty){

            container.innerHTML = `
                <div class="empty">
                    لا توجد حصص مسجلة.
                </div>
            `;

            return;

        }


        container.innerHTML = "";


        let count = 0;


        result.forEach(function(item){

            const student =
            item.data();


            if(
                student.active === false
            ){

                return;

            }


            /*
            ==============================
            يجب وجود موعد
            ==============================
            */

            if(!student.startTime){

                return;

            }


            const start =
            new Date(
                student.startTime
            );


            if(
                isNaN(
                    start.getTime()
                )
            ){

                return;

            }


            /*
            ==============================
            نعرض حصص اليوم فقط
            ==============================
            */

            const now =
            new Date();


            if(
                start.getFullYear()
                !==
                now.getFullYear()
                ||
                start.getMonth()
                !==
                now.getMonth()
                ||
                start.getDate()
                !==
                now.getDate()
            ){

                return;

            }


            count++;


            const div =
            document.createElement(
                "div"
            );


            div.className =
            "lesson";


            div.innerHTML = `

                <div class="lesson-name">

                    👤
                    ${escapeHTML(
                        student.name ||
                        "بدون اسم"
                    )}

                </div>


                <div class="lesson-info">

                    🎂 العمر:
                    ${
                        escapeHTML(
                            student.age ||
                            "-"
                        )
                    }

                    <br>

                    📖 المستوى:
                    ${
                        escapeHTML(
                            student.level ||
                            "-"
                        )
                    }

                    <br>

                    📚 الدرس:
                    ${
                        escapeHTML(
                            student.lesson ||
                            "قراءة وحفظ القرآن الكريم"
                        )
                    }

                    <br>

                    📅 التاريخ:
                    ${formatDate(start)}

                    <br>

                    🕐 بداية الحصة:
                    ${formatTime(start)}

                    <br>

                    🕐 نهاية الحصة:
                    ${
                        student.endTime
                        ?
                        formatTime(
                            new Date(
                                student.endTime
                            )
                        )
                        :
                        "بعد 30 دقيقة"
                    }

                </div>


                <div
                    id="status-${item.id}"
                    class="status waiting">

                    ⏳ جاري التحقق من وقت الحصة...

                </div>


                <button
                    id="button-${item.id}"
                    class="start-btn">

                    🎥 بدء الحصة

                </button>

            `;


            container.appendChild(
                div
            );


            updateLesson(
                item.id,
                student
            );

        });


        if(count === 0){

            container.innerHTML = `
                <div class="empty">

                    📅 لا توجد حصص لك اليوم.

                </div>
            `;

        }


        clearInterval(timer);


        timer =
        setInterval(
            function(){

                refreshLessons(
                    container
                );

            },
            15000
        );


    }catch(error){

        console.error(
            "Load Lessons Error:",
            error
        );


        container.innerHTML = `
            <div class="empty">

                ❌ تعذر تحميل الحصص.

                <br><br>

                تأكد من تسجيل الدخول وقواعد Firestore.

            </div>
        `;

    }

}


/* =====================================
   تحديث حالة الحصة
===================================== */

async function refreshLessons(){

    try{

        const result =
        await getDocs(
            collection(
                db,
                "students"
            )
        );


        result.forEach(function(item){

            const student =
            item.data();


            if(
                student.active === false
            ){

                return;

            }


            if(
                student.startTime
            ){

                updateLesson(
                    item.id,
                    student
                );

            }

        });

    }catch(error){

        console.error(error);

    }

}


/* =====================================
   حالة الحصة
===================================== */

function updateLesson(
    id,
    student
){

    const status =
    document.getElementById(
        "status-" + id
    );


    const button =
    document.getElementById(
        "button-" + id
    );


    if(!status || !button){

        return;

    }


    button.style.display =
    "none";


    const start =
    new Date(
        student.startTime
    );


    if(
        isNaN(
            start.getTime()
        )
    ){

        status.className =
        "status waiting";

        status.textContent =
        "⚠️ وقت الحصة غير صحيح.";

        return;

    }


    let end = null;


    if(student.endTime){

        end =
        new Date(
            student.endTime
        );

    }


    if(
        !end ||
        isNaN(end.getTime())
    ){

        end =
        new Date(
            start.getTime()
            +
            30 * 60000
        );

    }


    const now =
    new Date();


    /*
    ==============================
    قبل الحصة
    ==============================
    */

    if(now < start){

        const minutes =
        Math.ceil(
            (
                start.getTime()
                -
                now.getTime()
            )
            /
            60000
        );


        status.className =
        "status waiting";


        status.innerHTML =
        "⏳ الحصة لم تبدأ بعد."
        +
        "<br>"
        +
        "باقي تقريبًا "
        +
        minutes
        +
        " دقيقة.";


        return;

    }


    /*
    ==============================
    أثناء الحصة
    ==============================
    */

    if(
        now >= start &&
        now <= end
    ){

        status.className =
        "status live";


        status.innerHTML =
        "🟢 وقت الحصة الآن";


        button.style.display =
        "block";


        button.onclick =
        function(){

            let url =
            student.link ||
            "";


            url =
            url.trim();


            if(!url){

                showMessage(
                    "⚠️ لم يتم إضافة رابط Google Meet لهذه الحصة.",
                    false
                );

                return;

            }


            if(
                !url.startsWith(
                    "http://"
                )
                &&
                !url.startsWith(
                    "https://"
                )
            ){

                url =
                "https://" + url;

            }


            window.open(
                url,
                "_blank"
            );

        };


        return;

    }


    /*
    ==============================
    بعد الحصة
    ==============================
    */

    status.className =
    "status finished";


    status.innerHTML =
    "✅ انتهت الحصة.";

}


/* =====================================
   التاريخ
===================================== */

function formatDate(date){

    return date.toLocaleDateString(
        "ar-SA",
        {
            year:"numeric",
            month:"long",
            day:"numeric"
        }
    );

}


/* =====================================
   الوقت
===================================== */

function formatTime(date){

    return date.toLocaleTimeString(
        "ar-SA",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* =====================================
   الرسائل
===================================== */

function showMessage(
    text,
    success
){

    const message =
    document.getElementById(
        "message"
    );


    message.textContent =
    text;


    message.className =
    "message "
    +
    (
        success
        ?
        "success"
        :
        "error"
    );


    message.style.display =
    "block";


    setTimeout(
        function(){

            message.style.display =
            "none";

        },
        4000
    );

}


/* =====================================
   حماية النص
===================================== */

function escapeHTML(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================
   تسجيل الخروج
===================================== */

document
.getElementById(
    "logoutButton"
)
.addEventListener(
    "click",
    async function(){

        try{

            clearInterval(timer);

            await signOut(auth);

            window.location.href =
            "login.html";

        }catch(error){

            console.error(error);

            showMessage(
                "❌ تعذر تسجيل الخروج.",
                false
            );

        }

    }
);


</script>


</body>

  </html>
