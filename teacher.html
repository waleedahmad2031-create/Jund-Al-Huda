<header>

<div class="logo">

<div class="container">

<div
id="teacherPage"
class="teacher-page">

<h2>

</h2>

<div class="teacher-info">

id="teacherName"
class="teacher-name">

id="teacherCode">

<script type="module">

/* =========================
   Firebase
========================= */

import {
    db
}
from "./firebase.js";

import {
    collection,
    getDocs,
    query,
    where
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
   عناصر الصفحة
========================= */

const loginCard =
document.getElementById(
    "loginCard"
);

const teacherPage =
document.getElementById(
    "teacherPage"
);

const teacherCodeInput =
document.getElementById(
    "teacherCodeInput"
);

const loginButton =
document.getElementById(
    "loginButton"
);

const loginMessage =
document.getElementById(
    "loginMessage"
);

const pageMessage =
document.getElementById(
    "pageMessage"
);

const teacherName =
document.getElementById(
    "teacherName"
);

const teacherCode =
document.getElementById(
    "teacherCode"
);

const studentsList =
document.getElementById(
    "studentsList"
);

const logoutButton =
document.getElementById(
    "logoutButton"
);


/* =========================
   المدرس الحالي
========================= */

let currentTeacher = null;


/* =========================
   تسجيل دخول المدرس
========================= */

loginButton.addEventListener(
    "click",
    async function(){

        const code =
        teacherCodeInput.value.trim();


        if(!code){

            showLoginMessage(
                "⚠️ أدخل كود المدرس.",
                false
            );

            return;

        }


        if(
            !/^\d{6}$/.test(code)
        ){

            showLoginMessage(
                "⚠️ كود المدرس يجب أن يكون 6 أرقام.",
                false
            );

            return;

        }


        loginButton.disabled =
        true;

        loginButton.textContent =
        "⏳ جاري التحقق...";


        try{

            const result =
            await getDocs(

                query(

                    collection(
                        db,
                        "teachers"
                    ),

                    where(
                        "code",
                        "==",
                        code
                    )

                )

            );


            if(result.empty){

                showLoginMessage(
                    "❌ كود المدرس غير صحيح.",
                    false
                );

                return;

            }


            const teacherDoc =
            result.docs[0];

            const teacher =
            teacherDoc.data();


            if(
                teacher.active === false
            ){

                showLoginMessage(
                    "⛔ هذا المدرس غير نشط حاليًا.",
                    false
                );

                return;

            }


            currentTeacher = {

                id:
                teacherDoc.id,

                ...teacher

            };


            localStorage.setItem(
                "jundTeacherId",
                teacherDoc.id
            );

            localStorage.setItem(
                "jundTeacherCode",
                teacher.code || ""
            );

            localStorage.setItem(
                "jundTeacherName",
                teacher.name || ""
            );


            openTeacherPage();


        }catch(error){

            console.error(
                "Teacher login error:",
                error
            );


            showLoginMessage(
                "❌ تعذر الدخول: " +
                error.message,
                false
            );

        }finally{

            loginButton.disabled =
            false;

            loginButton.textContent =
            "🔐 دخول المدرس";

        }

    }
);


/* =========================
   فتح صفحة المدرس
========================= */

async function openTeacherPage(){

    loginCard.style.display =
    "none";

    teacherPage.style.display =
    "block";


    teacherName.textContent =
    currentTeacher.name ||
    "المدرس";


    teacherCode.textContent =
    currentTeacher.code ||
    "-";


    await loadTeacherStudents();

}
    /* =========================
   تحميل طلاب وحصص المدرس
========================= */

async function loadTeacherStudents(){

    studentsList.innerHTML = `

        <div class="loading">
            ⏳ جاري تحميل الطلاب والحصص...
        </div>

    `;


    try{

        /* =========================
           تحميل طلاب المدرس
        ========================= */

        const studentsResult =
        await getDocs(

            query(

                collection(
                    db,
                    "students"
                ),

                where(
                    "teacherId",
                    "==",
                    currentTeacher.id
                )

            )

        );


        /* =========================
           تحميل حصص المدرس
        ========================= */

        const lessonsResult =
        await getDocs(
            collection(
                db,
                "liveSessions"
            )
        );


        const lessons = [];


        lessonsResult.forEach(
            function(item){

                const lesson =
                item.data();


                const lessonTeacherId =
                String(
                    lesson.teacherId || ""
                ).trim();


                const lessonTeacherName =
                String(
                    lesson.teacherName || ""
                ).trim();


                const currentTeacherId =
                String(
                    currentTeacher.id || ""
                ).trim();


                const currentTeacherName =
                String(
                    currentTeacher.name || ""
                ).trim();


                /*
                ربط الحصة بالمدرس
                */

                const isSameTeacher =
                    (
                        lessonTeacherId &&
                        lessonTeacherId ===
                        currentTeacherId
                    )
                    ||
                    (
                        !lessonTeacherId &&
                        lessonTeacherName ===
                        currentTeacherName
                    );


                if(
                    isSameTeacher &&
                    lesson.status !== "cancelled"
                ){

                    lessons.push({

                        id:
                        item.id,

                        ...lesson

                    });

                }

            }
        );


        /* =========================
           لا توجد بيانات
        ========================= */

        if(
            studentsResult.empty &&
            lessons.length === 0
        ){

            studentsList.innerHTML = `

                <div class="empty">

                    📚 لا يوجد طلاب أو حصص مجدولة لك حاليًا.

                </div>

            `;

            return;

        }


        studentsList.innerHTML =
        "";


        /* =========================
           عرض الطلاب
        ========================= */

        studentsResult.forEach(
            function(item){

                const student =
                item.data();


                const div =
                document.createElement(
                    "div"
                );


                div.className =
                "student-item";


                /* =========================
                   حصص هذا الطالب
                ========================= */

                const studentLessons =
                lessons.filter(
                    function(lesson){

                        const lessonStudentId =
                        String(
                            lesson.studentId || ""
                        ).trim();


                        const studentId =
                        String(
                            item.id || ""
                        ).trim();


                        if(
                            lessonStudentId &&
                            studentId
                        ){

                            return (
                                lessonStudentId ===
                                studentId
                            );

                        }


                        return String(
                            lesson.studentName || ""
                        ).trim()
                        ===
                        String(
                            student.name || ""
                        ).trim();

                    }
                );


                let lessonsHTML =
                "";


                /* =========================
                   لا توجد حصة
                ========================= */

                if(
                    studentLessons.length === 0
                ){

                    lessonsHTML = `

                        <div class="lesson">

                            <div class="lesson-title">

                                📖 الحصة

                            </div>

                            ⚠️ لا توجد حصة مجدولة لهذا الطالب حاليًا.

                        </div>

                    `;

                }

                else{

                    /* =========================
                       عرض الحصص
                    ========================= */

                    studentLessons.forEach(
                        function(lesson){

                            lessonsHTML +=
                            createLessonHTML(
                                lesson
                            );

                        }
                    );

                }


                /* =========================
                   بيانات الطالب
                ========================= */

                div.innerHTML = `

                    <strong>

                        👤 ${
                            escapeHTML(
                                student.name ||
                                "بدون اسم"
                            )
                        }

                    </strong>

                    <br>

                    📱 الهاتف:

                    ${
                        escapeHTML(
                            student.phone ||
                            "-"
                        )
                    }

                    <br>

                    🔐 كود الطالب:

                    ${
                        escapeHTML(
                            student.code ||
                            "-"
                        )
                    }

                    <br>

                    📚 المستوى:

                    ${
                        escapeHTML(
                            student.level ||
                            "-"
                        )
                    }

                    ${lessonsHTML}

                `;


                studentsList.appendChild(
                    div
                );

            }
        );


        /* =========================
           حصص غير مرتبطة بطالب ظاهر
        ========================= */

        const displayedLessonIds =
        new Set();


        studentsResult.forEach(
            function(item){

                const student =
                item.data();


                lessons.forEach(
                    function(lesson){

                        const lessonStudentId =
                        String(
                            lesson.studentId || ""
                        ).trim();


                        const studentId =
                        String(
                            item.id || ""
                        ).trim();


                        const sameStudent =
                            (
                                lessonStudentId &&
                                lessonStudentId ===
                                studentId
                            )
                            ||
                            (
                                !lessonStudentId &&
                                String(
                                    lesson.studentName || ""
                                ).trim()
                                ===
                                String(
                                    student.name || ""
                                ).trim()
                            );


                        if(
                            sameStudent
                        ){

                            displayedLessonIds.add(
                                lesson.id
                            );

                        }

                    }
                );

            }
        );


        const unlinkedLessons =
        lessons.filter(
            function(lesson){

                return !
                displayedLessonIds.has(
                    lesson.id
                );

            }
        );


        if(
            unlinkedLessons.length > 0
        ){

            const title =
            document.createElement(
                "div"
            );


            title.style.cssText = `

                margin-top:18px;
                margin-bottom:12px;
                color:#075e54;
                font-size:18px;
                font-weight:bold;

            `;


            title.textContent =
            "📅 حصص مجدولة";


            studentsList.appendChild(
                title
            );


            unlinkedLessons.forEach(
                function(lesson){

                    const div =
                    document.createElement(
                        "div"
                    );


                    div.className =
                    "student-item";


                    div.innerHTML = `

                        👨‍🎓 <strong>

                            الطالب:

                            ${
                                escapeHTML(
                                    lesson.studentName ||
                                    "-"
                                )
                            }

                        </strong>

                        ${
                            createLessonHTML(
                                lesson
                            )
                        }

                    `;


                    studentsList.appendChild(
                        div
                    );

                }
            );

        }


    }catch(error){

        console.error(
            "Load teacher students error:",
            error
        );


        studentsList.innerHTML = `

            <div class="empty">

                ❌ تعذر تحميل الطلاب والحصص.

                <br><br>

                ${
                    escapeHTML(
                        error.message ||
                        ""
                    )
                }

            </div>

        `;

    }

}


/* =========================
   عرض الحصة حسب الوقت
========================= */

function createLessonHTML(lesson){

    const lessonDate =
    String(
        lesson.lessonDate || ""
    ).trim();


    const startTime =
    String(
        lesson.startTime ||
        lesson.lessonTime ||
        ""
    ).trim();


    const endTime =
    String(
        lesson.endTime || ""
    ).trim();


    let meetingButton = "";


    /*
    إذا لا يوجد تاريخ أو وقت
    لا نظهر الرابط.
    */

    if(
        !lessonDate ||
        !startTime ||
        !endTime
    ){

        meetingButton = `

            <div
            style="
            margin-top:12px;
            background:#fff3cd;
            color:#856404;
            border-radius:10px;
            padding:11px;
            text-align:center;">

                ⏳ لم يتم تحديد وقت الحصة كاملًا.

            </div>

        `;

    }

    else{

        const now =
        new Date();


        const start =
        new Date(
            lessonDate +
            "T" +
            startTime
        );


        const end =
        new Date(
            lessonDate +
            "T" +
            endTime
        );


        /*
        الحصة بدأت الآن
        */

        if(
            now >= start &&
            now <= end
        ){

            if(
                lesson.meetingUrl
            ){

                meetingButton = `

                    <a
                        class="online-button"
                        href="${
                            escapeHTML(
                                lesson.meetingUrl
                            )
                        }"
                        target="_blank"
                        rel="noopener">

                        🎥 دخول الحصة المباشرة الآن

                    </a>

                `;

            }

            else{

                meetingButton = `

                    <div
                    style="
                    margin-top:12px;
                    background:#ffe8e8;
                    color:#a00000;
                    border-radius:10px;
                    padding:11px;
                    text-align:center;">

                        ⚠️ الحصة بدأت ولكن لم يتم إضافة رابط Meet.

                    </div>

                `;

            }

        }

        /*
        الحصة لم تبدأ
        */

        else if(
            now < start
        ){

            meetingButton = `

                <div
                style="
                margin-top:12px;
                background:#fff8df;
                color:#856404;
                border-radius:10px;
                padding:11px;
                text-align:center;">

                    🔒 رابط الحصة سيظهر عند بدء الوقت المحدد.

                </div>

            `;

        }

        /*
        الحصة انتهت
        */

        else{

            meetingButton = `

                <div
                style="
                margin-top:12px;
                background:#f1f1f1;
                color:#777;
                border-radius:10px;
                padding:11px;
                text-align:center;">

                    ⏰ انتهت الحصة.

                </div>

            `;

        }

    }


    return `

        <div class="lesson">

            <div class="lesson-title">

                📖 الحصة المجدولة

            </div>

            📚 المادة:

            ${
                escapeHTML(
                    lesson.subject ||
                    "بدون مادة"
                )
            }

            <br>

            📅 التاريخ:

            ${
                escapeHTML(
                    lessonDate ||
                    "-"
                )
            }

            <br>

            🕐 وقت الحصة:

            ${
                escapeHTML(
                    startTime ||
                    "-"
                )
            }

            ${
                endTime
                ?
                " - " +
                escapeHTML(endTime)
                :
                ""
            }

            <br>

            📊 الحالة:

            ${
                lesson.status ===
                "scheduled"

                ?

                "🟢 مجدولة"

                :

                escapeHTML(
                    lesson.status ||
                    "-"
                )
            }

            ${meetingButton}

        </div>

    `;

            }

    /* =========================
   تسجيل الخروج
========================= */

logoutButton.addEventListener(
    "click",
    function(){

        localStorage.removeItem(
            "jundTeacherId"
        );

        localStorage.removeItem(
            "jundTeacherCode"
        );

        localStorage.removeItem(
            "jundTeacherName"
        );


        currentTeacher = null;


        teacherPage.style.display =
        "none";

        loginCard.style.display =
        "block";


        teacherCodeInput.value =
        "";


        showLoginMessage(
            "",
            false
        );

    }
);


/* =========================
   استعادة جلسة المدرس
========================= */

async function restoreTeacher(){

    const savedId =
    localStorage.getItem(
        "jundTeacherId"
    );


    if(!savedId){

        return;

    }


    try{

        const result =
        await getDocs(
            collection(
                db,
                "teachers"
            )
        );


        const teacherDoc =
        result.docs.find(
            function(item){

                return item.id ===
                savedId;

            }
        );


        if(!teacherDoc){

            localStorage.removeItem(
                "jundTeacherId"
            );

            return;

        }


        const teacher =
        teacherDoc.data();


        if(
            teacher.active === false
        ){

            localStorage.removeItem(
                "jundTeacherId"
            );

            return;

        }


        currentTeacher = {

            id:
            teacherDoc.id,

            ...teacher

        };


        await openTeacherPage();


    }
    catch(error){

        console.error(
            "Restore teacher error:",
            error
        );

    }

}


/* =========================
   رسالة تسجيل الدخول
========================= */

function showLoginMessage(
    text,
    success
){

    loginMessage.textContent =
    text;


    loginMessage.className =
    "message " +
    (
        success
        ?
        "success"
        :
        "error"
    );


    loginMessage.style.display =
    text
    ?
    "block"
    :
    "none";

}


/* =========================
   رسالة الصفحة
========================= */

function showPageMessage(
    text,
    success
){

    pageMessage.textContent =
    text;


    pageMessage.className =
    "message " +
    (
        success
        ?
        "success"
        :
        "error"
    );


    pageMessage.style.display =
    text
    ?
    "block"
    :
    "none";

}


/* =========================
   حماية النص
========================= */

function escapeHTML(value){

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}
