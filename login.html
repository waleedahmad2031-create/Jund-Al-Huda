<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>دخول الإدارة | جنود الهدى</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#f5f7f6;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:430px;
}

.card{
    background:white;
    border-radius:20px;
    padding:30px 22px;
    box-shadow:0 5px 20px rgba(0,0,0,.09);
}

.logo{
    text-align:center;
    font-size:50px;
    margin-bottom:8px;
}

h1{
    text-align:center;
    color:#075e54;
    font-size:27px;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#777;
    margin-bottom:28px;
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:8px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:11px;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#075e54;
}

button{
    width:100%;
    padding:15px;
    border:0;
    border-radius:11px;
    background:#075e54;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#064f48;
}

.error{
    display:none;
    margin-top:15px;
    padding:13px;
    background:#ffe8e8;
    color:#b00020;
    border-radius:10px;
    text-align:center;
    line-height:1.7;
}

.loading{
    display:none;
    text-align:center;
    margin-top:15px;
    color:#075e54;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#075e54;
    text-decoration:none;
}

.security{
    margin-top:22px;
    background:#f1f6f5;
    padding:15px;
    border-radius:12px;
    font-size:13px;
    color:#555;
    line-height:1.9;
}

</style>

</head>

<body>

<div class="container">

    <div class="card">

        <div class="logo">🕌</div>

        <h1>جنود الهدى</h1>

        <div class="subtitle">
            🔐 دخول الإدارة
        </div>


        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    البريد الإلكتروني
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="البريد الإلكتروني"
                    autocomplete="username"
                    required>

            </div>


            <div class="form-group">

                <label for="password">
                    كلمة المرور
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="كلمة المرور"
                    autocomplete="current-password"
                    required>

            </div>


            <button type="submit">

                🔐 دخول الإدارة

            </button>

        </form>


        <div
            id="loading"
            class="loading">

            ⏳ جاري تسجيل الدخول...

        </div>


        <div
            id="error"
            class="error">

            ⚠️ البريد الإلكتروني أو كلمة المرور غير صحيحة.

        </div>


        <div class="security">

            🔒 هذه الصفحة مخصصة لإدارة الأكاديمية فقط.
            <br>
            لا تشارك بيانات الدخول مع أي شخص.

        </div>


        <a
            href="index.html"
            class="back">

            ← العودة إلى الرئيسية

        </a>

    </div>

</div>


<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const firebaseConfig = {

    apiKey:
    "AIzaSyBCnQWX_kKckwncvS9rnfi5YHsDbCWhtoU",

    authDomain:
    "jundalhuda.firebaseapp.com",

    projectId:
    "jundalhuda",

    storageBucket:
    "jundalhuda.firebasestorage.app",

    messagingSenderId:
    "275883570506",

    appId:
    "1:275883570506:web:fb5e72953a3d5a66ef3db3",

    measurementId:
    "G-ZZNZKN73BQ"

};


const app =
initializeApp(firebaseConfig);


const auth =
getAuth(app);


const form =
document.getElementById("loginForm");

const loading =
document.getElementById("loading");

const error =
document.getElementById("error");


form.addEventListener("submit", async function(e){

    e.preventDefault();

    error.style.display = "none";

    loading.style.display = "block";


    const email =
        document
        .getElementById("email")
        .value
        .trim();

    const password =
        document
        .getElementById("password")
        .value;


    try {

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );


        window.location.href =
            "admin.html";


    } catch(err) {

        console.error(err);

        loading.style.display = "none";

        error.textContent =
            "⚠️ البريد الإلكتروني أو كلمة المرور غير صحيحة.";

        error.style.display = "block";

    }

});

</script>

</body>

</html>
