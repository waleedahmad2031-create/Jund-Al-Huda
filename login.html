<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>دخول الإدارة | جنود الهدى</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#f5f7f6;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:430px;
}

.card{
    background:white;
    border-radius:20px;
    padding:30px 22px;
    box-shadow:0 5px 20px rgba(0,0,0,.09);
}

.logo{
    text-align:center;
    font-size:50px;
    margin-bottom:8px;
}

h1{
    text-align:center;
    color:#075e54;
    font-size:27px;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#777;
    margin-bottom:28px;
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:8px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:11px;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#075e54;
}

button{
    width:100%;
    padding:15px;
    border:0;
    border-radius:11px;
    background:#075e54;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.error{
    display:none;
    margin-top:15px;
    padding:13px;
    background:#ffe8e8;
    color:#b00020;
    border-radius:10px;
    text-align:center;
    line-height:1.7;
}

.success{
    display:none;
    margin-top:15px;
    padding:13px;
    background:#e8f7f2;
    color:#075e54;
    border-radius:10px;
    text-align:center;
    line-height:1.7;
}

.loading{
    display:none;
    text-align:center;
    margin-top:15px;
    color:#075e54;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#075e54;
    text-decoration:none;
}

.security{
    margin-top:22px;
    background:#f1f6f5;
    padding:15px;
    border-radius:12px;
    font-size:13px;
    color:#555;
    line-height:1.9;
}

</style>

</head>


<body>


<div class="container">

    <div class="card">

        <div class="logo">
            🕌
        </div>

        <h1>
            جنود الهدى
        </h1>

        <div class="subtitle">
            🔐 دخول الإدارة
        </div>


        <form id="loginForm">


            <div class="form-group">

                <label for="email">
                    البريد الإلكتروني
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="البريد الإلكتروني"
                    autocomplete="username"
                    required>

            </div>


            <div class="form-group">

                <label for="password">
                    كلمة المرور
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="كلمة المرور"
                    autocomplete="current-password"
                    required>

            </div>


            <button
                type="submit"
                id="loginButton">

                🔐 دخول الإدارة

            </button>

        </form>


        <div
            id="loading"
            class="loading">

            ⏳ جاري تسجيل الدخول...

        </div>


        <div
            id="error"
            class="error">

        </div>


        <div
            id="success"
            class="success">

        </div>


        <div class="security">

            🔒 هذه الصفحة مخصصة لإدارة الأكاديمية فقط.

            <br>

            لا تشارك بيانات الدخول مع أي شخص.

        </div>


        <a
            href="index.html"
            class="back">

            ← العودة إلى الرئيسية

        </a>

    </div>

</div>



<script type="module">


/* ========================================
   Firebase
======================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


/* ========================================
   إعدادات Firebase
======================================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyBCnQWX_kKckwncvS9rnfi5YHsDbCWhtoU",

    authDomain:
    "jundalhuda.firebaseapp.com",

    projectId:
    "jundalhuda",

    storageBucket:
    "jundalhuda.firebasestorage.app",

    messagingSenderId:
    "275883570506",

    appId:
    "1:275883570506:web:fb5e72953a3d5a66ef3db3",

    measurementId:
    "G-ZZNZKN73BQ"

};


/* ========================================
   تشغيل Firebase
======================================== */

const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


/* ========================================
   عناصر الصفحة
======================================== */

const form =
    document.getElementById(
        "loginForm"
    );


const emailInput =
    document.getElementById(
        "email"
    );


const passwordInput =
    document.getElementById(
        "password"
    );


const loginButton =
    document.getElementById(
        "loginButton"
    );


const loading =
    document.getElementById(
        "loading"
    );


const errorBox =
    document.getElementById(
        "error"
    );


const successBox =
    document.getElementById(
        "success"
    );


/* ========================================
   إذا كان مسجل دخول بالفعل
======================================== */

onAuthStateChanged(
    auth,
    function(user){

        if(user){

            window.location.href =
                "admin.html";

        }

    }
);


/* ========================================
   تسجيل الدخول
======================================== */

form.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        hideMessages();


        const email =
            emailInput.value.trim();


        const password =
            passwordInput.value;


        if(!email){

            showError(
                "⚠️ اكتب البريد الإلكتروني."
            );

            return;

        }


        if(!password){

            showError(
                "⚠️ اكتب كلمة المرور."
            );

            return;

        }


        loginButton.disabled =
            true;


        loginButton.textContent =
            "⏳ جاري الدخول...";


        loading.style.display =
            "block";


        try{


            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


            loading.style.display =
                "none";


            successBox.textContent =
                "✅ تم تسجيل الدخول بنجاح...";


            successBox.style.display =
                "block";


            /*
            =================================
            الانتقال إلى لوحة الإدارة
            =================================
            */

            setTimeout(
                function(){

                    window.location.href =
                        "admin.html";

                },
                500
            );


        }catch(error){

            console.error(
                "Firebase Login Error:",
                error
            );


            loading.style.display =
                "none";


            let message =
                "❌ تعذر تسجيل الدخول.";


            if(
                error.code ===
                "auth/invalid-credential"
            ){

                message =
                    "❌ البريد الإلكتروني أو كلمة المرور غير صحيحة.";

            }


            else if(
                error.code ===
                "auth/invalid-email"
            ){

                message =
                    "⚠️ البريد الإلكتروني غير صحيح.";

            }


            else if(
                error.code ===
                "auth/user-disabled"
            ){

                message =
                    "⛔ تم تعطيل هذا الحساب.";

            }


            else if(
                error.code ===
                "auth/too-many-requests"
            ){

                message =
                    "⚠️ محاولات كثيرة. انتظر قليلًا ثم حاول مرة أخرى.";

            }


            else if(
                error.code ===
                "auth/network-request-failed"
            ){

                message =
                    "🌐 تحقق من اتصال الإنترنت.";

            }


            else{

                message =
                    "❌ حدث خطأ أثناء تسجيل الدخول: "
                    +
                    error.message;

            }


            showError(message);


            loginButton.disabled =
                false;


            loginButton.textContent =
                "🔐 دخول الإدارة";

        }

    }
);


/* ========================================
   إظهار الخطأ
======================================== */

function showError(message){

    errorBox.textContent =
        message;

    errorBox.style.display =
        "block";

}


/* ========================================
   إخفاء الرسائل
======================================== */

function hideMessages(){

    errorBox.style.display =
        "none";

    successBox.style.display =
        "none";

}


</script>


</body>

</html>
