<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>دخول المدرس | جنود الهدى</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    background:#f4f7f5;
    color:#222;
}

header{
    background:linear-gradient(
        135deg,
        #075e54,
        #0b806f
    );

    color:white;
    text-align:center;
    padding:30px 15px;
}

.logo{
    font-size:48px;
}

header h1{
    font-size:28px;
    margin-top:5px;
}

header p{
    margin-top:6px;
    font-size:14px;
}

.container{
    max-width:500px;
    margin:auto;
    padding:25px 15px;
}

.card{
    background:white;
    border-radius:18px;
    padding:25px 20px;
    box-shadow:
        0 5px 20px
        rgba(0,0,0,.08);
}

h2{
    text-align:center;
    color:#075e54;
    margin-bottom:10px;
}

.description{
    text-align:center;
    color:#777;
    line-height:1.8;
    margin-bottom:22px;
}

.field{
    margin-bottom:15px;
}

label{
    display:block;
    margin-bottom:7px;
    color:#075e54;
    font-weight:bold;
}

input{
    width:100%;
    padding:15px;
    border:1px solid #ddd;
    border-radius:11px;
    font-size:16px;
    outline:none;
    direction:ltr;
    text-align:left;
}

input:focus{
    border-color:#075e54;
}

.login-button{
    width:100%;
    border:0;
    border-radius:11px;
    padding:15px;
    background:#075e54;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    margin-top:5px;
}

.login-button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    display:none;
    margin-top:15px;
    padding:13px;
    border-radius:10px;
    text-align:center;
    line-height:1.8;
}

.error{
    background:#ffe8e8;
    color:#a00000;
}

.success{
    background:#e8f7f2;
    color:#075e54;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#075e54;
    text-decoration:none;
}

.info{
    margin-top:18px;
    padding:13px;
    border-radius:10px;
    background:#f8faf9;
    color:#777;
    font-size:13px;
    line-height:1.8;
    text-align:center;
}

footer{
    margin-top:25px;
    background:#075e54;
    color:white;
    text-align:center;
    padding:20px;
    font-size:13px;
}

</style>

</head>


<body>


<header>

    <div class="logo">
        🕌
    </div>

    <h1>
        جنود الهدى
    </h1>

    <p>
        لوحة المدرس
    </p>

</header>


<div class="container">


<div class="card">

    <h2>
        👨‍🏫 دخول المدرس
    </h2>


    <p class="description">

        أدخل البريد الإلكتروني وكلمة المرور
        للدخول إلى لوحة المدرس.

    </p>


    <form id="loginForm">


        <div class="field">

            <label>
                📧 البريد الإلكتروني
            </label>

            <input
                type="email"
                id="email"
                placeholder="example@email.com"
                autocomplete="email"
                required>

        </div>


        <div class="field">

            <label>
                🔐 كلمة المرور
            </label>

            <input
                type="password"
                id="password"
                placeholder="كلمة المرور"
                autocomplete="current-password"
                required>

        </div>


        <button
            type="submit"
            id="loginButton"
            class="login-button">

            🔐 تسجيل الدخول

        </button>


    </form>


    <div
        id="message"
        class="message">

    </div>


    <div class="info">

        🔒 تسجيل الدخول محمي بواسطة Firebase.

        <br>

        إذا لم يكن الحساب مسجلاً في Firebase
        فلن يتم الدخول.

    </div>


    <a
        href="index.html"
        class="back">

        ← العودة للرئيسية

    </a>

</div>


</div>


<footer>

    جنود الهدى © 2026

    <br>

    أكاديمية القرآن الكريم

</footer>



<script type="module">


/* =========================================
   Firebase
========================================= */

import {
    auth
}
from "./firebase.js";


import {
    signInWithEmailAndPassword
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* =========================================
   العناصر
========================================= */

const form =
document.getElementById(
    "loginForm"
);


const emailInput =
document.getElementById(
    "email"
);


const passwordInput =
document.getElementById(
    "password"
);


const loginButton =
document.getElementById(
    "loginButton"
);


const message =
document.getElementById(
    "message"
);


/* =========================================
   تسجيل الدخول
========================================= */

form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        hideMessage();


        const email =
        emailInput.value.trim();


        const password =
        passwordInput.value;


        if(!email){

            showMessage(
                "⚠️ اكتب البريد الإلكتروني.",
                false
            );

            return;

        }


        if(!password){

            showMessage(
                "⚠️ اكتب كلمة المرور.",
                false
            );

            return;

        }


        loginButton.disabled =
        true;


        loginButton.textContent =
        "⏳ جاري تسجيل الدخول...";


        try{

            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


            showMessage(
                "✅ تم تسجيل الدخول بنجاح. جاري فتح لوحة المدرس...",
                true
            );


            setTimeout(
                function(){

                    window.location.href =
                    "teacher.html";

                },
                700
            );


        }catch(error){

            console.error(
                "Login Error:",
                error
            );


            let text =
            "❌ تعذر تسجيل الدخول.";


            if(
                error.code ===
                "auth/invalid-credential"
            ){

                text =
                "❌ البريد الإلكتروني أو كلمة المرور غير صحيحة.";

            }

            else if(
                error.code ===
                "auth/user-not-found"
            ){

                text =
                "❌ لا يوجد حساب بهذا البريد الإلكتروني.";

            }

            else if(
                error.code ===
                "auth/wrong-password"
            ){

                text =
                "❌ كلمة المرور غير صحيحة.";

            }

            else if(
                error.code ===
                "auth/invalid-email"
            ){

                text =
                "❌ البريد الإلكتروني غير صحيح.";

            }

            else if(
                error.code ===
                "auth/too-many-requests"
            ){

                text =
                "⚠️ تم إجراء محاولات كثيرة. حاول لاحقًا.";

            }

            else if(
                error.code ===
                "auth/network-request-failed"
            ){

                text =
                "⚠️ تأكد من اتصال الإنترنت.";

            }


            showMessage(
                text,
                false
            );


            loginButton.disabled =
            false;


            loginButton.textContent =
            "🔐 تسجيل الدخول";

        }

    }
);


/* =========================================
   الرسائل
========================================= */

function showMessage(
    text,
    success
){

    message.textContent =
    text;


    message.className =
    "message "
    +
    (
        success
        ?
        "success"
        :
        "error"
    );


    message.style.display =
    "block";

}


function hideMessage(){

    message.style.display =
    "none";

}

</script>


</body>

</html>
