<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>دخول المدرس | جنود الهدى</title><style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    background:#f4f7f5;
    color:#222;
    min-height:100vh;
}

header{
    background:linear-gradient(135deg,#075e54,#0b806f);
    color:white;
    text-align:center;
    padding:30px 15px;
}

.logo{
    font-size:48px;
}

header h1{
    font-size:28px;
    margin-top:5px;
}

header p{
    margin-top:6px;
    font-size:14px;
    opacity:.9;
}

.container{
    max-width:500px;
    margin:auto;
    padding:25px 15px;
}

.card{
    background:white;
    border-radius:18px;
    padding:25px 20px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

h2{
    text-align:center;
    color:#075e54;
    margin-bottom:10px;
}

.description{
    text-align:center;
    color:#777;
    line-height:1.9;
    margin-bottom:22px;
}

.input-group{
    margin-bottom:15px;
}

label{
    display:block;
    color:#075e54;
    font-weight:bold;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:15px;
    border:1px solid #ddd;
    border-radius:11px;
    font-size:16px;
    outline:none;
    direction:ltr;
    text-align:left;
}

input:focus{
    border-color:#075e54;
}

.login-btn{
    width:100%;
    padding:15px;
    border:0;
    border-radius:11px;
    background:#075e54;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    margin-top:5px;
}

.login-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.error{
    display:none;
    margin-top:15px;
    padding:13px;
    border-radius:10px;
    background:#ffe8e8;
    color:#a00000;
    text-align:center;
    line-height:1.8;
}

.success{
    display:none;
    margin-top:15px;
    padding:13px;
    border-radius:10px;
    background:#e8f7f2;
    color:#075e54;
    text-align:center;
    line-height:1.8;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#075e54;
    text-decoration:none;
}

.note{
    margin-top:18px;
    background:#f8faf9;
    color:#666;
    padding:13px;
    border-radius:10px;
    text-align:center;
    line-height:1.8;
    font-size:13px;
}

footer{
    margin-top:30px;
    background:#075e54;
    color:white;
    text-align:center;
    padding:20px;
    font-size:13px;
    line-height:2;
}

</style></head><body><header><div class="logo">
🕌
</div><h1>
جنود الهدى
</h1><p>
لوحة المدرس
</p></header><div class="container"><div class="card"><h2>
👨‍🏫 دخول المدرس
</h2><p class="description">سجل الدخول للوصول إلى حصصك
وإدارة دروس الطلاب.

</p><form id="loginForm"><div class="input-group"><label for="email">
📧 البريد الإلكتروني
</label><input
id="email"
type="email"
placeholder="example@email.com"
autocomplete="email"
required>

</div><div class="input-group"><label for="password">
🔐 كلمة المرور
</label><input
id="password"
type="password"
placeholder="أدخل كلمة المرور"
autocomplete="current-password"
required>

</div><button
id="loginButton"
class="login-btn"
type="submit">

دخول المدرس

</button></form><div
id="errorBox"
class="error">
</div><div
id="successBox"
class="success">✅ تم تسجيل الدخول، جاري فتح لوحة المدرس...

</div><div class="note">🔒 الدخول مخصص للمدرسين المسجلين في النظام.

</div><a
href="index.html"
class="back">

← العودة للرئيسية

</a></div></div><footer>جنود الهدى © 2026

<br>أكاديمية القرآن الكريم

</footer><script type="module">


/* =========================================
   Firebase
========================================= */

import {

    auth

}
from "./firebase.js";


import {

    signInWithEmailAndPassword,
    onAuthStateChanged

}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";



/* =========================================
   العناصر
========================================= */

const loginForm =
document.getElementById(
    "loginForm"
);


const emailInput =
document.getElementById(
    "email"
);


const passwordInput =
document.getElementById(
    "password"
);


const loginButton =
document.getElementById(
    "loginButton"
);


const errorBox =
document.getElementById(
    "errorBox"
);


const successBox =
document.getElementById(
    "successBox"
);



/* =========================================
   إذا كان المدرس مسجلًا بالفعل
========================================= */

onAuthStateChanged(
    auth,
    function(user){

        if(user){

            /*
            إذا فتح المدرس صفحة الدخول
            وهو مسجل بالفعل، نرسله للوحة المدرس.
            */

            window.location.href =
            "teacher.html";

        }

    }
);



/* =========================================
   تسجيل الدخول
========================================= */

loginForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        hideMessages();


        const email =
        emailInput.value.trim();


        const password =
        passwordInput.value;


        if(!email){

            showError(
                "⚠️ اكتب البريد الإلكتروني."
            );

            return;

        }


        if(!password){

            showError(
                "⚠️ اكتب كلمة المرور."
            );

            return;

        }


        loginButton.disabled =
        true;


        loginButton.textContent =
        "⏳ جاري تسجيل الدخول...";


        try{


            await signInWithEmailAndPassword(

                auth,

                email,

                password

            );


            successBox.style.display =
            "block";


            loginButton.textContent =
            "✅ تم الدخول";


            /*
            الانتقال إلى لوحة المدرس
            */

            setTimeout(
                function(){

                    window.location.href =
                    "teacher.html";

                },
                700
            );


        }catch(error){

            console.error(
                "Login Error:",
                error
            );


            let message =
            "❌ تعذر تسجيل الدخول.";


            if(
                error.code ===
                "auth/invalid-credential"
            ){

                message =
                "❌ البريد الإلكتروني أو كلمة المرور غير صحيحة.";

            }

            else if(
                error.code ===
                "auth/user-not-found"
            ){

                message =
                "❌ هذا الحساب غير موجود.";

            }

            else if(
                error.code ===
                "auth/wrong-password"
            ){

                message =
                "❌ كلمة المرور غير صحيحة.";

            }

            else if(
                error.code ===
                "auth/invalid-email"
            ){

                message =
                "⚠️ البريد الإلكتروني غير صحيح.";

            }

            else if(
                error.code ===
                "auth/too-many-requests"
            ){

                message =
                "⏳ تم إجراء محاولات كثيرة. حاول لاحقًا.";

            }

            else if(
                error.code ===
                "auth/network-request-failed"
            ){

                message =
                "🌐 تحقق من اتصال الإنترنت.";

            }


            showError(
                message
            );


            loginButton.disabled =
            false;


            loginButton.textContent =
            "دخول المدرس";

        }

    }
);



/* =========================================
   إظهار الخطأ
========================================= */

function showError(text){

    errorBox.textContent =
    text;

    errorBox.style.display =
    "block";

}



/* =========================================
   إخفاء الرسائل
========================================= */

function hideMessages(){

    errorBox.style.display =
    "none";

    successBox.style.display =
    "none";

}

</script></body></html>
