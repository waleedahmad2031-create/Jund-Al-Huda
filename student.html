id="studentPage"

</h2><div

class="student-name">-

</div></div></div></div><footer>جنود الهدى © 2026

<br>أكاديمية القرآن الكريم

</footer><script type="module">


/* =========================
   Firebase
========================= */

import {
    db
}
from "./firebase.js";


import {
    collection,
    getDocs,
    query,
    where
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
   العناصر
========================= */

const loginCard =
document.getElementById(
    "loginCard"
);

const studentPage =
document.getElementById(
    "studentPage"
);

const studentCodeInput =
document.getElementById(
    "studentCodeInput"
);

const loginButton =
document.getElementById(
    "loginButton"
);

const loginMessage =
document.getElementById(
    "loginMessage"
);

const studentName =
document.getElementById(
    "studentName"
);

const studentCode =
document.getElementById(
    "studentCode"
);

const studentTeacher =
document.getElementById(
    "studentTeacher"
);

const lessonsList =
document.getElementById(
    "lessonsList"
);

const logoutButton =
document.getElementById(
    "logoutButton"
);


/* =========================
   الطالب الحالي
========================= */

let currentStudent = null;


/* =========================
   تسجيل دخول الطالب
========================= */

loginButton.addEventListener(
    "click",
    async function(){

        const code =
        studentCodeInput.value.trim();


        if(!code){

            showLoginMessage(
                "⚠️ أدخل كود الطالب."
            );

            return;

        }


        if(
            !/^\d{6}$/.test(code)
        ){

            showLoginMessage(
                "⚠️ كود الطالب يجب أن يكون 6 أرقام."
            );

            return;

        }


        loginButton.disabled =
        true;

        loginButton.textContent =
        "⏳ جاري التحقق...";


        try{

            const result =
            await getDocs(

                query(

                    collection(
                        db,
                        "students"
                    ),

                    where(
                        "code",
                        "==",
                        code
                    )

                )

            );


            if(result.empty){

                showLoginMessage(
                    "❌ كود الطالب غير صحيح."
                );

                return;

            }


            const studentDoc =
            result.docs[0];


            const student =
            studentDoc.data();


            if(
                student.active === false
            ){

                showLoginMessage(
                    "⛔ هذا الطالب غير نشط حاليًا."
                );

                return;

            }


            currentStudent = {

                id:
                studentDoc.id,

                ...student

            };


            localStorage.setItem(
                "jundStudentId",
                studentDoc.id
            );


            localStorage.setItem(
                "jundStudentCode",
                student.code || ""
            );


            localStorage.setItem(
                "jundStudentName",
                student.name || ""
            );


            openStudentPage();


        }catch(error){

            console.error(
                "Student login error:",
                error
            );


            showLoginMessage(
                "❌ تعذر الدخول: " +
                error.message
            );

        }finally{

            loginButton.disabled =
            false;

            loginButton.textContent =
            "🔐 دخول الطالب";

        }

    }
);


/* =========================
   فتح صفحة الطالب
========================= */

async function openStudentPage(){

    loginCard.style.display =
    "none";

    studentPage.style.display =
    "block";


    studentName.textContent =
    currentStudent.name ||
    "الطالب";


    studentCode.textContent =
    currentStudent.code ||
    "-";


    studentTeacher.textContent =
    currentStudent.teacher ||
    currentStudent.teacherName ||
    "لم يتم تحديده";


    await loadStudentLessons();

}


/* =========================
   تحميل حصص الطالب
========================= */

async function loadStudentLessons(){

    lessonsList.innerHTML = `

        <div class="loading">

            ⏳ جاري تحميل الحصص...

        </div>

    `;


    try{

        /*
        أولًا نحاول البحث بواسطة studentId
        */

        let result =
        await getDocs(

            query(

                collection(
                    db,
                    "liveSessions"
                ),

                where(
                    "studentId",
                    "==",
                    currentStudent.id
                )

            )

        );


        /*
        إذا لم توجد نتائج
        نبحث باسم الطالب.
        */

        if(result.empty){

            result =
            await getDocs(

                query(

                    collection(
                        db,
                        "liveSessions"
                    ),

                    where(
                        "studentName",
                        "==",
                        currentStudent.name
                    )

                )

            );

        }


        if(result.empty){

            lessonsList.innerHTML = `

                <div class="empty">

                    📚 لا توجد حصة مجدولة لك حاليًا.

                    <br>

                    إذا كانت الإدارة أنشأت الحصة،
                    تأكد أن اسم الطالب مطابق لاسمك.

                </div>

            `;

            return;

        }


        lessonsList.innerHTML =
        "";


        result.forEach(
            function(item){

                const lesson =
                item.data();


                const div =
                document.createElement(
                    "div"
                );


                div.className =
                "lesson";


                const date =
                lesson.lessonDate ||
                lesson.date ||
                "-";


                const start =
                lesson.startTime ||
                lesson.lessonTime ||
                lesson.time ||
                "-";


                const end =
                lesson.endTime ||
                "-";


                let meetingButton =
                "";


                if(
                    lesson.meetingUrl
                ){

                    meetingButton = `

                        <a
                            class="online-button"
                            href="${safe(
                                lesson.meetingUrl
                            )}"
                            target="_blank"
                            rel="noopener">

                            🎥 دخول الحصة

                        </a>

                    `;

                }else{

                    meetingButton = `

                        <div
                            class="online-button disabled">

                            ⚠️ لم يتم إضافة رابط الحصة

                        </div>

                    `;

                }


                let statusText =
                "🟢 مجدولة";


                if(
                    lesson.status ===
                    "cancelled"
                ){

                    statusText =
                    "🔴 ملغاة";

                }


                if(
                    lesson.status ===
                    "ended"
                ){

                    statusText =
                    "⚫ انتهت";

                }


                div.innerHTML = `

                    <div class="lesson-title">

                        📖 ${
                            safe(
                                lesson.subject ||
                                "الحصة"
                            )
                        }

                    </div>


                    👨‍🏫 المدرس:

                    <strong>

                        ${
                            safe(
                                lesson.teacherName ||
                                "-"
                            )
                        }

                    </strong>


                    <br>


                    📅 التاريخ:

                    ${
                        safe(date)
                    }


                    <br>


                    🕐 وقت الدخول:

                    ${
                        safe(start)
                    }


                    <br>


                    ⏰ وقت الانتهاء:

                    ${
                        safe(end)
                    }


                    <br>


                    <div class="lesson-status">

                        📊 الحالة:

                        ${
                            statusText
                        }

                    </div>


                    ${
                        lesson.status ===
                        "scheduled"

                        ?

                        meetingButton

                        :

                        ""

                    }

                `;


                lessonsList.appendChild(
                    div
                );

            }
        );


    }catch(error){

        console.error(
            "Student lessons error:",
            error
        );


        lessonsList.innerHTML = `

            <div class="empty">

                ❌ تعذر تحميل الحصص.

                <br><br>

                ${
                    safe(
                        error.message ||
                        ""
                    )
                }

            </div>

        `;

    }

}


/* =========================
   تسجيل الخروج
========================= */

logoutButton.addEventListener(
    "click",
    function(){

        localStorage.removeItem(
            "jundStudentId"
        );


        localStorage.removeItem(
            "jundStudentCode"
        );


        localStorage.removeItem(
            "jundStudentName"
        );


        currentStudent =
        null;


        studentPage.style.display =
        "none";


        loginCard.style.display =
        "block";


        studentCodeInput.value =
        "";


        showLoginMessage("");

    }
);


/* =========================
   استعادة الطالب
========================= */

async function restoreStudent(){

    const savedId =
    localStorage.getItem(
        "jundStudentId"
    );


    if(!savedId){

        return;

    }


    try{

        const result =
        await getDocs(
            collection(
                db,
                "students"
            )
        );


        const studentDoc =
        result.docs.find(
            function(item){

                return item.id ===
                savedId;

            }
        );


        if(!studentDoc){

            localStorage.removeItem(
                "jundStudentId"
            );

            return;

        }


        const student =
        studentDoc.data();


        if(
            student.active === false
        ){

            localStorage.removeItem(
                "jundStudentId"
            );

            return;

        }


        currentStudent = {

            id:
            studentDoc.id,

            ...student

        };


        openStudentPage();


    }catch(error){

        console.error(
            "Restore student error:",
            error
        );

    }

}


/* =========================
   رسالة الدخول
========================= */

function showLoginMessage(
    text
){

    loginMessage.textContent =
    text;


    loginMessage.className =
    "message error";


    loginMessage.style.display =
    text
    ?
    "block"
    :
    "none";

}


/* =========================
   حماية النص
========================= */

function safe(value){

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================
   تشغيل الصفحة
========================= */

console.log(
    "✅ student.html - جنود الهدى يعمل"
);


restoreStudent();


</script></body></html>
