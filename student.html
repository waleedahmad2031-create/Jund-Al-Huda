<!DOCTYPE html>

<head>

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<style>

*{

body{

header{

.success{

.student-page{

}

.student-name{

.lesson-title{

}

.lesson-status{

}

.waiting{

.ready{

}

}

}

}

}

}

    padding:25px;

}

footer{
    margin-top:25px;
    background:#075e54;

@media(max-width:600px){

    .container{
        padding:15px 10px;
    }

    }

</head>

<body>

<header>

<div class="logo">
🕌
</div>

<h1>
جنود الهدى
</h1>

<p>
صفحة الطالب
</p>

</header>


<div class="container">


<!-- =========================
     تسجيل الدخول
========================= -->

<div
id="loginCard"
class="card login-card">

<h2>
🎓 دخول الطالب
</h2>

<div
id="loginMessage"
class="message error">
</div>

<input
id="studentCodeInput"
type="tel"
inputmode="numeric"
maxlength="6"
placeholder="أدخل كود الطالب">

<button
id="loginButton"
class="primary">

🔐 دخول الطالب

</button>

</div>


<!-- =========================
     صفحة الطالب
========================= -->

<div
id="studentPage"
class="student-page">


<div class="card">

<h2>
🎓 بيانات الطالب
</h2>

<div
id="studentName"
class="student-name">

-

</div>

<div class="student-info">

<br>

🔐 كود الطالب:

<strong id="studentCode">
-
</strong>

<br>

👨‍🏫 المدرس:

<strong id="studentTeacher">
-
</strong>

</div>

<button
id="logoutButton"
class="danger"
style="margin-top:15px;">

🚪 تسجيل الخروج

</button>

</div>


<!-- =========================
     الحصص
========================= -->

<div class="card">

<h2>
📅 حصصي المجدولة
</h2>

<div
id="lessonsList"
class="loading">

⏳ جاري تحميل الحصص...

</div>

</div>


</div>

</div>


<footer>

جنود الهدى © 2026

<br>

أكاديمية القرآن الكريم

</footer>


<script type="module">


/* =========================
   Firebase
========================= */

import {
    db
}
from "./firebase.js";


import {
    collection,
    getDocs,
    query,
    where
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
   العناصر
========================= */

const loginCard =
document.getElementById(
    "loginCard"
);

const studentPage =
document.getElementById(
    "studentPage"
);

const studentCodeInput =
document.getElementById(
    "studentCodeInput"
);

const loginButton =
document.getElementById(
    "loginButton"
);

const loginMessage =
document.getElementById(
    "loginMessage"
);

const studentName =
document.getElementById(
    "studentName"
);

const studentCode =
document.getElementById(
    "studentCode"
);

const studentTeacher =
document.getElementById(
    "studentTeacher"
);

const lessonsList =
document.getElementById(
    "lessonsList"
);

const logoutButton =
document.getElementById(
    "logoutButton"
);


/* =========================
   الطالب الحالي
========================= */

let currentStudent = null;

let lessonTimer = null;


/* =========================
   تسجيل الدخول
========================= */

loginButton.addEventListener(
    "click",
    async function(){

        const code =
        studentCodeInput.value.trim();


        if(!code){

            showLoginMessage(
                "⚠️ أدخل كود الطالب."
            );

            return;

        }


        if(!/^\d{6}$/.test(code)){

            showLoginMessage(
                "⚠️ كود الطالب يجب أن يكون 6 أرقام."
            );

            return;

        }


        loginButton.disabled =
        true;

        loginButton.textContent =
        "⏳ جاري التحقق...";


        try{

            /*
            البحث عن الطالب بالكود
            */

            const result =
            await getDocs(

                query(

                    collection(
                        db,
                        "students"
                    ),

                    where(
                        "code",
                        "==",
                        code
                    )

                )

            );


            if(result.empty){

                showLoginMessage(
                    "❌ كود الطالب غير صحيح."
                );

                return;

            }


            const studentDoc =
            result.docs[0];


            const data =
            studentDoc.data();


            if(
                data.active === false
            ){

                showLoginMessage(
                    "⛔ هذا الطالب غير نشط حاليًا."
                );

                return;

            }


            currentStudent = {

                id:
                studentDoc.id,

                ...data

            };


            /*
            حفظ الدخول على الهاتف
            */

            localStorage.setItem(
                "jundStudentId",
                studentDoc.id
            );


            localStorage.setItem(
                "jundStudentCode",
                code
            );


            openStudentPage();


        }catch(error){

            console.error(
                error
            );


            showLoginMessage(
                "❌ تعذر الاتصال بالنظام."
            );

        }finally{

            loginButton.disabled =
            false;

            loginButton.textContent =
            "🔐 دخول الطالب";

        }

    }
);


/* =========================
   فتح صفحة الطالب
========================= */

async function openStudentPage(){

    loginCard.style.display =
    "none";


    studentPage.style.display =
    "block";


    studentName.textContent =
    currentStudent.name ||
    "الطالب";


    studentCode.textContent =
    currentStudent.code ||
    "-";


    studentTeacher.textContent =
    currentStudent.teacher ||
    currentStudent.teacherName ||
    "لم يتم تحديده";


    await loadStudentLessons();

}


/* =========================
   تحميل حصص الطالب
========================= */

async function loadStudentLessons(){

    lessonsList.innerHTML = `

        <div class="loading">

            ⏳ جاري تحميل الحصص...

        </div>

    `;


    try{

        /*
        البحث بواسطة ID الطالب
        */

        let result =
        await getDocs(

            query(

                collection(
                    db,
                    "liveSessions"
                ),

                where(
                    "studentId",
                    "==",
                    currentStudent.id
                )

            )

        );


        /*
        احتياطًا إذا كانت الحصة القديمة
        محفوظة باسم الطالب فقط
        */

        if(result.empty){

            result =
            await getDocs(

                query(

                    collection(
                        db,
                        "liveSessions"
                    ),

                    where(
                        "studentName",
                        "==",
                        currentStudent.name
                    )

                )

            );

        }


        if(result.empty){

            lessonsList.innerHTML = `

                <div class="empty">

                    📚 لا توجد حصة مجدولة لك حاليًا.

                    <br>

                    إذا أنشأت الإدارة حصة،
                    ستظهر هنا.

                </div>

            `;

            return;

        }


        lessonsList.innerHTML =
        "";


        const lessons =
        result.docs.map(
            function(item){

                return {

                    id:
                    item.id,

                    ...item.data()

                };

            }
        );


        /*
        ترتيب الحصص من الأقرب
        */

        lessons.sort(
            function(a,b){

                const aDate =
                String(
                    a.lessonDate || ""
                )
                +
                " " +
                String(
                    a.startTime || ""
                );


                const bDate =
                String(
                    b.lessonDate || ""
                )
                +
                " " +
                String(
                    b.startTime || ""
                );


                return aDate.localeCompare(
                    bDate
                );

            }
        );


        lessons.forEach(
            function(lesson){

                createLessonCard(
                    lesson
                );

            }
        );


    }catch(error){

        console.error(
            "Lessons error:",
            error
        );


        lessonsList.innerHTML = `

            <div class="empty">

                ❌ تعذر تحميل الحصص.

                <br><br>

                ${safe(error.message)}

            </div>

        `;

    }

}


/* =========================
   إنشاء بطاقة الحصة
========================= */

function createLessonCard(
    lesson
){

    const div =
    document.createElement(
        "div"
    );


    div.className =
    "lesson";


    const date =
    lesson.lessonDate ||
    "-";


    const start =
    lesson.startTime ||
    "-";


    const end =
    lesson.endTime ||
    "-";


    const meetingUrl =
    fixMeetingUrl(
        lesson.meetingUrl
    );


    div.innerHTML = `

        <div class="lesson-title">

            📖 ${
                safe(
                    lesson.subject ||
                    "الحصة القرآنية"
                )
            }

        </div>


        👨‍🏫 المدرس:

        <strong>

            ${
                safe(
                    lesson.teacherName ||
                    "-"
                )
            }

        </strong>


        <br>


        📅 التاريخ:

        <strong>

            ${
                safe(date)
            }

        </strong>


        <br>


        🕐 البداية:

        <strong>

            ${
                safe(start)
            }

        </strong>


        <br>


        ⏰ النهاية:

        <strong>

            ${
                safe(end)
            }

        </strong>


        <div
            class="lesson-status waiting"
            data-status-box>

            <strong data-status-title>
                ⏳ جاري التحقق...
            </strong>

            <div
                class="countdown"
                data-countdown>
            </div>

        </div>


        <div data-button-area></div>

    `;


    lessonsList.appendChild(
        div
    );


    updateLessonCard(
        lesson,
        div
    );

}


/* =========================
   تحديث حالة الحصة
========================= */

function updateLessonCard(
    lesson,
    card
){

    const statusBox =
    card.querySelector(
        "[data-status-box]"
    );


    const statusTitle =
    card.querySelector(
        "[data-status-title]"
    );


    const countdown =
    card.querySelector(
        "[data-countdown]"
    );


    const buttonArea =
    card.querySelector(
        "[data-button-area]"
    );


    const start =
    getLessonDate(
        lesson.lessonDate,
        lesson.startTime
    );


    let end =
    getLessonDate(
        lesson.lessonDate,
        lesson.endTime
    );


    if(!start){

        statusBox.className =
        "lesson-status finished";


        statusTitle.textContent =
        "⚠️ موعد الحصة غير صحيح";


        return;

    }


    if(!end){

        end =
        new Date(
            start.getTime()
            +
            30 * 60 * 1000
        );

    }


    const now =
    new Date();


    /*
    الحصة لم تبدأ
    */

    if(now < start){

        statusBox.className =
        "lesson-status waiting";


        statusTitle.textContent =
        "⏳ الحصة لم تبدأ بعد";


        countdown.textContent =
        formatCountdown(
            start.getTime()
            -
            now.getTime()
        );


        buttonArea.innerHTML =
        "";


        return;

    }


    /*
    الحصة الآن
    */

    if(
        now >= start &&
        now < end
    ){

        statusBox.className =
        "lesson-status ready";


        statusTitle.textContent =
        "🟢 الحصة متاحة الآن";


        countdown.textContent =
        "متبقي: " +
        formatCountdown(
            end.getTime()
            -
            now.getTime()
        );


        const url =
        fixMeetingUrl(
            lesson.meetingUrl
        );


        if(url){

            buttonArea.innerHTML = `

                <a
                    class="online-button"
                    href="${safe(url)}"
                    target="_blank"
                    rel="noopener noreferrer">

                    🎥 دخول الحصة الآن

                </a>

            `;

        }else{

            buttonArea.innerHTML = `

                <div class="online-button disabled">

                    ⚠️ لم يتم إضافة رابط الحصة

                </div>

            `;

        }


        return;

    }


    /*
    انتهت الحصة
    */

    statusBox.className =
    "lesson-status finished";


    statusTitle.textContent =
    "🔴 انتهت الحصة";


    countdown.textContent =
    "انتهى وقت الدخول.";


    buttonArea.innerHTML =
    "";

}


/* =========================
   تحديث جميع الحصص كل ثانية
========================= */

function startTimer(){

    if(lessonTimer){

        clearInterval(
            lessonTimer
        );

    }


    lessonTimer =
    setInterval(
        function(){

            const cards =
            document.querySelectorAll(
                ".lesson"
            );


            cards.forEach(
                function(card){

                    const index =
                    Array.from(
                        cards
                    ).indexOf(
                        card
                    );

                }
            );


            /*
            إعادة تحميل الحصص
            بشكل بسيط كل 30 ثانية
            */

        },
        30000
    );

}


/* =========================
   إنشاء تاريخ
========================= */

function getLessonDate(
    dateValue,
    timeValue
){

    if(
        !dateValue ||
        !timeValue
    ){

        return null;

    }


    const dateMatch =
    String(dateValue).match(
        /^(\d{4})-(\d{2})-(\d{2})$/
    );


    const timeMatch =
    String(timeValue).match(
        /^(\d{1,2}):(\d{2})$/
    );


    if(
        !dateMatch ||
        !timeMatch
    ){

        return null;

    }


    return new Date(

        Number(dateMatch[1]),

        Number(dateMatch[2]) - 1,

        Number(dateMatch[3]),

        Number(timeMatch[1]),

        Number(timeMatch[2]),

        0,

        0

    );

}


/* =========================
   العد التنازلي
========================= */

function formatCountdown(
    milliseconds
){

    if(milliseconds <= 0){

        return "00:00:00";

    }


    let seconds =
    Math.floor(
        milliseconds / 1000
    );


    const hours =
    Math.floor(
        seconds / 3600
    );


    seconds %=
    3600;


    const minutes =
    Math.floor(
        seconds / 60
    );


    seconds %=
    60;


    return (

        String(hours)
        .padStart(2,"0")

        +

        ":" +

        String(minutes)
        .padStart(2,"0")

        +

        ":" +

        String(seconds)
        .padStart(2,"0")

    );

}


/* =========================
   إصلاح الرابط
========================= */

function fixMeetingUrl(
    url
){

    let value =
    String(
        url || ""
    ).trim();


    if(!value){

        return "";

    }


    if(
        !value.startsWith(
            "http://"
        )
        &&
        !value.startsWith(
            "https://"
        )
    ){

        value =
        "https://" +
        value;

    }


    return value;

}


/* =========================
   تسجيل الخروج
========================= */

logoutButton.addEventListener(
    "click",
    function(){

        if(lessonTimer){

            clearInterval(
                lessonTimer
            );

        }


        localStorage.removeItem(
            "jundStudentId"
        );


        localStorage.removeItem(
            "jundStudentCode"
        );


        currentStudent =
        null;


        studentPage.style.display =
        "none";


        loginCard.style.display =
        "block";


        studentCodeInput.value =
        "";


        showLoginMessage("");

    }
);


/* =========================
   استعادة الطالب
========================= */

async function restoreStudent(){

    const savedId =
    localStorage.getItem(
        "jundStudentId"
    );


    if(!savedId){

        return;

    }


    try{

        const result =
        await getDocs(
            collection(
                db,
                "students"
            )
        );


        const studentDoc =
        result.docs.find(
            function(item){

                return item.id ===
                savedId;

            }
        );


        if(!studentDoc){

            localStorage.removeItem(
                "jundStudentId"
            );

            return;

        }


        const data =
        studentDoc.data();


        if(data.active === false){

            localStorage.removeItem(
                "jundStudentId"
            );

            return;

        }


        currentStudent = {

            id:
            studentDoc.id,

            ...data

        };


        openStudentPage();


    }catch(error){

        console.error(
            "Restore error:",
            error
        );

    }

}


/* =========================
   رسالة الدخول
========================= */

function showLoginMessage(
    text
){

    loginMessage.textContent =
    text;


    loginMessage.style.display =
    text
    ?
    "block"
    :
    "none";

}


/* =========================
   حماية النص
========================= */

function safe(value){

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================
   التشغيل
========================= */

console.log(
    "✅ student.html يعمل"
);


restoreStudent();

</script>

</body>
