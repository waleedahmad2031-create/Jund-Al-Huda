<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>الطالب | جنود الهدى</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    background:#f4f7f5;
    color:#222;
}

header{
    background:linear-gradient(135deg,#075e54,#0b806f);
    color:white;
    text-align:center;
    padding:25px 15px;
}

.logo{
    font-size:45px;
}

header h1{
    font-size:27px;
    margin-top:5px;
}

header p{
    margin-top:6px;
    font-size:14px;
}

.container{
    max-width:700px;
    margin:auto;
    padding:20px 14px;
}

.card,
.section{
    background:white;
    border-radius:18px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 4px 15px rgba(0,0,0,.07);
}

h2{
    color:#075e54;
    margin-bottom:18px;
    text-align:center;
}

.login-card{
    max-width:500px;
    margin:30px auto;
}

input{
    width:100%;
    padding:15px;
    border:1px solid #ddd;
    border-radius:11px;
    font-size:18px;
    margin-bottom:12px;
    outline:none;
    text-align:center;
    letter-spacing:3px;
}

input:focus{
    border-color:#075e54;
}

button{
    width:100%;
    border:0;
    border-radius:11px;
    padding:14px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
}

.primary{
    background:#075e54;
    color:white;
}

.danger{
    background:#dc3545;
    color:white;
}

.success-button{
    background:#198754;
    color:white;
}

.message{
    display:none;
    padding:13px;
    border-radius:10px;
    text-align:center;
    margin-bottom:15px;
    line-height:1.8;
}

.error{
    background:#ffe8e8;
    color:#a00000;
}

.success{
    background:#e8f7f2;
    color:#075e54;
}

.dashboard{
    display:none;
}

.student-header{
    text-align:center;
    background:#eef8f5;
    border:1px solid #c9e5dd;
    border-radius:15px;
    padding:18px;
    margin-bottom:18px;
}

.student-name{
    color:#075e54;
    font-size:24px;
    font-weight:bold;
    margin-bottom:8px;
}

.student-info{
    color:#666;
    line-height:2;
}

.section-title{
    color:#075e54;
    font-size:20px;
    font-weight:bold;
    margin-bottom:15px;
}

.lesson{
    background:#f8faf9;
    border-radius:14px;
    padding:17px;
    margin-bottom:12px;
    border-right:5px solid #0b806f;
    line-height:2;
}

.lesson-subject{
    color:#075e54;
    font-size:19px;
    font-weight:bold;
}

.lesson-status{
    display:inline-block;
    padding:5px 10px;
    border-radius:8px;
    background:#e8f7f2;
    color:#075e54;
    font-weight:bold;
    margin-top:5px;
}

.meeting-button{
    display:block;
    text-align:center;
    background:#198754;
    color:white;
    text-decoration:none;
    padding:13px;
    border-radius:11px;
    margin-top:12px;
    font-weight:bold;
}

.no-link{
    text-align:center;
    background:#eee;
    color:#777;
    padding:11px;
    border-radius:10px;
    margin-top:12px;
}

.empty{
    text-align:center;
    color:#777;
    background:#fafafa;
    padding:25px;
    border-radius:11px;
    line-height:2;
}

.loading{
    text-align:center;
    padding:25px;
    color:#777;
}

.code-note{
    background:#fff8df;
    border:1px solid #ead58a;
    color:#705b00;
    padding:12px;
    border-radius:10px;
    text-align:center;
    line-height:1.8;
    margin-bottom:15px;
}

.logout{
    margin-top:15px;
}

@media(max-width:600px){

    .container{
        padding:15px 10px;
    }

    .card,
    .section{
        padding:16px;
    }

}

</style>

</head>

<body>

<header>

<div class="logo">🕌</div>

<h1>جنود الهدى</h1>

<p>بوابة الطالب</p>

</header>


<div class="container">


<!-- =========================
     تسجيل الدخول
========================= -->

<div
id="loginCard"
class="card login-card">

<h2>🎓 دخول الطالب</h2>

<div
class="code-note">

🔐 أدخل كود الطالب المكوّن من 6 أرقام

<br>

الكود الذي أعطاك إياه مدير الأكاديمية

</div>

<div
id="loginMessage"
class="message error">
</div>

<input
id="studentCode"
type="text"
inputmode="numeric"
maxlength="6"
placeholder="أدخل كود الطالب">

<button
id="loginButton"
class="primary">

🎓 دخول الطالب

</button>

</div>


<!-- =========================
     لوحة الطالب
========================= -->

<div
id="dashboard"
class="dashboard">

<div class="card">

<div
class="student-header">

<div
id="studentName"
class="student-name">

الطالب

</div>

<div
id="studentInfo"
class="student-info">

جاري تحميل البيانات...

</div>

</div>


<button
id="logoutButton"
class="danger logout">

🚪 تسجيل الخروج

</button>

</div>


<!-- =========================
     الحصص
========================= -->

<div class="section">

<div class="section-title">

📚 حصصي المجدولة

</div>

<div
id="lessonsList"
class="loading">

⏳ جاري تحميل حصصك...

</div>

</div>


</div>

</div>


<footer style="
margin-top:25px;
background:#075e54;
color:white;
text-align:center;
padding:20px;
font-size:13px;
line-height:2;
">

جنود الهدى © 2026

<br>

أكاديمية القرآن الكريم

</footer>


<script type="module">

/* =========================
   Firebase
========================= */

import {
    db
} from "./firebase.js";


import {
    collection,
    getDocs,
    query,
    where
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
   العناصر
========================= */

const loginCard =
document.getElementById(
    "loginCard"
);

const dashboard =
document.getElementById(
    "dashboard"
);

const studentCode =
document.getElementById(
    "studentCode"
);

const loginButton =
document.getElementById(
    "loginButton"
);

const loginMessage =
document.getElementById(
    "loginMessage"
);

const logoutButton =
document.getElementById(
    "logoutButton"
);

const studentName =
document.getElementById(
    "studentName"
);

const studentInfo =
document.getElementById(
    "studentInfo"
);

const lessonsList =
document.getElementById(
    "lessonsList"
);


/* =========================
   الطالب الحالي
========================= */

let currentStudent = null;


/* =========================
   عند فتح الصفحة
========================= */

window.addEventListener(
    "DOMContentLoaded",
    async function(){

        const savedStudent =
        localStorage.getItem(
            "jund_student"
        );


        if(!savedStudent){

            showLogin();

            return;

        }


        try{

            currentStudent =
            JSON.parse(
                savedStudent
            );


            if(
                !currentStudent.id ||
                !currentStudent.code
            ){

                localStorage.removeItem(
                    "jund_student"
                );

                currentStudent =
                null;

                showLogin();

                return;

            }


            /*
             * إعادة التحقق من الطالب
             * عند فتح الصفحة
             */

            const studentQuery =
            query(

                collection(
                    db,
                    "students"
                ),

                where(
                    "code",
                    "==",
                    currentStudent.code
                )

            );


            const result =
            await getDocs(
                studentQuery
            );


            if(result.empty){

                localStorage.removeItem(
                    "jund_student"
                );

                currentStudent =
                null;

                showLogin();

                showLoginError(
                    "❌ لم يعد الطالب موجودًا."
                );

                return;

            }


            const studentDoc =
            result.docs[0];


            const data =
            studentDoc.data();


            /*
             * التأكد أن الكود ما زال
             * مرتبطًا بنفس الطالب
             */

            if(
                studentDoc.id !==
                currentStudent.id
            ){

                localStorage.removeItem(
                    "jund_student"
                );

                currentStudent =
                null;

                showLogin();

                showLoginError(
                    "❌ بيانات الدخول غير صالحة."
                );

                return;

            }


            if(
                data.active === false
            ){

                localStorage.removeItem(
                    "jund_student"
                );

                currentStudent =
                null;

                showLogin();

                showLoginError(
                    "🔴 هذا الطالب غير نشط حاليًا."
                );

                return;

            }


            /*
             * تحديث بيانات الطالب
             */

            currentStudent = {

                id:
                studentDoc.id,

                code:
                data.code ||
                currentStudent.code,

                name:
                data.name ||
                "الطالب",

                phone:
                data.phone ||
                "",

                age:
                data.age ||
                "",

                teacher:
                data.teacher ||
                ""

            };


            localStorage.setItem(
                "jund_student",
                JSON.stringify(
                    currentStudent
                )
            );


            showDashboard();

            displayStudent();

            await loadMyLessons();


        }catch(error){

            console.error(
                "Startup error:",
                error
            );


            localStorage.removeItem(
                "jund_student"
            );

            currentStudent =
            null;

            showLogin();

        }

    }
);


/* =========================
   دخول الطالب بالكود فقط
========================= */

loginButton.addEventListener(
    "click",
    async function(){

        const code =
        studentCode.value.trim();


        if(!code){

            showLoginError(
                "⚠️ أدخل كود الطالب."
            );

            return;

        }


        if(!/^\d{6}$/.test(code)){

            showLoginError(
                "⚠️ كود الطالب يجب أن يكون 6 أرقام."
            );

            return;

        }


        loginButton.disabled =
        true;

        loginButton.textContent =
        "⏳ جاري التحقق...";


        try{

            /*
             * البحث بالكود فقط
             */

            const studentQuery =
            query(

                collection(
                    db,
                    "students"
                ),

                where(
                    "code",
                    "==",
                    code
                )

            );


            const result =
            await getDocs(
                studentQuery
            );


            if(result.empty){

                showLoginError(
                    "❌ كود الطالب غير صحيح."
                );

                return;

            }


            /*
             * أخذ الطالب المرتبط بالكود
             */

            const studentDoc =
            result.docs[0];


            const data =
            studentDoc.data();


            /*
             * الطالب غير النشط
             */

            if(
                data.active === false
            ){

                showLoginError(
                    "🔴 هذا الطالب غير نشط حاليًا. راجع إدارة الأكاديمية."
                );

                return;

            }


            /*
             * حفظ هوية الطالب
             */

            currentStudent = {

                id:
                studentDoc.id,

                code:
                data.code || code,

                name:
                data.name || "الطالب",

                phone:
                data.phone || "",

                age:
                data.age || "",

                teacher:
                data.teacher || ""

            };


            localStorage.setItem(
                "jund_student",
                JSON.stringify(
                    currentStudent
                )
            );


            showLoginError("");

            showDashboard();

            displayStudent();

            await loadMyLessons();


        }catch(error){

            console.error(
                "Student login error:",
                error
            );


            showLoginError(
                "❌ تعذر تسجيل الدخول: " +
                error.message
            );

        }finally{

            loginButton.disabled =
            false;

            loginButton.textContent =
            "🎓 دخول الطالب";

        }

    }
);


/* =========================
   زر Enter
========================= */

studentCode.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Enter"
        ){

            loginButton.click();

        }

    }
);


/* =========================
   تسجيل الخروج
========================= */

logoutButton.addEventListener(
    "click",
    function(){

        localStorage.removeItem(
            "jund_student"
        );


        currentStudent =
        null;


        lessonsList.innerHTML =
        "⏳ جاري تحميل حصصك...";


        showLogin();


        studentCode.value =
        "";

        showLoginError("");

    }
);


/* =========================
   عرض بيانات الطالب
========================= */

function displayStudent(){

    if(!currentStudent){

        return;

    }


    studentName.textContent =
    currentStudent.name ||
    "الطالب";


    let info = "";


    if(currentStudent.code){

        info +=
        "🔐 كود الطالب: " +
        safe(
            currentStudent.code
        );

    }


    if(currentStudent.age){

        info +=
        "<br>🎂 العمر: " +
        safe(
            currentStudent.age
        );

    }


    if(currentStudent.teacher){

        info +=
        "<br>👨‍🏫 المدرس: " +
        safe(
            currentStudent.teacher
        );

    }


    studentInfo.innerHTML =
    info;

}


/* =========================
   تحميل حصص الطالب
========================= */

async function loadMyLessons(){

    if(
        !currentStudent ||
        !currentStudent.id
    ){

        showLogin();

        return;

    }


    lessonsList.innerHTML =
    "⏳ جاري تحميل حصصك...";


    try{

        /*
         * مهم جدًا:
         * نطلب فقط الحصص التي تحمل
         * studentId الخاص بهذا الطالب.
         */

        const lessonsQuery =
        query(

            collection(
                db,
                "liveSessions"
            ),

            where(
                "studentId",
                "==",
                currentStudent.id
            )

        );


        const result =
        await getDocs(
            lessonsQuery
        );


        if(result.empty){

            lessonsList.innerHTML = `

                <div class="empty">

                    📭 لا توجد حصص مجدولة لك حاليًا.

                    <br><br>

                    ستظهر حصتك هنا عندما يقوم
                    مدير الأكاديمية بإنشائها.

                </div>

            `;

            return;

        }


        const now =
        new Date();


        const today =
        now.getFullYear() +
        "-" +
        String(
            now.getMonth() + 1
        ).padStart(2,"0") +
        "-" +
        String(
            now.getDate()
        ).padStart(2,"0");


        const currentTime =
        now.getHours()
        .toString()
        .padStart(2,"0")
        +
        ":" +
        now.getMinutes()
        .toString()
        .padStart(2,"0");


        const lessons =
        [];


        result.forEach(
            function(item){

                const data =
                item.data();


                /*
                 * حماية إضافية داخل الصفحة
                 */

                if(
                    data.studentId !==
                    currentStudent.id
                ){

                    return;

                }


                lessons.push({

                    id:
                    item.id,

                    ...data

                });

            }
        );


        if(lessons.length === 0){

            lessonsList.innerHTML = `

                <div class="empty">

                    📭 لا توجد حصص مخصصة لك حاليًا.

                </div>

            `;

            return;

        }


        /*
         * ترتيب الحصص
         */

        lessons.sort(
            function(a,b){

                const aTime =
                String(
                    a.lessonDate || ""
                ) +
                String(
                    a.startTime || ""
                );


                const bTime =
                String(
                    b.lessonDate || ""
                ) +
                String(
                    b.startTime || ""
                );


                return aTime.localeCompare(
                    bTime
                );

            }
        );


        lessonsList.innerHTML =
        "";


        lessons.forEach(
            function(lesson){

                const div =
                document.createElement(
                    "div"
                );


                div.className =
                "lesson";


                const lessonDate =
                String(
                    lesson.lessonDate || ""
                );


                const startTime =
                String(
                    lesson.startTime || ""
                );


                const endTime =
                String(
                    lesson.endTime || ""
                );


                let state =
                "future";


                /*
                 * تحديد حالة الحصة
                 */

                if(
                    lessonDate < today
                ){

                    state =
                    "past";

                }

                else if(
                    lessonDate > today
                ){

                    state =
                    "future";

                }

                else{

                    if(
                        currentTime <
                        startTime
                    ){

                        state =
                        "waiting";

                    }

                    else if(
                        currentTime >=
                        startTime &&
                        currentTime <
                        endTime
                    ){

                        state =
                        "active";

                    }

                    else{

                        state =
                        "past";

                    }

                }


                /*
                 * إذا كانت الحصة ملغاة
                 */

                if(
                    lesson.status ===
                    "cancelled"
                ){

                    state =
                    "cancelled";

                }


                const meetingUrl =
                fixMeetingUrl(
                    lesson.meetingUrl
                );


                let statusHtml =
                "";


                let buttonHtml =
                "";


                /*
                 * الحصة ملغاة
                 */

                if(
                    state ===
                    "cancelled"
                ){

                    statusHtml = `

                        <span
                        class="lesson-status">

                        🔴 الحصة ملغاة

                        </span>

                    `;


                    buttonHtml = `

                        <div
                        class="no-link">

                        🔴 لا يمكن دخول الحصة الملغاة.

                        </div>

                    `;

                }


                /*
                 * الحصة لم تبدأ
                 */

                else if(
                    state === "future" ||
                    state === "waiting"
                ){

                    statusHtml = `

                        <span
                        class="lesson-status">

                        🕐 الحصة لم تبدأ بعد

                        </span>

                    `;


                    buttonHtml = `

                        <div
                        class="no-link">

                        🕐 موعد الحصة:

                        <strong>
                        ${safe(startTime)}
                        </strong>

                        <br>

                        انتظر حتى يبدأ وقت حصتك.

                        </div>

                    `;

                }


                /*
                 * الحصة جارية
                 */

                else if(
                    state === "active"
                ){

                    statusHtml = `

                        <span
                        class="lesson-status">

                        🟢 الحصة جارية الآن

                        </span>

                    `;


                    if(meetingUrl){

                        buttonHtml = `

                            <a
                            class="meeting-button"
                            href="${safe(meetingUrl)}"
                            target="_blank"
                            rel="noopener noreferrer">

                            🎥 دخول الحصة الآن

                            </a>

                        `;

                    }

                    else{

                        buttonHtml = `

                            <div
                            class="no-link">

                            ⚠️ لم يتم إضافة رابط الحصة بعد.

                            </div>

                        `;

                    }

                }


                /*
                 * انتهت الحصة
                 */

                else{

                    statusHtml = `

                        <span
                        class="lesson-status">

                        ✅ انتهت الحصة

                        </span>

                    `;


                    buttonHtml = `

                        <div
                        class="no-link">

                        🕐 انتهى وقت الدخول لهذه الحصة.

                        </div>

                    `;

                }


                div.innerHTML = `

                    <div class="lesson-subject">

                        📚 ${safe(
                            lesson.subject ||
                            "بدون مادة"
                        )}

                    </div>

                    <br>

                    👨‍🏫 المدرس:

                    <strong>

                    ${safe(
                        lesson.teacherName ||
                        currentStudent.teacher ||
                        "-"
                    )}

                    </strong>

                    <br>

                    📅 التاريخ:

                    <strong>

                    ${safe(
                        lesson.lessonDate ||
                        "-"
                    )}

                    </strong>

                    <br>

                    🟢 بداية الحصة:

                    <strong>

                    ${safe(
                        lesson.startTime ||
                        "-"
                    )}

                    </strong>

                    <br>

                    🔴 نهاية الحصة:

                    <strong>

                    ${safe(
                        lesson.endTime ||
                        "-"
                    )}

                    </strong>

                    <br>

                    📊 الحالة:

                    ${statusHtml}

                    ${buttonHtml}

                `;


                lessonsList.appendChild(
                    div
                );

            }
        );


    }catch(error){

        console.error(
            "Load student lessons:",
            error
        );


        lessonsList.innerHTML = `

            <div class="empty">

                ❌ تعذر تحميل حصصك.

                <br><br>

                ${safe(
                    error.message
                )}

            </div>

        `;

    }

}


/* =========================
   إصلاح رابط الحصة
========================= */

function fixMeetingUrl(url){

    url =
    String(
        url || ""
    ).trim();


    if(!url){

        return "";

    }


    if(
        url.startsWith("https://") ||
        url.startsWith("http://")
    ){

        return url;

    }


    return "https://" + url;

}


/* =========================
   رسالة الدخول
========================= */

function showLoginError(
    text
){

    loginMessage.textContent =
    text;


    loginMessage.style.display =
    text
    ?
    "block"
    :
    "none";

}


/* =========================
   إظهار الدخول
========================= */

function showLogin(){

    loginCard.style.display =
    "block";


    dashboard.style.display =
    "none";

}


/* =========================
   إظهار لوحة الطالب
========================= */

function showDashboard(){

    loginCard.style.display =
    "none";


    dashboard.style.display =
    "block";

}


/* =========================
   حماية النص
========================= */

function safe(value){

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}
