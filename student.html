/* =========================================
   Firebase
========================================= */

import {
    db
}
from "./firebase.js";


import {

    collection,
    query,
    where,
    getDocs,
    limit

}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";



/* =========================================
   العناصر
========================================= */

const loginCard =
document.getElementById(
    "loginCard"
);

const studentCard =
document.getElementById(
    "studentCard"
);

const loginForm =
document.getElementById(
    "loginForm"
);

const codeInput =
document.getElementById(
    "codeInput"
);

const loginButton =
document.getElementById(
    "loginButton"
);

const errorBox =
document.getElementById(
    "error"
);

const joinButton =
document.getElementById(
    "joinButton"
);

const logoutButton =
document.getElementById(
    "logoutButton"
);

const statusBox =
document.getElementById(
    "status"
);


let currentStudent = null;

let timer = null;



/* =========================================
   أرقام فقط
========================================= */

codeInput.addEventListener(
    "input",
    function(){

        this.value =
        this.value
        .replace(
            /\D/g,
            ""
        )
        .slice(
            0,
            6
        );

    }
);



/* =========================================
   تسجيل دخول الطالب
========================================= */

loginForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        hideError();


        const code =
        codeInput.value.trim();


        if(!/^\d{6}$/.test(code)){

            showError(
                "⚠️ أدخل الكود المكون من 6 أرقام."
            );

            return;

        }


        loginButton.disabled =
        true;

        loginButton.textContent =
        "⏳ جاري التحقق...";


        try{


            const q =
            query(

                collection(
                    db,
                    "students"
                ),

                where(
                    "code",
                    "==",
                    code
                ),

                limit(1)

            );


            const result =
            await getDocs(q);


            if(result.empty){

                showError(
                    "❌ الكود غير صحيح."
                );

                return;

            }


            const item =
            result.docs[0];


            const student = {

                id:
                item.id,

                ...item.data()

            };


            if(
                student.active === false
            ){

                showError(
                    "⛔ حساب الطالب غير مفعل."
                );

                return;

            }


            currentStudent =
            student;


            showStudent(
                student
            );


        }catch(error){

            console.error(error);


            showError(
                "❌ تعذر الاتصال بقاعدة البيانات."
            );

        }finally{

            loginButton.disabled =
            false;

            loginButton.textContent =
            "دخول";

        }

    }
);



/* =========================================
   عرض الطالب
========================================= */

function showStudent(student){

    loginCard.style.display =
    "none";

    studentCard.style.display =
    "block";


    document
    .getElementById("name")
    .textContent =
    student.name ||
    "غير محدد";


    document
    .getElementById("age")
    .textContent =
    student.age ||
    "غير محدد";


    document
    .getElementById("teacher")
    .textContent =
    student.teacher ||
    "غير محدد";


    document
    .getElementById("level")
    .textContent =
    student.level ||
    "غير محدد";


    document
    .getElementById("lesson")
    .textContent =
    student.lesson ||
    "قراءة وحفظ القرآن الكريم";


    updateDateTime(
        student
    );


    checkLesson(
        student
    );


    clearInterval(
        timer
    );


    timer =
    setInterval(
        function(){

            updateDateTime(
                student
            );

            checkLesson(
                student
            );

        },
        15000
    );

}



/* =========================================
   التاريخ والوقت
========================================= */

function updateDateTime(student){

    let start = null;

    let end = null;


    if(student.startTime){

        start =
        new Date(
            student.startTime
        );

    }


    if(student.endTime){

        end =
        new Date(
            student.endTime
        );

    }


    document
    .getElementById("date")
    .textContent =
    start &&
    !isNaN(start.getTime())
    ?
    formatDate(start)
    :
    "غير محدد";


    document
    .getElementById("start")
    .textContent =
    start &&
    !isNaN(start.getTime())
    ?
    formatTime(start)
    :
    "غير محدد";


    document
    .getElementById("end")
    .textContent =
    end &&
    !isNaN(end.getTime())
    ?
    formatTime(end)
    :
    "بعد 30 دقيقة";

}



/* =========================================
   فحص موعد الحصة
========================================= */

function checkLesson(student){

    joinButton.style.display =
    "none";


    if(!student.startTime){

        statusBox.className =
        "status waiting";

        statusBox.textContent =
        "📅 لم يتم تحديد موعد الحصة بعد.";

        return;

    }


    const start =
    new Date(
        student.startTime
    );


    if(
        isNaN(start.getTime())
    ){

        statusBox.className =
        "status waiting";

        statusBox.textContent =
        "⚠️ موعد الحصة غير صحيح.";

        return;

    }


    let end;


    if(student.endTime){

        end =
        new Date(
            student.endTime
        );

    }


    if(
        !end ||
        isNaN(end.getTime())
    ){

        end =
        new Date(
            start.getTime()
            +
            30 * 60000
        );

    }


    const now =
    new Date();


    /* قبل الحصة */

    if(now < start){

        const minutes =
        Math.ceil(
            (
                start.getTime()
                -
                now.getTime()
            )
            /
            60000
        );


        statusBox.className =
        "status waiting";


        statusBox.innerHTML =
        "⏳ الحصة لم تبدأ بعد."
        +
        "<br>"
        +
        "باقي تقريبًا "
        +
        minutes
        +
        " دقيقة.";

        return;

    }


    /* أثناء الحصة */

    if(
        now >= start &&
        now <= end
    ){

        statusBox.className =
        "status live";


        statusBox.textContent =
        "🟢 الحصة بدأت الآن";


        joinButton.style.display =
        "block";


        joinButton.onclick =
        function(){

            let url =
            student.link ||
            "";


            url =
            url.trim();


            if(!url){

                alert(
                    "⚠️ لم يتم تجهيز رابط الحصة من الإدارة."
                );

                return;

            }


            if(
                !url.startsWith("http://")
                &&
                !url.startsWith("https://")
            ){

                url =
                "https://" + url;

            }


            window.location.href =
            url;

        };


        return;

    }


    /* بعد الحصة */

    statusBox.className =
    "status finished";


    statusBox.innerHTML =
    "✅ انتهت حصة اليوم."
    +
    "<br>"
    +
    "نلتقي في الموعد القادم.";

}



/* =========================================
   التاريخ
========================================= */

function formatDate(date){

    return date.toLocaleDateString(
        "ar-SA",
        {
            year:"numeric",
            month:"long",
            day:"numeric"
        }
    );

}



/* =========================================
   الوقت
========================================= */

function formatTime(date){

    return date.toLocaleTimeString(
        "ar-SA",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}



/* =========================================
   الأخطاء
========================================= */

function showError(text){

    errorBox.textContent =
    text;

    errorBox.style.display =
    "block";

}


function hideError(){

    errorBox.style.display =
    "none";

}



/* =========================================
   تسجيل الخروج
========================================= */

logoutButton.addEventListener(
    "click",
    function(){

        currentStudent =
        null;


        clearInterval(
            timer
        );


        studentCard.style.display =
        "none";


        loginCard.style.display =
        "block";


        codeInput.value =
        "";


        hideError();

    }
);

</script></body></html>
