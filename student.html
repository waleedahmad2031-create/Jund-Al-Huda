<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>الطالب | جنود الهدى</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    background:#f4f7f5;
    color:#222;
}

header{
    background:linear-gradient(135deg,#075e54,#0b806f);
    color:white;
    text-align:center;
    padding:25px 15px;
}

.logo{
    font-size:45px;
}

header h1{
    font-size:27px;
    margin-top:5px;
}

header p{
    margin-top:6px;
    font-size:14px;
}

.container{
    max-width:800px;
    margin:auto;
    padding:20px 14px;
}

.card{
    background:white;
    border-radius:18px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 4px 15px rgba(0,0,0,.07);
}

.login-card{
    max-width:500px;
    margin:30px auto;
}

h2{
    color:#075e54;
    text-align:center;
    margin-bottom:18px;
}

input{
    width:100%;
    padding:15px;
    border:1px solid #ddd;
    border-radius:11px;
    font-size:18px;
    margin-bottom:12px;
    outline:none;
    text-align:center;
}

input:focus{
    border-color:#075e54;
}

button{
    width:100%;
    border:0;
    border-radius:11px;
    padding:14px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
}

.primary{
    background:#075e54;
    color:white;
}

.danger{
    background:#dc3545;
    color:white;
}

.success{
    background:#198754;
    color:white;
}

.message{
    display:none;
    padding:13px;
    border-radius:10px;
    text-align:center;
    margin-bottom:15px;
    line-height:1.8;
}

.error{
    background:#ffe8e8;
    color:#a00000;
}

.good{
    background:#e8f7f2;
    color:#075e54;
}

.dashboard{
    display:none;
}

.student-info{
    background:#f8faf9;
    border-radius:14px;
    padding:18px;
    line-height:2.2;
    margin-bottom:18px;
}

.student-info strong{
    color:#075e54;
}

.online-box{
    background:#eef8f5;
    border:2px solid #c9e5dd;
    border-radius:16px;
    padding:20px;
    text-align:center;
}

.online-title{
    color:#075e54;
    font-size:21px;
    font-weight:bold;
    margin-bottom:15px;
}

.online-status{
    display:inline-block;
    background:#198754;
    color:white;
    padding:8px 18px;
    border-radius:30px;
    font-weight:bold;
    margin-bottom:15px;
}

.lesson-info{
    background:white;
    border-radius:12px;
    padding:15px;
    text-align:right;
    line-height:2.1;
    margin-bottom:15px;
}

.meeting-box{
    display:none;
    margin-top:15px;
}

.meeting-frame{
    width:100%;
    height:500px;
    border:0;
    border-radius:15px;
    background:#111;
}

.note{
    color:#777;
    font-size:13px;
    line-height:1.8;
    margin-top:12px;
}

footer{
    margin-top:25px;
    background:#075e54;
    color:white;
    text-align:center;
    padding:20px;
    font-size:13px;
    line-height:2;
}

@media(max-width:600px){

    .meeting-frame{
        height:400px;
    }

}

</style>

</head>

<body>

<header>

<div class="logo">🕌</div>

<h1>جنود الهدى</h1>

<p>صفحة الطالب</p>

</header>


<div class="container">


<!-- =========================
     تسجيل الدخول
========================= -->

<div id="loginCard"
class="card login-card">

<h2>🎓 دخول الطالب</h2>

<div id="loginMessage"
class="message error">
</div>

<input
id="studentCode"
type="text"
inputmode="numeric"
maxlength="6"
placeholder="أدخل كود الطالب">

<button
id="loginButton"
class="primary">

🎓 دخول

</button>

</div>



<!-- =========================
     لوحة الطالب
========================= -->

<div id="dashboard"
class="dashboard">


<div id="dashboardMessage"
class="message">
</div>


<div class="card">

<h2>
👋 مرحبًا بك في أكاديمية جنود الهدى
</h2>


<div
id="studentInfo"
class="student-info">

⏳ جاري تحميل بيانات الطالب...

</div>


<button
id="logoutButton"
class="danger">

🚪 تسجيل الخروج

</button>

</div>



<!-- =========================
     الحصة
========================= -->

<div class="card">

<h2>
📖 الحصة المباشرة
</h2>


<div class="online-box">


<div class="online-title">

🟢 الحصة داخل موقع جنود الهدى

</div>


<div
id="onlineStatus"
class="online-status">

● غير متصل

</div>


<div
id="lessonInfo"
class="lesson-info">

⏳ جاري تحميل بيانات الحصة...

</div>


<div
id="meetingBox"
class="meeting-box">

<iframe
id="meetingFrame"
class="meeting-frame"
allow="camera; microphone; fullscreen; display-capture"
allowfullscreen>
</iframe>

</div>


<div
id="noMeeting"
class="note">

لم يتم تحديد رابط الحصة من الإدارة حتى الآن.

</div>


</div>

</div>


</div>

</div>


<footer>

جنود الهدى © 2026

<br>

أكاديمية القرآن الكريم

</footer>



<script type="module">


/* =========================
   Firebase
========================= */

import {
    db
} from "./firebase.js";


import {
    collection,
    getDocs,
    query,
    where
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";



/* =========================
   عناصر الصفحة
========================= */

const loginCard =
document.getElementById(
    "loginCard"
);


const dashboard =
document.getElementById(
    "dashboard"
);


const studentCode =
document.getElementById(
    "studentCode"
);


const loginButton =
document.getElementById(
    "loginButton"
);


const loginMessage =
document.getElementById(
    "loginMessage"
);


const dashboardMessage =
document.getElementById(
    "dashboardMessage"
);


const studentInfo =
document.getElementById(
    "studentInfo"
);


const lessonInfo =
document.getElementById(
    "lessonInfo"
);


const meetingBox =
document.getElementById(
    "meetingBox"
);


const meetingFrame =
document.getElementById(
    "meetingFrame"
);


const noMeeting =
document.getElementById(
    "noMeeting"
);


const onlineStatus =
document.getElementById(
    "onlineStatus"
);


const logoutButton =
document.getElementById(
    "logoutButton"
);



/* =========================
   الطالب الحالي
========================= */

let currentStudent =
null;



/* =========================
   تسجيل الدخول
========================= */

loginButton.addEventListener(
    "click",
    async function(){

        const code =
        studentCode.value.trim();


        if(!code){

            showLoginError(
                "⚠️ اكتب كود الطالب."
            );

            return;

        }


        if(!/^\d{6}$/.test(code)){

            showLoginError(
                "⚠️ كود الطالب يجب أن يكون 6 أرقام."
            );

            return;

        }


        loginButton.disabled =
        true;

        loginButton.textContent =
        "⏳ جاري الدخول...";


        try{

            const result =
            await getDocs(
                query(
                    collection(
                        db,
                        "students"
                    ),

                    where(
                        "code",
                        "==",
                        code
                    )
                )
            );


            if(result.empty){

                showLoginError(
                    "❌ كود الطالب غير صحيح."
                );

                return;

            }


            const item =
            result.docs[0];


            const student =
            item.data();


            if(
                student.active === false
            ){

                showLoginError(
                    "🔴 حساب الطالب غير نشط."
                );

                return;

            }


            currentStudent = {

                id:item.id,

                ...student

            };


            localStorage.setItem(
                "jundalhuda_student_code",
                code
            );


            showDashboard();


            displayStudent(
                currentStudent
            );


        }catch(error){

            console.error(
                "Student login error:",
                error
            );


            showLoginError(
                "❌ تعذر الدخول: " +
                error.message
            );

        }finally{

            loginButton.disabled =
            false;

            loginButton.textContent =
            "🎓 دخول";

        }

    }
);



/* =========================
   إظهار لوحة الطالب
========================= */

function showDashboard(){

    loginCard.style.display =
    "none";

    dashboard.style.display =
    "block";

}



/* =========================
   عرض بيانات الطالب
========================= */

function displayStudent(
    student
){

    studentInfo.innerHTML = `

        <strong>
        👤 اسم الطالب:
        </strong>

        ${escapeHTML(
            student.name || "-"
        )}

        <br>

        <strong>
        📱 الهاتف:
        </strong>

        ${escapeHTML(
            student.phone || "-"
        )}

        <br>

        <strong>
        🎂 العمر:
        </strong>

        ${escapeHTML(
            student.age || "-"
        )}

        <br>

        <strong>
        🔐 كود الطالب:
        </strong>

        ${escapeHTML(
            student.code || "-"
        )}

        <br>

        <strong>
        👨‍🏫 المدرس:
        </strong>

        ${escapeHTML(
            student.teacher || "لم يتم تحديد المدرس"
        )}

        <br>

        <strong>
        📚 المستوى:
        </strong>

        ${escapeHTML(
            student.level || "-"
        )}

    `;


    displayLesson(
        student
    );

}



/* =========================
   عرض الحصة
========================= */

function displayLesson(
    student
){

    const date =
    student.lessonDate ||
    "";


    const time =
    student.lessonTime ||
    "";


    const duration =
    student.lessonDuration ||
    30;


    const lesson =
    student.lesson ||
    "لم يتم تحديد الدرس";


    lessonInfo.innerHTML = `

        <strong>
        📖 الدرس:
        </strong>

        ${escapeHTML(lesson)}

        <br>

        <strong>
        👨‍🏫 المدرس:
        </strong>

        ${escapeHTML(
            student.teacher ||
            "لم يتم تحديده"
        )}

        <br>

        <strong>
        📅 التاريخ:
        </strong>

        ${escapeHTML(
            date ||
            "لم يتم تحديده"
        )}

        <br>

        <strong>
        🕐 الوقت:
        </strong>

        ${escapeHTML(
            time ||
            "لم يتم تحديده"
        )}

        <br>

        <strong>
        ⏱️ المدة:
        </strong>

        ${escapeHTML(
            duration
        )}
        دقيقة

    `;


    if(student.meetingUrl){

        meetingBox.style.display =
        "block";

        noMeeting.style.display =
        "none";


        meetingFrame.src =
        student.meetingUrl;


        onlineStatus.textContent =
        "🟢 رابط الحصة جاهز";

    }else{

        meetingBox.style.display =
        "none";

        noMeeting.style.display =
        "block";


        onlineStatus.textContent =
        "🟡 بانتظار إعداد الحصة";

    }

}



/* =========================
   تسجيل الخروج
========================= */

logoutButton.addEventListener(
    "click",
    function(){

        currentStudent =
        null;


        localStorage.removeItem(
            "jundalhuda_student_code"
        );


        dashboard.style.display =
        "none";


        loginCard.style.display =
        "block";


        studentCode.value =
        "";


        showLoginError("");

    }
);



/* =========================
   رسالة الدخول
========================= */

function showLoginError(
    text
){

    loginMessage.textContent =
    text;


    loginMessage.style.display =
    text
    ?
    "block"
    :
    "none";

}



/* =========================
   رسالة لوحة الطالب
========================= */

function showDashboardMessage(
    text,
    success
){

    dashboardMessage.textContent =
    text;


    dashboardMessage.className =
    "message " +
    (
        success
        ?
        "good"
        :
        "error"
    );


    dashboardMessage.style.display =
    "block";

}



/* =========================
   حماية النص
========================= */

function escapeHTML(
    value
){

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}



/* =========================
   الدخول التلقائي
========================= */

async function autoLogin(){

    const savedCode =
    localStorage.getItem(
        "jundalhuda_student_code"
    );


    if(!savedCode){

        return;

    }


    studentCode.value =
    savedCode;


    loginButton.click();

}



/* =========================
   التشغيل
========================= */

console.log(
    "✅ صفحة الطالب تعمل."
);


autoLogin();


</script>

</body>

</html>
