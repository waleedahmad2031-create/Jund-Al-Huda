<!DOCTYPE html>

<head>

content="width=device-width, initial-scale=1.0">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;

}

body{

}

header{

}

.logo{

}

}

.container{
    max-width:700px;
    margin:auto;
    padding:20px 14px;
}

.card,
.section{
    background:white;
    border-radius:18px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 4px 15px rgba(0,0,0,.07);
}

h2{
    color:#075e54;

    text-align:center;
}

.login-card{
    max-width:500px;

}

    margin-bottom:12px;

button{

}

.danger{
    background:#dc3545;
    color:white;
}

.success-button{

    color:white;
}

.message{
    display:none;
    padding:13px;
    border-radius:10px;
    text-align:center;

.error{

.success{

.dashboard{

}

.student-header{

    background:#eef8f5;

.student-name{

    font-weight:bold;

}

.lesson{

    border-radius:14px;

.lesson-subject{

.lesson-status{

    margin-top:5px;
}

.meeting-button{
    display:block;
    text-align:center;
    background:#198754;
    color:white;
    text-decoration:none;
    padding:13px;
    border-radius:11px;
    margin-top:12px;
    font-weight:bold;
}

.no-link{
    text-align:center;
    background:#eee;
    color:#777;
    padding:11px;
    border-radius:10px;
    margin-top:12px;
}

.waiting{
    text-align:center;
    background:#fff8df;
    color:#705b00;
    border:1px solid #ead58a;
    padding:12px;
    border-radius:10px;
    margin-top:12px;
    line-height:1.8;
}

.active-lesson{
    border-right-color:#198754;
}

.empty{
    text-align:center;
    color:#777;
    background:#fafafa;
    padding:25px;
    border-radius:11px;
    line-height:2;
}

.loading{
    text-align:center;
    padding:25px;
    color:#777;
}

.code-note{
    background:#fff8df;
    border:1px solid #ead58a;
    color:#705b00;

    border-radius:10px;

}

.logout{
    margin-top:15px;
}

.refresh-button{
    background:#075e54;
    color:white;
    margin-top:12px;
}

@media(max-width:600px){

    .container{
        padding:15px 10px;
    }

    .card,
    .section{
        padding:16px;
    }

}

</style>

</head>

<body>

<header>

<div class="logo">🕌</div>

<h1>جنود الهدى</h1>

<p>بوابة الطالب</p>

</header>


<div class="container">


<!-- =========================
     تسجيل الدخول
========================= -->

<div
id="loginCard"
class="card login-card">

<h2>🎓 دخول الطالب</h2>

<div class="code-note">

🔐 أدخل كود الطالب المكوّن من 6 أرقام

<br>

الكود الذي أعطاك إياه مدير الأكاديمية

</div>

<div
id="loginMessage"
class="message error">
</div>

<input
id="studentCode"
type="text"
inputmode="numeric"
maxlength="6"
autocomplete="off"
placeholder="أدخل كود الطالب">

<button
id="loginButton"
class="primary">

🎓 دخول الطالب

</button>

</div>


<!-- =========================
     لوحة الطالب
========================= -->

<div
id="dashboard"
class="dashboard">


<div class="card">

<div
class="student-header">

<div
id="studentName"
class="student-name">

الطالب

</div>

<div
id="studentInfo"
class="student-info">

جاري تحميل البيانات...

</div>

</div>


<button
id="refreshButton"
class="refresh-button">

🔄 تحديث الحصص

</button>


<button
id="logoutButton"
class="danger logout">

🚪 تسجيل الخروج

</button>

</div>


<!-- =========================
     الحصص
========================= -->

<div class="section">

<div class="section-title">

📚 حصصي المجدولة

</div>

<div
id="lessonsList"
class="loading">

⏳ جاري تحميل حصصك...

</div>

</div>


</div>

</div>


<footer style="
margin-top:25px;
background:#075e54;
color:white;
text-align:center;
padding:20px;
font-size:13px;
line-height:2;
">

جنود الهدى © 2026

<br>

أكاديمية القرآن الكريم

</footer>


<script type="module">


/* =========================
   Firebase
========================= */

import {
    db
} from "./firebase.js";


import {
    collection,
    getDocs,
    query,
    where
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
   العناصر
========================= */

const loginCard =
document.getElementById(
    "loginCard"
);

const dashboard =
document.getElementById(
    "dashboard"
);

const studentCode =
document.getElementById(
    "studentCode"
);

const loginButton =
document.getElementById(
    "loginButton"
);

const loginMessage =
document.getElementById(
    "loginMessage"
);

const logoutButton =
document.getElementById(
    "logoutButton"
);

const refreshButton =
document.getElementById(
    "refreshButton"
);

const studentName =
document.getElementById(
    "studentName"
);

const studentInfo =
document.getElementById(
    "studentInfo"
);

const lessonsList =
document.getElementById(
    "lessonsList"
);


/* =========================
   الطالب الحالي
========================= */

let currentStudent = null;


/* =========================
   فتح الصفحة
========================= */

window.addEventListener(
    "DOMContentLoaded",
    async function(){

        const savedStudent =
        localStorage.getItem(
            "jund_student"
        );


        if(!savedStudent){

            showLogin();

            return;

        }


        try{

            currentStudent =
            JSON.parse(
                savedStudent
            );


            if(
                !currentStudent.id ||
                !currentStudent.code
            ){

                clearStudent();

                showLogin();

                return;

            }


            /*
            مهم:

            لا نعتمد على البيانات
            القديمة الموجودة في localStorage.

            نعيد التحقق من الطالب
            من Firebase باستخدام ID + code.
            */

            const studentRef =
            query(

                collection(
                    db,
                    "students"
                ),

                where(
                    "code",
                    "==",
                    String(
                        currentStudent.code
                    )
                )

            );


            const result =
            await getDocs(
                studentRef
            );


            if(result.empty){

                clearStudent();

                showLogin();

                showLoginError(
                    "❌ لم يعد الطالب موجودًا."
                );

                return;

            }


            const studentDoc =
            result.docs[0];


            if(
                studentDoc.id !==
                currentStudent.id
            ){

                clearStudent();

                showLogin();

                showLoginError(
                    "❌ بيانات الدخول غير صالحة."
                );

                return;

            }


            const data =
            studentDoc.data();


            if(
                data.active === false
            ){

                clearStudent();

                showLogin();

                showLoginError(
                    "🔴 هذا الطالب غير نشط حاليًا."
                );

                return;

            }


            /*
            تحديث البيانات من Firebase
            */

            currentStudent = {

                id:
                studentDoc.id,

                code:
                data.code || "",

                name:
                data.name || "الطالب",

                phone:
                data.phone || "",

                age:
                data.age || "",

                teacher:
                data.teacher || ""

            };


            saveStudent();


            showDashboard();

            displayStudent();

            await loadMyLessons();


        }catch(error){

            console.error(
                "Startup error:",
                error
            );


            clearStudent();

            showLogin();

        }

    }
);


/* =========================
   دخول الطالب
========================= */

loginButton.addEventListener(
    "click",
    async function(){

        const code =
        studentCode.value.trim();


        if(!code){

            showLoginError(
                "⚠️ أدخل كود الطالب."
            );

            return;

        }


        if(!/^\d{6}$/.test(code)){

            showLoginError(
                "⚠️ كود الطالب يجب أن يكون 6 أرقام."
            );

            return;

        }


        loginButton.disabled =
        true;

        loginButton.textContent =
        "⏳ جاري التحقق...";


        try{

            /* =========================
               البحث بالكود فقط
            ========================= */

            const studentQuery =
            query(

                collection(
                    db,
                    "students"
                ),

                where(
                    "code",
                    "==",
                    code
                )

            );


            const result =
            await getDocs(
                studentQuery
            );


            if(result.empty){

                showLoginError(
                    "❌ كود الطالب غير صحيح."
                );

                return;

            }


            /*
            نأخذ الطالب المطابق
            */

            const studentDoc =
            result.docs[0];


            const data =
            studentDoc.data();


            /*
            التأكد من نشاط الطالب
            */

            if(
                data.active === false
            ){

                showLoginError(
                    "🔴 هذا الطالب غير نشط حاليًا. راجع إدارة الأكاديمية."
                );

                return;

            }


            /*
            إنشاء بيانات الطالب
            */

            currentStudent = {

                id:
                studentDoc.id,

                code:
                data.code || code,

                name:
                data.name || "الطالب",

                phone:
                data.phone || "",

                age:
                data.age || "",

                teacher:
                data.teacher || ""

            };


            /*
            حفظ بيانات الطالب
            */

            saveStudent();


            showLoginError("");

            showDashboard();

            displayStudent();

            await loadMyLessons();


        }catch(error){

            console.error(
                "Student login error:",
                error
            );


            showLoginError(
                "❌ تعذر تسجيل الدخول: " +
                error.message
            );

        }finally{

            loginButton.disabled =
            false;

            loginButton.textContent =
            "🎓 دخول الطالب";

        }

    }
);


/* =========================
   Enter
========================= */

studentCode.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Enter"
        ){

            loginButton.click();

        }

    }
);


/* =========================
   تحديث الحصص
========================= */

refreshButton.addEventListener(
    "click",
    async function(){

        if(!currentStudent){

            return;

        }


        refreshButton.disabled =
        true;

        refreshButton.textContent =
        "⏳ جاري التحديث...";


        try{

            await loadMyLessons();

        }finally{

            refreshButton.disabled =
            false;

            refreshButton.textContent =
            "🔄 تحديث الحصص";

        }

    }
);


/* =========================
   تسجيل الخروج
========================= */

logoutButton.addEventListener(
    "click",
    function(){

        clearStudent();

        lessonsList.innerHTML =
        "⏳ جاري تحميل حصصك...";

        studentCode.value =
        "";

        showLogin();

    }
);


/* =========================
   حفظ الطالب
========================= */

function saveStudent(){

    localStorage.setItem(
        "jund_student",
        JSON.stringify(
            currentStudent
        )
    );

}


/* =========================
   حذف الطالب
========================= */

function clearStudent(){

    localStorage.removeItem(
        "jund_student"
    );

    currentStudent =
    null;

}


/* =========================
   عرض بيانات الطالب
========================= */

function displayStudent(){

    if(!currentStudent){

        return;

    }


    studentName.textContent =
    currentStudent.name ||
    "الطالب";


    let info = "";


    if(currentStudent.code){

        info +=
        "🔐 كود الطالب: " +
        safe(
            currentStudent.code
        );

    }


    if(currentStudent.age){

        info +=
        "<br>🎂 العمر: " +
        safe(
            currentStudent.age
        );

    }


    if(currentStudent.teacher){

        info +=
        "<br>👨‍🏫 المدرس: " +
        safe(
            currentStudent.teacher
        );

    }


    studentInfo.innerHTML =
    info;

}


/* =========================
   تحميل حصص الطالب
========================= */

async function loadMyLessons(){

    if(
        !currentStudent ||
        !currentStudent.id
    ){

        showLogin();

        return;

    }


    lessonsList.innerHTML =
    "⏳ جاري تحميل حصصك...";


    try{

        /*
        مهم جدًا:

        لا نحمل جميع الحصص.

        نطلب فقط الحصص التي تحتوي
        على studentId الخاص بالطالب.
        */

        const lessonsQuery =
        query(

            collection(
                db,
                "liveSessions"
            ),

            where(
                "studentId",
                "==",
                currentStudent.id
            )

        );


        const result =
        await getDocs(
            lessonsQuery
        );


        if(result.empty){

            lessonsList.innerHTML = `

                <div class="empty">

                    📭 لا توجد حصص مجدولة لك حاليًا.

                    <br>

                    ستظهر الحصة هنا عندما يقوم
                    مدير الأكاديمية بإنشائها.

                </div>

            `;

            return;

        }


        /* =========================
           تحويل البيانات
        ========================= */

        const lessons =
        [];


        result.forEach(
            function(item){

                lessons.push({

                    id:
                    item.id,

                    ...item.data()

                });

            }
        );


        /* =========================
           ترتيب الحصص
        ========================= */

        lessons.sort(
            function(a,b){

                const dateA =
                String(
                    a.lessonDate || ""
                ) +
                String(
                    a.startTime || ""
                );


                const dateB =
                String(
                    b.lessonDate || ""
                ) +
                String(
                    b.startTime || ""
                );


                return dateA.localeCompare(
                    dateB
                );

            }
        );


        lessonsList.innerHTML =
        "";


        lessons.forEach(
            function(lesson){

                renderLesson(
                    lesson
                );

            }
        );


    }catch(error){

        console.error(
            "Load student lessons:",
            error
        );


        lessonsList.innerHTML = `

            <div class="empty">

                ❌ تعذر تحميل حصصك.

                <br><br>

                ${safe(
                    error.message
                )}

            </div>

        `;

    }

}


/* =========================
   عرض الحصة
========================= */

function renderLesson(
    lesson
){

    const div =
    document.createElement(
        "div"
    );


    div.className =
    "lesson";


    const status =
    lesson.status ||
    "scheduled";


    let statusText =
    "🟢 مجدولة";


    if(
        status ===
        "cancelled"
    ){

        statusText =
        "🔴 ملغاة";

    }


    if(
        status ===
        "completed"
    ){

        statusText =
        "✅ انتهت";

    }


    const meetingUrl =
    fixMeetingUrl(
        lesson.meetingUrl
    );


    /*
    حساب حالة الوقت
    */

    const timeState =
    getLessonTimeState(
        lesson
    );


    /*
    الحصة الحالية
    */

    if(
        timeState ===
        "active"
    ){

        div.classList.add(
            "active-lesson"
        );

    }


    let actionHtml =
    "";


    if(
        status ===
        "cancelled"
    ){

        actionHtml = `

            <div class="no-link">

                🔴 هذه الحصة ملغاة

            </div>

        `;

    }

    else if(
        status ===
        "completed"
    ){

        actionHtml = `

            <div class="no-link">

                ✅ انتهت هذه الحصة

            </div>

        `;

    }

    else if(
        !meetingUrl
    ){

        actionHtml = `

            <div class="no-link">

                ⚠️ لم يتم إضافة رابط الحصة بعد

            </div>

        `;

    }

    else if(
        timeState ===
        "before"
    ){

        actionHtml = `

            <div class="waiting">

                ⏳ الحصة لم تبدأ بعد

                <br>

                سيفتح الدخول عند:

                <strong>
                ${safe(
                    lesson.startTime ||
                    "-"
                )}
                </strong>

            </div>

        `;

    }

    else if(
        timeState ===
        "after"
    ){

        actionHtml = `

            <div class="no-link">

                ⏰ انتهى وقت الدخول للحصة

            </div>

        `;

    }

    else{

        /*
        داخل وقت الحصة
        */

        actionHtml = `

            <a
                class="meeting-button"
                href="${safe(meetingUrl)}"
                target="_blank"
                rel="noopener noreferrer">

                🎥 دخول الحصة المباشرة

            </a>

        `;

    }


    div.innerHTML = `

        <div class="lesson-subject">

            📚 ${safe(
                lesson.subject ||
                "بدون مادة"
            )}

        </div>

        <br>

        👨‍🏫 المدرس:

        <strong>
        ${safe(
            lesson.teacherName ||
            currentStudent.teacher ||
            "-"
        )}
        </strong>

        <br>

        📅 التاريخ:

        <strong>
        ${safe(
            lesson.lessonDate ||
            "-"
        )}
        </strong>

        <br>

        🟢 وقت الدخول:

        <strong>
        ${safe(
            lesson.startTime ||
            "-"
        )}
        </strong>

        <br>

        🔴 وقت الانتهاء:

        <strong>
        ${safe(
            lesson.endTime ||
            "-"
        )}
        </strong>

        <br>

        📊 الحالة:

        <span class="lesson-status">

        ${statusText}

        </span>

        ${actionHtml}

    `;


    lessonsList.appendChild(
        div
    );

}


/* =========================
   حالة وقت الحصة
========================= */

function getLessonTimeState(
    lesson
){

    /*
    إذا لم يوجد تاريخ أو وقت
    نعتبرها قبل البداية.
    */

    if(
        !lesson.lessonDate ||
        !lesson.startTime ||
        !lesson.endTime
    ){

        return "before";

    }


    /*
    التاريخ والوقت المحلي
    */

    const now =
    new Date();


    const start =
    new Date(
        lesson.lessonDate +
        "T" +
        lesson.startTime
    );


    const end =
    new Date(
        lesson.lessonDate +
        "T" +
        lesson.endTime
    );


    if(
        isNaN(start.getTime()) ||
        isNaN(end.getTime())
    ){

        return "before";

    }


    if(
        now < start
    ){

        return "before";

    }


    if(
        now >= start &&
        now <= end
    ){

        return "active";

    }


    return "after";

}


/* =========================
   إصلاح رابط Meet
========================= */

function fixMeetingUrl(
    url
){

    url =
    String(
        url || ""
    ).trim();


    if(!url){

        return "";

    }


    if(
        url.startsWith(
            "https://"
        ) ||
        url.startsWith(
            "http://"
        )
    ){

        return url;

    }


    return "https://" + url;

}


/* =========================
   رسالة الدخول
========================= */

function showLoginError(
    text
){

    loginMessage.textContent =
    text;


    loginMessage.style.display =
    text
    ?
    "block"
    :
    "none";

}


/* =========================
   إظهار تسجيل الدخول
========================= */

function showLogin(){

    loginCard.style.display =
    "block";


    dashboard.style.display =
    "none";

}


/* =========================
   إظهار لوحة الطالب
========================= */

function showDashboard(){

    loginCard.style.display =
    "none";


    dashboard.style.display =
    "block";

}


/* =========================
   حماية النص
========================= */

function safe(
    value
){

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}
