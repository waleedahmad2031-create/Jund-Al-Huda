/* =========================
   حماية عرض النص
========================= */

function safe(value){

    return String(
        value ?? ""
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   رسائل الإدارة
========================= */

function showLogin(){

    loginCard.style.display =
    "block";

    dashboard.style.display =
    "none";

}


function showDashboard(){

    loginCard.style.display =
    "none";

    dashboard.style.display =
    "block";

}


function showLoginError(message){

    if(!message){

        loginMessage.style.display =
        "none";

        loginMessage.textContent =
        "";

        return;

    }

    loginMessage.textContent =
    message;

    loginMessage.style.display =
    "block";

}


function showStudentMessage(
    message,
    type
){

    studentMessage.textContent =
    message;

    studentMessage.className =
    "message " +
    (
        type === "success"
        ?
        "success"
        :
        "error"
    );

    studentMessage.style.display =
    "block";

}


function showTeacherMessage(
    message,
    type
){

    teacherMessage.textContent =
    message;

    teacherMessage.className =
    "message " +
    (
        type === "success"
        ?
        "success"
        :
        "error"
    );

    teacherMessage.style.display =
    "block";

}


function showLessonMessage(
    message,
    type
){

    lessonMessage.textContent =
    message;

    lessonMessage.className =
    "message " +
    (
        type === "success"
        ?
        "success"
        :
        "error"
    );

    lessonMessage.style.display =
    "block";

}


/* =========================
   رابط Meet
========================= */

function fixMeetingUrl(url){

    url =
    String(url || "").trim();

    if(!url){

        return "";

    }

    if(
        url.startsWith("https://") ||
        url.startsWith("http://")
    ){

        return url;

    }

    return "https://" + url;

}


/* =========================
   توليد كود 6 أرقام
========================= */

function generateCode(){

    return String(
        Math.floor(
            100000 +
            Math.random() * 900000
        )
    );

}


/* =========================
   التأكد أن الكود غير مستخدم
========================= */

async function generateUniqueCode(
    collectionName
){

    for(let i = 0; i < 20; i++){

        const code =
        generateCode();

        const result =
        await getDocs(

            query(

                collection(
                    db,
                    collectionName
                ),

                where(
                    "code",
                    "==",
                    code
                )

            )

        );

        if(result.empty){

            return code;

        }

    }

    throw new Error(
        "تعذر إنشاء كود جديد. حاول مرة أخرى."
    );

}


/* =========================
   حالة الدخول
========================= */

onAuthStateChanged(
    auth,
    async function(user){

        if(!user){

            showLogin();

            return;

        }

        if(
            user.email !==
            ADMIN_EMAIL
        ){

            await signOut(auth);

            showLogin();

            showLoginError(
                "⛔ هذا الحساب ليس حساب الإدارة."
            );

            return;

        }

        showDashboard();

        await loadDashboard();

    }
);


/* =========================
   دخول الإدارة
========================= */

loginButton.addEventListener(
    "click",
    async function(){

        const email =
        emailInput.value.trim();

        const password =
        passwordInput.value;

        if(!email){

            showLoginError(
                "⚠️ اكتب البريد الإلكتروني."
            );

            return;

        }

        if(!password){

            showLoginError(
                "⚠️ اكتب كلمة المرور."
            );

            return;

        }

        loginButton.disabled =
        true;

        loginButton.textContent =
        "⏳ جاري الدخول...";

        try{

            const result =
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

            if(
                result.user.email !==
                ADMIN_EMAIL
            ){

                await signOut(auth);

                showLoginError(
                    "⛔ هذا الحساب ليس حساب الإدارة."
                );

                return;

            }

            showLoginError("");

        }catch(error){

            console.error(error);

            showLoginError(
                "❌ البريد الإلكتروني أو كلمة المرور غير صحيحة."
            );

        }finally{

            loginButton.disabled =
            false;

            loginButton.textContent =
            "🔐 دخول الإدارة";

        }

    }
);


/* =========================
   تسجيل الخروج
========================= */

logoutButton.addEventListener(
    "click",
    async function(){

        await signOut(auth);

    }
);


/* =========================
   تحميل اللوحة
========================= */

async function loadDashboard(){

    try{

        await loadStudents();

    }catch(error){

        console.error(
            "loadStudents:",
            error
        );

    }

    try{

        await loadRequests();

    }catch(error){

        console.error(
            "loadRequests:",
            error
        );

    }

    try{

        await loadTeachers();

    }catch(error){

        console.error(
            "loadTeachers:",
            error
        );

    }

    try{

        await loadLessons();

    }catch(error){

        console.error(
            "loadLessons:",
            error
        );

    }

    fillLessonStudents();

    fillLessonTeachers();

}


/* =========================
   إنشاء مدرس
========================= */

createTeacherButton.addEventListener(
    "click",
    async function(){

        const name =
        newTeacherName.value.trim();

        const phone =
        newTeacherPhone.value.trim();

        if(!name){

            showTeacherMessage(
                "⚠️ اكتب اسم المدرس.",
                "error"
            );

            return;

        }

        createTeacherButton.disabled =
        true;

        createTeacherButton.textContent =
        "⏳ جاري إنشاء المدرس...";

        try{

            const code =
            await generateUniqueCode(
                "teachers"
            );

            await addDoc(
                collection(
                    db,
                    "teachers"
                ),
                {

                    name:
                    name,

                    phone:
                    phone,

                    code:
                    code,

                    active:
                    true,

                    createdAt:
                    serverTimestamp()

                }
            );

            teacherCodeResult.textContent =
            code;

            teacherCodeBox.style.display =
            "block";

            showTeacherMessage(
                "✅ تم إنشاء المدرس بنجاح.",
                "success"
            );

            newTeacherName.value =
            "";

            newTeacherPhone.value =
            "";

            await loadTeachers();

            fillLessonTeachers();

        }catch(error){

            console.error(
                "Create teacher:",
                error
            );

            showTeacherMessage(
                "❌ تعذر إنشاء المدرس: " +
                error.message,

        }finally{

            false;

            createTeacherButton.textContent =
            "➕ إنشاء المدرس وتوليد الكود";

        }

    }
);

async function loadStudents(){

    studentsList.innerHTML =
    "⏳ جاري تحميل الطلاب...";

    try{

        const result =
        await getDocs(
            collection(
                db,
                "students"
            )

createLessonButton.addEventListener(
    "click",
    async function(){

        const studentId =
        lessonStudentSelect.value;

        const teacherId =
        lessonTeacherSelect.value;

        const subject =
        lessonSubject.value.trim();

        const date =
        lessonDate.value;

        const startTime =
        lessonStartTime.value;

        const endTime =
        lessonEndTime.value;

        const meetingUrl =
        fixMeetingUrl(
            lessonMeetingUrl.value
        );

        if(!studentId){

            showLessonMessage(
                "⚠️ اختر الطالب.",
                "error"
            );

            return;

        }

        if(!teacherId){

            showLessonMessage(
                "⚠️ اختر المدرس.",
                "error"
            );

            return;

        }

        if(!subject){

            showLessonMessage(
                "⚠️ اكتب المادة.",
                "error"
            );

            return;

        }

        if(!date){

            showLessonMessage(
                "⚠️ اختر تاريخ الحصة.",
                "error"
            );

            return;

        }

        if(!startTime){

            showLessonMessage(
                "⚠️ اختر وقت بداية الحصة.",
                "error"
            );

            return;

        }

        if(!endTime){

            showLessonMessage(
                "⚠️ اختر وقت انتهاء الحصة.",
                "error"
            );

            return;

        }

        if(startTime >= endTime){

            showLessonMessage(
                "⚠️ وقت النهاية يجب أن يكون بعد وقت البداية.",
                "error"
            );

            return;

        }

        const student =
        studentsCache.find(
            function(item){

                return item.id ===
                studentId;

            }
        );

        const teacher =
        teachersCache.find(
            function(item){

                return item.id ===
                teacherId;

            }
        );

        if(!student){

            showLessonMessage(
                "❌ الطالب غير موجود.",
                "error"
            );

            return;

        }

        if(!teacher){

            showLessonMessage(
                "❌ المدرس غير موجود.",
                "error"
            );

            return;

        }

        createLessonButton.disabled =
        true;

        createLessonButton.textContent =
        "⏳ جاري إنشاء الحصة...";

        try{

            await addDoc(
                collection(
                    db,
                    "liveSessions"
                ),
                {

                    studentId:
                    student.id,

                    studentName:
                    student.name || "",

                    studentPhone:
                    student.phone || "",

                    teacherId:
                    teacher.id,

                    teacherName:
                    teacher.name || "",

                    subject:
                    subject,

                    lessonDate:
                    date,

                    startTime:
                    startTime,

                    endTime:
                    endTime,

                    meetingUrl:
                    meetingUrl,

                    status:
                    "scheduled",

                    createdAt:
                    serverTimestamp()

                }
            );

            showLessonMessage(
                "✅ تم إنشاء الحصة بنجاح.",
                "success"
            );

            lessonStudentSelect.value =
            "";

            lessonTeacherSelect.value =
            "";

            lessonSubject.value =
            "";

            lessonDate.value =
            "";

            lessonStartTime.value =
            "";

            lessonEndTime.value =
            "";

            lessonMeetingUrl.value =
            "";

            await loadLessons();

        }catch(error){

            console.error(
                "Create lesson error:",
                error
            );

            showLessonMessage(
                "❌ تعذر إنشاء الحصة: " +
                error.message,
                "error"
            );

        }finally{

            createLessonButton.disabled =
            false;

            createLessonButton.textContent =
            "➕ إنشاء الحصة";

        }

    }
);

                            );

                        }

                    }
                );

                lessonsList.appendChild(
                    div
                );

            }
        );

    }catch(error){

        console.error(
            "Load lessons error:",
            error
        );

        lessonsList.innerHTML = `

            <div class="empty">

                ❌ تعذر تحميل الحصص.

                <br><br>

                ${safe(error.message)}

            </div>

        `;

    }

}


/* =========================
   تحميل طلبات التسجيل
========================= */

async function loadRequests(){

    requestsList.innerHTML =
    "⏳ جاري تحميل طلبات التسجيل...";

    try{

        const result =
        await getDocs(
            collection(
                db,
                "bookingRequests"
            )
        );

        requestsCount.textContent =
        result.size;

        if(result.empty){

            requestsList.innerHTML = `

                <div class="empty">

                    لا توجد طلبات تسجيل حاليًا.

                </div>

            `;

            return;

        }

        requestsList.innerHTML =
        "";

        result.forEach(
            function(item){

                const request =
                item.data();

                const div =
                document.createElement(
                    "div"
                );

                div.className =
                "item";

                div.innerHTML = `

                    📝 <strong>
                    طلب تسجيل جديد
                    </strong>

                    <br>

                    👤 الاسم:
                    ${safe(
                        request.name ||
                        request.studentName ||
                        "-"
                    )}

                    <br>

                    📱 الهاتف:
                    ${safe(
                        request.phone ||
                        "-"
                    )}

                    <br>

                    🎂 العمر:
                    ${safe(
                        request.age ||
                        "-"
                    )}

                    <br>

                    📚 المادة:
                    ${safe(
                        request.subject ||
                        request.lesson ||
                        "-"
                    )}

                    <br>

                    📌 الحالة:
                    ${safe(
                        request.status ||
                        "جديد"
                    )}

                    <button
                    class="success-button small-button accept-request-button">

                        ✅ قبول الطلب

                    </button>

                    <button
                    class="delete-button small-button delete-request-button">

                        🗑️ حذف الطلب

                    </button>

                `;

                const acceptButton =
                div.querySelector(
                    ".accept-request-button"
                );

                acceptButton.addEventListener(
                    "click",
                    async function(){

                        try{

                            await updateDoc(
                                doc(
                                    db,
                                    "bookingRequests",
                                    item.id
                                ),
                                {
                                    status:
                                    "accepted",

                                    updatedAt:
                                    serverTimestamp()
                                }
                            );

                            alert(
                                "✅ تم قبول طلب التسجيل."
                            );

                            await loadRequests();

                        }catch(error){

                            console.error(
                                "Accept request error:",
                                error
                            );

                            alert(
                                "❌ تعذر قبول الطلب:\n\n" +
                                error.message
                            );

                        }

                    }
                );

                const deleteButton =
                div.querySelector(
                    ".delete-request-button"
                );

                deleteButton.addEventListener(
                    "click",
                    async function(){

                        const confirmed =
                        confirm(
                            "⚠️ هل تريد حذف طلب التسجيل؟"
                        );

                        if(!confirmed){

                            return;

                        }

                        try{

                            await deleteDoc(
                                doc(
                                    db,
                                    "bookingRequests",
                                    item.id
                                )
                            );

                            alert(
                                "✅ تم حذف الطلب."
                            );

                            await loadRequests();

                        }catch(error){

                            console.error(
                                "Delete request error:",
                                error
                            );

                            alert(
                                "❌ تعذر حذف الطلب:\n\n" +
                                error.message
                            );

                        }

                    }
                );

                requestsList.appendChild(
                    div
                );

            }
        );

    }catch(error){

        console.error(
            "Load requests error:",
            error
        );

        requestsList.innerHTML = `

            <div class="empty">

                ❌ تعذر تحميل طلبات التسجيل.

                <br><br>

                ${safe(error.message)}

            </div>

        `;

    }

}


/* =========================
   تنظيف الحصص المنتهية
========================= */

async function deleteFinishedLessons(){

    try{

        const result =
        await getDocs(
            collection(
                db,
                "liveSessions"
            )
        );

        const now =
        new Date();

        for(
            const item of result.docs
        ){

            const lesson =
            item.data();

            const lessonDate =
            String(
                lesson.lessonDate || ""
            ).trim();

            const endTime =
            String(
                lesson.endTime || ""
            ).trim();

            if(
                !lessonDate ||
                !endTime
            ){

                continue;

            }

            const lessonEnd =
            new Date(
                lessonDate +
                "T" +
                endTime
            );

            if(
                !isNaN(
                    lessonEnd.getTime()
                ) &&
                now > lessonEnd
            ){

                await deleteDoc(
                    doc(
                        db,
                        "liveSessions",
                        item.id
                    )
                );

            }

        }

        await loadLessons();

    }catch(error){

        console.error(
            "Delete finished lessons error:",
            error
        );

    }

}
