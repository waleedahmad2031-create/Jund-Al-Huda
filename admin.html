<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>إدارة جنود الهدى</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    background:#f4f7f5;
    color:#222;
}

header{
    background:#0f5132;
    color:white;
    padding:20px 15px;
    text-align:center;
}

.logo{
    font-size:27px;
    font-weight:bold;
}

.subtitle{
    margin-top:6px;
    font-size:13px;
    opacity:.9;
}

.container{
    max-width:950px;
    margin:auto;
    padding:20px 14px;
}

.admin-top{
    background:white;
    border-radius:15px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.admin-top h1{
    color:#0f5132;
    font-size:22px;
    margin-bottom:8px;
}

.admin-top p{
    color:#777;
    font-size:13px;
    line-height:1.8;
}

.tabs{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-bottom:20px;
}

.tab{
    border:0;
    padding:13px 8px;
    border-radius:10px;
    background:white;
    color:#0f5132;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.tab.active{
    background:#198754;
    color:white;
}

.section{
    display:none;
}

.section.active{
    display:block;
}

.card{
    background:white;
    border-radius:15px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.card h2{
    color:#0f5132;
    font-size:20px;
    margin-bottom:18px;
}

.form-group{
    margin-bottom:14px;
}

.form-group label{
    display:block;
    color:#0f5132;
    font-size:13px;
    font-weight:bold;
    margin-bottom:7px;
}

.form-group input,
.form-group select,
.form-group textarea{
    width:100%;
    border:1px solid #ddd;
    border-radius:9px;
    padding:12px;
    font-size:14px;
    outline:none;
    background:#fafafa;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
    border-color:#198754;
    background:white;
}

.form-group textarea{
    min-height:80px;
    resize:vertical;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.code-box{
    background:#f4f0e4;
    border:2px dashed #c7a85b;
    border-radius:12px;
    padding:15px;
    text-align:center;
    margin-bottom:15px;
}

.code-box span{
    display:block;
    color:#705719;
    font-size:12px;
    margin-bottom:6px;
}

.code{
    font-size:28px;
    font-weight:bold;
    letter-spacing:5px;
    color:#0f5132;
    direction:ltr;
}

.button{
    width:100%;
    border:0;
    border-radius:9px;
    padding:13px;
    cursor:pointer;
    font-size:14px;
    font-weight:bold;
}

.save{
    background:#198754;
    color:white;
}

.cancel{
    background:#eee;
    color:#555;
    margin-top:8px;
}

.students{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.student{
    background:#fff;
    border-radius:13px;
    padding:17px;
    border-right:5px solid #198754;
    box-shadow:0 2px 9px rgba(0,0,0,.06);
}

.student.disabled{
    border-right-color:#aaa;
    opacity:.75;
}

.student-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:12px;
}

.student-name{
    color:#0f5132;
    font-weight:bold;
    font-size:17px;
}

.badge{
    padding:5px 9px;
    border-radius:20px;
    font-size:11px;
}

.active-badge{
    background:#e9f5ee;
    color:#0f5132;
}

.disabled-badge{
    background:#eee;
    color:#777;
}

.student-info{
    color:#666;
    font-size:12px;
    line-height:2;
}

.student-code{
    color:#0f5132;
    font-weight:bold;
    letter-spacing:2px;
}

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:13px;
}

.action{
    border:0;
    border-radius:8px;
    padding:10px 5px;
    cursor:pointer;
    font-size:12px;
}

.edit{
    background:#e9f5ee;
    color:#0f5132;
}

.disable{
    background:#fff3cd;
    color:#765b00;
}

.delete{
    background:#ffe5e5;
    color:#a00000;
}

.requests{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.request{
    background:white;
    border-radius:13px;
    padding:16px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
    border-right:4px solid #d4a72c;
}

.request h3{
    color:#0f5132;
    margin-bottom:10px;
}

.request p{
    color:#666;
    font-size:12px;
    line-height:2;
}

.empty{
    text-align:center;
    color:#777;
    background:#fafafa;
    padding:25px;
    border-radius:10px;
}

.message{
    display:none;
    padding:14px;
    border-radius:10px;
    margin-bottom:15px;
    text-align:center;
    line-height:1.8;
}

.success-message{
    background:#e9f5ee;
    color:#0f5132;
}

.error-message{
    background:#fff0f0;
    color:#a00000;
}

footer{
    margin-top:30px;
    background:#0f5132;
    color:white;
    text-align:center;
    padding:20px;
    font-size:13px;
}

@media(max-width:500px){

    .form-grid{
        grid-template-columns:1fr;
    }

    .tabs{
        grid-template-columns:1fr 1fr;
    }

    .actions{
        grid-template-columns:1fr 1fr;
    }

}

</style>

</head>

<body>

<header>

<div class="logo">
🕌 جنود الهدى
</div>

<div class="subtitle">

</header>

<div class="container">

</h1>

<p>

<div

<!-- =========================

========================= -->

<div
id="studentsSection"

</div>


<div class="card">

👨‍🎓 الطلاب المسجلون
</h2>

</div>

</div>

     الطلبات
========================= -->

<div
id="requestsSection"
class="section">

<div class="card">

<h2>
📩 طلبات التسجيل
</h2>

<div
id="requests"

</div>

<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    doc,
    updateDoc,
    deleteDoc
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


import {
    getAuth,
    onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const firebaseConfig = {

    apiKey:
    "AIzaSyBCnQWX_kKckwncvS9rnfi5YHsDbCWhtoU",

    authDomain:
    "jundalhuda.firebaseapp.com",

    projectId:
    "jundalhuda",

    storageBucket:
    "jundalhuda.firebasestorage.app",

    messagingSenderId:
    "275883570506",

    appId:
    "1:275883570506:web:fb5e72953a3d5a66ef3db3",

    measurementId:
    "G-ZZNZKN73BQ"

};


const app =
initializeApp(firebaseConfig);


const db =
getFirestore(app);


const auth =
getAuth(app);


let editId = null;


/* =========================
   التحقق من تسجيل الدخول
========================= */

onAuthStateChanged(auth, function(user){

    if(!user){

        window.location.href =
            "login.html";

        return;

    }

    console.log(
        "تم تسجيل دخول الإدارة:",
        user.email
    );


    loadStudents();

    loadRequests();

});


/* =========================
   تغيير الأقسام
========================= */

window.showSection =
function(id,button){

    document
    .querySelectorAll(".section")
    .forEach(function(section){

        section.classList.remove("active");

    });


    document
    .querySelectorAll(".tab")
    .forEach(function(tab){

        tab.classList.remove("active");

    });


    document
    .getElementById(id)
    .classList.add("active");


    button.classList.add("active");

};


/* =========================
   إنشاء كود رقمي
========================= */

async function generateCode(){

    let code = "";


    for(let i=0;i<6;i++){

        code +=
        Math.floor(
            Math.random()*10
        );

    }


    const result =
    await getDocs(
        collection(
            db,
            "students"
        )
    );


    let exists = true;


    while(exists){

        exists = false;


        result.forEach(function(item){

            if(
                item.data().code === code
            ){

                exists = true;

            }

        });


        if(exists){

            code = "";


            for(let i=0;i<6;i++){

                code +=
                Math.floor(
                    Math.random()*10
                );

            }

        }

    }


    return code;

}


/* =========================
   حفظ الطالب
========================= */

window.saveStudent =
async function(){

    console.log("تم الضغط على حفظ الطالب");


    const name =
    document
    .getElementById("studentName")
    .value
    .trim();


    const age =
    document
    .getElementById("studentAge")
    .value;


    const phone =
    document
    .getElementById("studentPhone")
    .value
    .trim();


    const level =
    document
    .getElementById("studentLevel")
    .value;


    const teacher =
    document
    .getElementById("studentTeacher")
    .value
    .trim();


    const lesson =
    document
    .getElementById("studentLesson")
    .value
    .trim();


    const date =
    document
    .getElementById("studentDate")
    .value;


    const start =
    document
    .getElementById("studentStart")
    .value;


    const end =
    document
    .getElementById("studentEnd")
    .value;


    const link =
    document
    .getElementById("studentLink")
    .value
    .trim();


    if(!name){

        showMessage(
            "⚠️ اكتب اسم الطالب.",
            false
        );

        return;

    }


    if(!phone){

        showMessage(
            "⚠️ اكتب رقم التواصل.",
            false
        );

        return;

    }


    if(!date){

        showMessage(
            "⚠️ اختر تاريخ الحصة.",
            false
        );

        return;

    }


    if(!start){

        showMessage(
            "⚠️ اختر وقت بداية الحصة.",
            false
        );

        return;

    }


    if(!link){

        showMessage(
            "⚠️ ضع رابط الحصة.",
            false
        );

        return;

    }


    const startTime =
    new Date(
        date + "T" + start
    );


    let endTime = null;


    if(end){

        endTime =
        new Date(
            date + "T" + end
        );

    }


    try{

        if(editId){

            await updateDoc(

                doc(
                    db,
                    "students",
                    editId
                ),

                {

                    name:name,

                    age:age,

                    phone:phone,

                    level:level,

                    teacher:teacher,

                    lesson:
                    lesson ||
                    "قراءة وحفظ القرآن الكريم",

                    startTime:
                    startTime.toISOString(),

                    endTime:
                    endTime
                    ?
                    endTime.toISOString()
                    :
                    "",

                    link:link

                }

            );


            showMessage(
                "✅ تم تعديل بيانات الطالب.",
                true
            );


        }else{

            const code =
            await generateCode();


            await addDoc(

                collection(
                    db,
                    "students"
                ),

                {

                    code:code,

                    name:name,

                    age:age,

                    phone:phone,

                    level:level,

                    teacher:teacher,

                    lesson:
                    lesson ||
                    "قراءة وحفظ القرآن الكريم",

                    startTime:
                    startTime.toISOString(),

                    endTime:
                    endTime
                    ?
                    endTime.toISOString()
                    :
                    "",

                    link:link,

                    active:true,

                    createdAt:
                    new Date().toISOString()

                }

            );


            showMessage(
                "✅ تم إضافة الطالب بنجاح.",
                true
            );

        }


        clearForm();

        loadStudents();


    }catch(error){

        console.error(
            "خطأ حفظ الطالب:",
            error
        );


        showMessage(
            "❌ حدث خطأ أثناء الحفظ. تأكد من تسجيل الدخول وقواعد Firestore.",
            false
        );

    }

};


/* =========================
   زر حفظ الطالب
========================= */

document
.getElementById("saveStudentButton")
.addEventListener(
    "click",
    function(){

        window.saveStudent();

    }
);


/* =========================
   تحميل الطلاب
========================= */

async function loadStudents(){

    const container =
    document.getElementById(
        "students"
    );


    container.innerHTML = `
        <div class="empty">
        ⏳ جاري تحميل الطلاب...
        </div>
    `;


    try{

        const result =
        await getDocs(
            collection(
                db,
                "students"
            )
        );


        if(result.empty){

            container.innerHTML = `
                <div class="empty">
                لا يوجد طلاب حتى الآن.
                </div>
            `;

            return;

        }


        container.innerHTML = "";


        result.forEach(function(item){

            const data =
            item.data();


            const div =
            document.createElement("div");


            div.className =
            "student";


            if(data.active === false){

                div.classList.add(
                    "disabled"
                );

            }


            let timeText = "-";


            if(data.startTime){

                const d =
                new Date(
                    data.startTime
                );


                if(!isNaN(d.getTime())){

                    timeText =
                    d.toLocaleString(
                        "ar-SA"
                    );

                }

            }


            const active =
            data.active !== false;


            div.innerHTML = `

                <div class="student-head">

                    <div class="student-name">

                        👤 ${escapeHTML(
                            data.name ||
                            "بدون اسم"
                        )}

                    </div>

                    <span class="badge ${
                        active
                        ?
                        "active-badge"
                        :
                        "disabled-badge"
                    }">

                        ${
                            active
                            ?
                            "🟢 مفعل"
                            :
                            "⚪ متوقف"
                        }

                    </span>

                </div>


                <div class="student-info">

                    🔢 الكود:

                    <span class="student-code">

                        ${escapeHTML(
                            data.code || "-"
                        )}

                    </span>

                    <br>

                    🎂 العمر:
                    ${escapeHTML(
                        data.age || "-"
                    )}

                    <br>

                    📱 التواصل:
                    ${escapeHTML(
                        data.phone || "-"
                    )}

                    <br>

                    👨‍🏫 المدرس:
                    ${escapeHTML(
                        data.teacher || "-"
                    )}

                    <br>

                    📖 المستوى:
                    ${escapeHTML(
                        data.level || "-"
                    )}

                    <br>

                    🕐 الموعد:
                    ${escapeHTML(
                        timeText
                    )}

                </div>


                <div class="actions">

                    <button
                    type="button"
                    class="action edit"
                    onclick="editStudent('${item.id}')">

                        ✏️ تعديل

                    </button>


                    <button
                    type="button"
                    class="action disable"
                    onclick="toggleStudent('${item.id}',${active})">

                        ${
                            active
                            ?
                            "⏸️ تعطيل"
                            :
                            "▶️ تفعيل"
                        }

                    </button>


                    <button
                    type="button"
                    class="action delete"
                    onclick="deleteStudent('${item.id}')">

                        🗑️ حذف

                    </button>

                </div>

            `;


            container.appendChild(div);

        });


    }catch(error){

        console.error(
            "خطأ تحميل الطلاب:",
            error
        );


        container.innerHTML = `
            <div class="empty">
            ❌ تعذر تحميل الطلاب.
            </div>
        `;

    }

}


/* =========================
   تعديل الطالب
========================= */

window.editStudent =
async function(id){

    try{

        const result =
        await getDocs(
            collection(
                db,
                "students"
            )
        );


        let data = null;


        result.forEach(function(item){

            if(item.id === id){

                data =
                item.data();

            }

        });


        if(!data){

            return;

        }


        editId = id;


        document.getElementById(
            "formTitle"
        ).textContent =
        "✏️ تعديل بيانات الطالب";


        document.getElementById(
            "newCode"
        ).textContent =
        data.code || "------";


        document.getElementById(
            "studentName"
        ).value =
        data.name || "";


        document.getElementById(
            "studentAge"
        ).value =
        data.age || "";


        document.getElementById(
            "studentPhone"
        ).value =
        data.phone || "";


        document.getElementById(
            "studentLevel"
        ).value =
        data.level || "";


        document.getElementById(
            "studentTeacher"
        ).value =
        data.teacher || "";


        document.getElementById(
            "studentLesson"
        ).value =
        data.lesson ||
        "قراءة وحفظ القرآن الكريم";


        if(data.startTime){

            const start =
            new Date(
                data.startTime
            );


            document.getElementById(
                "studentDate"
            ).value =
            formatDate(start);


            document.getElementById(
                "studentStart"
            ).value =
            formatTime(start);

        }


        if(data.endTime){

            const end =
            new Date(
                data.endTime
            );


            document.getElementById(
                "studentEnd"
            ).value =
            formatTime(end);

        }else{

            document.getElementById(
                "studentEnd"
            ).value =
            "";

        }


        document.getElementById(
            "studentLink"
        ).value =
        data.link || "";


        document.getElementById(
            "cancelEdit"
        ).style.display =
        "block";


        window.scrollTo({

            top:0,

            behavior:"smooth"

        });


    }catch(error){

        console.error(error);


        showMessage(
            "❌ تعذر تحميل بيانات الطالب.",
            false
        );

    }

};


/* =========================
   تعطيل / تفعيل
========================= */

window.toggleStudent =
async function(id,active){

    try{

        await updateDoc(

            doc(
                db,
                "students",
                id
            ),

            {

                active:
                !active

            }

        );


        showMessage(
            active
            ?
            "⏸️ تم تعطيل الطالب."
            :
            "▶️ تم تفعيل الطالب.",
            true
        );


        loadStudents();


    }catch(error){

        console.error(error);


        showMessage(
            "❌ تعذر تعديل حالة الطالب.",
            false
        );

    }

};

window.deleteStudent =
async function(id){

                db,
                "students",
                id

            "🗑️ تم حذف الطالب.",

        loadStudents();


    }catch(error){

        console.error(error);


        showMessage(
            "❌ تعذر حذف الطالب.",
            false
        );

    }

};

/* =========================
   الطلبات
========================= */

async function loadRequests(){

    const container =
    document.getElementById(
        "requests"
    );


    container.innerHTML = `
        <div class="empty">
        ⏳ جاري تحميل الطلبات...
        </div>
    `;


    try{

        const result =
        await getDocs(
            collection(
                db,
                "bookingRequests"
            )
        );


        if(result.empty){

            container.innerHTML = `
                <div class="empty">
                لا توجد طلبات حاليًا.
                </div>
            `;

            return;

        }


        container.innerHTML = "";


        result.forEach(function(item){

            const data =
            item.data();


            const div =
            document.createElement("div");


            div.className =
            "request";


            div.innerHTML = `

                <h3>
                    📩 ${
                        escapeHTML(
                            data.type ||
                            "طلب تسجيل"
                        )
                    }
                </h3>

                <p>

                    👤 الطالب:
                    ${escapeHTML(
                        data.studentName ||
                        "-"
                    )}

                    <br>

                    🎂 العمر:
                    ${escapeHTML(
                        data.age ||
                        "-"
                    )}

                    <br>

                    📖 المستوى:
                    ${escapeHTML(
                        data.level ||
                        "-"
                    )}

                    <br>

                    📱 التواصل:
                    ${escapeHTML(
                        data.phone ||
                        "-"
                    )}

                    <br>

                    🕐 الوقت المناسب:
                    ${escapeHTML(
                        data.preferredTime ||
                        "-"
                    )}

                    <br>

                    👨‍👩‍👧‍👦 إخوة:
                    ${escapeHTML(
                        data.brothers ||
                        "-"
                    )}

                    <br>

                    📝 الملاحظات:
                    ${escapeHTML(
                        data.notes ||
                        "لا توجد"
                    )}

                </p>

            `;


            container.appendChild(div);

        });


    }catch(error){

        console.error(
            "خطأ تحميل الطلبات:",
            error
        );


        container.innerHTML = `
            <div class="empty">
            ❌ تعذر تحميل الطلبات.
            </div>
        `;

    }

}


/* =========================
   الرسائل
========================= */

function showMessage(text,success){

    const message =
    document.getElementById(
        "message"
    );


    message.textContent =
    text;


    message.className =
    "message " +
    (
        success
        ?
        "success-message"
        :
        "error-message"
    );


    message.style.display =
    "block";


    setTimeout(
        function(){

            message.style.display =
            "none";

        },
        4000
    );

}


/* =========================
   التاريخ
========================= */

function formatDate(date){

    const year =
    date.getFullYear();


    const month =
    String(
        date.getMonth()+1
    ).padStart(2,"0");


    const day =
    String(
        date.getDate()
    ).padStart(2,"0");


    return (
        year +
        "-" +
        month +
        "-" +
        day
    );

}


/* =========================
   الوقت
========================= */

function formatTime(date){

    return String(
        date.getHours()
    ).padStart(2,"0")
    +
    ":"
    +
    String(
        date.getMinutes()
    ).padStart(2,"0");

}


/* =========================
   حماية عرض النص
========================= */

function escapeHTML(value){

    return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}
