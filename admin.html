<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الإدارة | جنود الهدى</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    background:#f4f7f5;
    color:#222;
}

header{
    background:linear-gradient(135deg,#075e54,#0b806f);
    color:white;
    text-align:center;
    padding:25px 15px;
}

.logo{font-size:45px;}

header h1{
    font-size:27px;
    margin-top:5px;
}

header p{
    margin-top:6px;
    font-size:14px;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px 14px;
}

.card{
    background:white;
    border-radius:18px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 4px 15px rgba(0,0,0,.07);
}

h2{
    color:#075e54;
    margin-bottom:18px;
    text-align:center;
}

.login-card{
    max-width:500px;
    margin:30px auto;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:11px;
    font-size:16px;
    margin-bottom:12px;
    outline:none;
}

input:focus{
    border-color:#075e54;
}

button{
    width:100%;
    border:0;
    border-radius:11px;
    padding:14px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.primary{
    background:#075e54;
    color:white;
}

.secondary{
    background:#0b806f;
    color:white;
}

.success-button{
    background:#198754;
    color:white;
}

.warning{
    background:#c9a227;
    color:white;
}

.whatsapp{
    background:#25D366;
    color:white;
}

.danger{
    background:#dc3545;
    color:white;
}

.logout{
    margin-top:10px;
}

.message{
    display:none;
    padding:13px;
    border-radius:10px;
    text-align:center;
    margin-bottom:15px;
    line-height:1.8;
}

.error{
    background:#ffe8e8;
    color:#a00000;
}

.success{
    background:#e8f7f2;
    color:#075e54;
}

.dashboard{
    display:none;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-bottom:18px;
}

.stat{
    background:#f8faf9;
    border-radius:14px;
    padding:18px 10px;
    text-align:center;
}

.stat-number{
    display:block;
    color:#075e54;
    font-size:28px;
    font-weight:bold;
    margin-bottom:7px;
}

.stat-title{
    color:#666;
    font-size:13px;
}

.section-title{
    color:#075e54;
    font-size:19px;
    margin-bottom:15px;
}

.item{
    background:#fafcfa;
    border-radius:12px;
    padding:15px;
    margin-bottom:10px;
    border-right:4px solid #0b806f;
    line-height:2;
}

.item strong{
    color:#075e54;
}

.empty{
    text-align:center;
    color:#777;
    background:#fafafa;
    padding:25px;
    border-radius:11px;
}

.loading{
    text-align:center;
    padding:25px;
    color:#777;
}

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:12px;
}

.code-box{
    margin-top:12px;
    padding:15px;
    background:#fff8df;
    border:2px dashed #c9a227;
    border-radius:12px;
    text-align:center;
}

.code-number{
    display:block;
    font-size:28px;
    font-weight:bold;
    color:#075e54;
    letter-spacing:4px;
    margin-top:5px;
}

.status-approved{
    color:#198754;
    font-weight:bold;
}

.status-pending{
    color:#c58a00;
    font-weight:bold;
}

footer{
    margin-top:25px;
    background:#075e54;
    color:white;
    text-align:center;
    padding:20px;
    font-size:13px;
    line-height:2;
}

@media(max-width:600px){
    .stats{
        grid-template-columns:1fr;
    }

    .actions{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">🕌</div>
    <h1>جنود الهدى</h1>
    <p>لوحة الإدارة</p>
</header>

<div class="container">

<div id="loginCard" class="card login-card">

    <h2>🔐 دخول الإدارة</h2>

    <div id="loginMessage" class="message error"></div>

    <input
        id="email"
        type="email"
        placeholder="البريد الإلكتروني"
        autocomplete="email">

    <input
        id="password"
        type="password"
        placeholder="كلمة المرور"
        autocomplete="current-password">

    <button id="loginButton" class="primary">
        دخول الإدارة
    </button>

</div>


<div id="dashboard" class="dashboard">

<div id="dashboardMessage" class="message"></div>

<div class="card">

    <h2>👨‍💼 لوحة الإدارة</h2>

    <p style="text-align:center;color:#666;line-height:2">
        مرحبًا بك في إدارة أكاديمية جنود الهدى
    </p>

    <button id="logoutButton" class="danger logout">
        🚪 تسجيل الخروج
    </button>

</div>


<div class="stats">

    <div class="stat">
        <span id="studentsCount" class="stat-number">0</span>
        <span class="stat-title">الطلاب</span>
    </div>

    <div class="stat">
        <span id="requestsCount" class="stat-number">0</span>
        <span class="stat-title">طلبات التسجيل</span>
    </div>

    <div class="stat">
        <span id="activeCount" class="stat-number">0</span>
        <span class="stat-title">الطلاب النشطون</span>
    </div>

</div>


<div class="card">

    <div class="section-title">
        🎓 الطلاب
    </div>

    <div id="studentsList" class="loading">
        ⏳ جاري تحميل الطلاب...
    </div>

</div>


<div class="card">

    <div class="section-title">
        📝 طلبات التسجيل
    </div>

    <div id="requestsList" class="loading">
        ⏳ جاري تحميل الطلبات...
    </div>

</div>

</div>
</div>

<footer>
    جنود الهدى © 2026
    <br>
    أكاديمية القرآن الكريم
</footer>


<script type="module">

import {
    db,
    auth
}
from "./firebase.js";


import {
    collection,
    getDocs,
    deleteDoc,
    doc,
    addDoc,
    updateDoc,
    query,
    where,
    serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


import {
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


const ADMIN_EMAIL =
"yuo123@gmail.com";


const loginCard =
document.getElementById("loginCard");

const dashboard =
document.getElementById("dashboard");

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const loginButton =
document.getElementById("loginButton");

const loginMessage =
document.getElementById("loginMessage");

const dashboardMessage =
document.getElementById("dashboardMessage");

const logoutButton =
document.getElementById("logoutButton");

const studentsList =
document.getElementById("studentsList");

const requestsList =
document.getElementById("requestsList");

const studentsCount =
document.getElementById("studentsCount");

const requestsCount =
document.getElementById("requestsCount");

const activeCount =
document.getElementById("activeCount");


onAuthStateChanged(
    auth,
    function(user){

        if(!user){
            showLogin();
            return;
        }

        if(user.email !== ADMIN_EMAIL){

            signOut(auth);

            showLoginError(
                "⛔ هذا الحساب ليس حساب الإدارة."
            );

            return;
        }

        showDashboard();
        loadDashboard();
    }
);


loginButton.addEventListener(
    "click",
    async function(){

        const email =
        emailInput.value.trim();

        const password =
        passwordInput.value;

        if(!email){

            showLoginError(
                "⚠️ اكتب البريد الإلكتروني."
            );

            return;
        }

        if(!password){

            showLoginError(
                "⚠️ اكتب كلمة المرور."
            );

            return;
        }

        loginButton.disabled = true;
        loginButton.textContent =
        "⏳ جاري الدخول...";

        try{

            const result =
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

            if(result.user.email !== ADMIN_EMAIL){

                await signOut(auth);

                showLoginError(
                    "⛔ هذا الحساب ليس حساب الإدارة."
                );
            }

        }catch(error){

            console.error(error);

            showLoginError(
                "❌ البريد الإلكتروني أو كلمة المرور غير صحيحة."
            );
        }

        loginButton.disabled = false;

        loginButton.textContent =
        "دخول الإدارة";

    }
);


async function loadDashboard(){

    await loadStudents();

    await loadRequests();

}


async function loadStudents(){

    studentsList.innerHTML = `
        <div class="loading">
            ⏳ جاري تحميل الطلاب...
        </div>
    `;

    try{

        const result =
        await getDocs(
            collection(
                db,
                "students"
            )
        );

        studentsCount.textContent =
        result.size;

        let active = 0;

        if(result.empty){

            studentsList.innerHTML = `
                <div class="empty">
                    لا يوجد طلاب حاليًا.
                </div>
            `;

            activeCount.textContent = "0";

            return;
        }

        studentsList.innerHTML = "";

        result.forEach(
            function(item){

                const student =
                item.data();

                if(student.active !== false){
                    active++;
                }

                const div =
                document.createElement("div");

                div.className = "item";

                div.innerHTML = `

                    <strong>
                        👤 ${escapeHTML(
                            student.name ||
                            "بدون اسم"
                        )}
                    </strong>

                    <br>

                    📱 الهاتف:
                    ${escapeHTML(
                        student.phone ||
                        "-"
                    )}

                    <br>

                    🔐 الكود:
                    <strong>
                    ${escapeHTML(
                        student.code ||
                        "-"
                    )}
                    </strong>

                    <br>

                    🎂 العمر:
                    ${escapeHTML(
                        student.age ||
                        "-"
                    )}

                    <br>

                    👨‍🏫 المدرس:
                    ${escapeHTML(
                        student.teacher ||
                        "-"
                    )}

                    <br>

                    📖 المستوى:
                    ${escapeHTML(
                        student.level ||
                        "-"
                    )}

                    <br>

                    📚 الدرس:
                    ${escapeHTML(
                        student.lesson ||
                        "-"
                    )}

                    <br>

                    الحالة:
                    ${
                        student.active === false
                        ?
                        "🔴 غير نشط"
                        :
                        "🟢 نشط"
                    }

                    <div class="actions">

                        <button
                            class="secondary"
                            data-id="${item.id}"
                            data-action="copy">

                            📋 نسخ الكود

                        </button>

                        <button
                            class="whatsapp"
                            data-id="${item.id}"
                            data-action="whatsapp">

                            📱 إرسال الكود واتساب

                        </button>

                        <button
                            class="danger"
                            data-id="${item.id}"
                            data-action="delete">

                            🗑️ حذف الطالب

                        </button>

                    </div>
                `;

                studentsList.appendChild(div);

            }
        );


        activeCount.textContent = active;


        studentsList
        .querySelectorAll("button")
        .forEach(
            function(button){

                button.addEventListener(
                    "click",
                    function(){

                        const id =
                        this.dataset.id;

                        const action =
                        this.dataset.action;

                        if(action === "copy"){

                            copyStudentCode(
                                id,
                                result
                            );

                        }

                        if(action === "whatsapp"){

                            sendStudentCodeWhatsApp(
                                id,
                                result
                            );

                        }

                        if(action === "delete"){

                            deleteStudent(id);

                        }

                    }
                );

            }
        );


    }catch(error){

        console.error(error);

        studentsList.innerHTML = `

            <div class="empty">

                ❌ تعذر تحميل الطلاب.

                <br><br>

                ${escapeHTML(
                    error.message ||
                    ""
                )}

            </div>
        `;
    }
}


async function copyStudentCode(
    id,
    result
){

    const item =
    result.docs.find(
        function(docItem){
            return docItem.id === id;
        }
    );

    if(!item){
        return;
    }

    const student =
    item.data();

    if(!student.code){

        showDashboardMessage(
            "⚠️ لا يوجد كود لهذا الطالب.",
            false
        );

        return;
    }

    await copyText(
        student.code
    );
}


/* =========================================
   إرسال الكود عبر واتساب
========================================= */

function sendStudentCodeWhatsApp(
    id,
    result
){

    const item =
    result.docs.find(
        function(docItem){
            return docItem.id === id;
        }
    );

    if(!item){
        return;
    }

    const student =
    item.data();

    const phone =
    String(
        student.phone || ""
    ).replace(
        /\D/g,
        ""
    );

    const code =
    String(
        student.code || ""
    );

    if(!phone){

        showDashboardMessage(
            "⚠️ لا يوجد رقم جوال لهذا الطالب.",
            false
        );

        return;
    }

    if(!code){

        showDashboardMessage(
            "⚠️ لا يوجد كود لهذا الطالب.",
            false
        );

        return;
    }

    let whatsappPhone =
    phone;

    /*
       تحويل الرقم السعودي
       05xxxxxxxx
       إلى
       9665xxxxxxxx
    */

    if(
        whatsappPhone.startsWith("05")
    ){

        whatsappPhone =
        "966" +
        whatsappPhone.substring(1);

    }

    /*
       إذا كان مكتوبًا:
       5xxxxxxxx
    */

    else if(
        whatsappPhone.startsWith("5") &&
        whatsappPhone.length === 9
    ){

        whatsappPhone =
        "966" +
        whatsappPhone;

    }

    /*
       إذا كان الرقم يبدأ بـ 966
       يبقى كما هو
    */

    const studentName =
    student.name ||
    "الطالب";

    const message =
`السلام عليكم ورحمة الله وبركاته 🌹

نبارك لك قبولك في أكاديمية جنود الهدى 🕌

👤 اسم الطالب:
${studentName}

🔐 كود الدخول:
${code}

📖 استخدم هذا الكود للدخول إلى الحصة المباشرة من موقع الأكاديمية.

وفقك الله وبارك فيك 🤲
أكاديمية جنود الهدى`;

    const whatsappURL =
    "https://wa.me/" +
    whatsappPhone +
    "?text=" +
    encodeURIComponent(message);

    window.open(
        whatsappURL,
        "_blank"
    );
}


async function deleteStudent(id){

    const confirmed =
    confirm(
        "هل أنت متأكد من حذف هذا الطالب؟"
    );

    if(!confirmed){
        return;
    }

    try{

        await deleteDoc(
            doc(
                db,
                "students",
                id
            )
        );

        showDashboardMessage(
            "✅ تم حذف الطالب.",
            true
        );

        await loadStudents();

    }catch(error){

        console.error(error);

        showDashboardMessage(
            "❌ تعذر حذف الطالب: " +
            error.message,
            false
        );
    }
}


async function loadRequests(){

    requestsList.innerHTML = `
        <div class="loading">
            ⏳ جاري تحميل الطلبات...
        </div>
    `;

    try{

        const result =
        await getDocs(
            collection(
                db,
                "bookingRequests"
            )
        );

        requestsCount.textContent =
        result.size;

        if(result.empty){

            requestsList.innerHTML = `
                <div class="empty">
                    لا توجد طلبات تسجيل.
                </div>
            `;

            return;
        }

        requestsList.innerHTML = "";

        result.forEach(
            function(item){

                const request =
                item.data();

                const isApproved =
                request.status === "approved";

                const div =
                document.createElement("div");

                div.className = "item";

                div.innerHTML = `

                    <strong>
                        👤 ${escapeHTML(
                            request.name ||
                            "بدون اسم"
                        )}
                    </strong>

                    <br>

                    📱 الهاتف:
                    ${escapeHTML(
                        request.phone ||
                        "-"
                    )}

                    <br>

                    🎂 العمر:
                    ${escapeHTML(
                        request.age ||
                        "-"
                    )}

                    <br>

                    📊 الحالة:
                    ${
                        isApproved
                        ?
                        '<span class="status-approved">✅ تمت الموافقة</span>'
                        :
                        '<span class="status-pending">🟡 بانتظار المراجعة</span>'
                    }

                    ${
                        request.studentCode
                        ?
                        `
                        <div class="code-box">

                            🔐 كود الطالب

                            <span class="code-number">
                                ${escapeHTML(
                                    request.studentCode
                                )}
                            </span>

                        </div>
                        `
                        :
                        ""
                    }

                    <br>

                    📅 الطلب:
                    ${
                        request.createdAt
                        ?
                        formatCreatedAt(
                            request.createdAt
                        )
                        :
                        "-"
                    }

                    <div class="actions">

                        ${
                            !isApproved
                            ?
                            `
                            <button
                                class="success-button"
                                data-request-id="${item.id}"
                                data-action="approve">

                                ✅ قبول وإنشاء كود

                            </button>
                            `
                            :
                            `
                            <button
                                class="warning"
                                data-code="${escapeHTML(
                                    request.studentCode ||
                                    ""
                                )}"
                                data-action="copy-request-code">

                                📋 نسخ الكود

                            </button>

                            <button
                                class="whatsapp"
                                data-request-id="${item.id}"
                                data-action="whatsapp-request">

                                📱 إرسال الكود واتساب

                            </button>
                            `
                        }

                        <button
                            class="danger"
                            data-request-id="${item.id}"
                            data-action="delete-request">

                            🗑️ حذف الطلب

                        </button>

                    </div>
                `;

                requestsList.appendChild(div);

            }
        );


        requestsList
        .querySelectorAll("button")
        .forEach(
            function(button){

                button.addEventListener(
                    "click",
                    async function(){

                        const action =
                        this.dataset.action;

                        const id =
                        this.dataset.requestId;

                        if(action === "approve"){

                            await approveStudent(
                                id,
                                this
                            );

                        }

                        if(action === "delete-request"){

                            await deleteRequest(
                                id
                            );

                        }

                        if(action === "copy-request-code"){

                            await copyText(
                                this.dataset.code
                            );

                        }

                        if(action === "whatsapp-request"){

                            await sendRequestCodeWhatsApp(
                                id
                            );

                        }

                    }
                );

            }
        );

    }catch(error){

        console.error(error);

        requestsList.innerHTML = `

            <div class="empty">

                ❌ تعذر تحميل الطلبات.

                <br><br>

                ${escapeHTML(
                    error.message ||
                    ""
                )}

            </div>
        `;
    }
}


/* =========================================
   الموافقة وإنشاء الكود
========================================= */

async function approveStudent(
    requestId,
    button
){

    const confirmed =
    confirm(
        "هل تريد قبول هذا الطالب وإنشاء كود دخول له؟"
    );

    if(!confirmed){
        return;
    }

    button.disabled = true;

    button.textContent =
    "⏳ جاري إنشاء الكود...";

    try{

        const requestRef =
        doc(
            db,
            "bookingRequests",
            requestId
        );

        const requestSnap =
        await getDocs(
            query(
                collection(
                    db,
                    "bookingRequests"
                )
            )
        );

        let requestData = null;

        requestSnap.forEach(
            function(item){

                if(item.id === requestId){

                    requestData =
                    item.data();

                }
            }
        );

        if(!requestData){

            throw new Error(
                "لم يتم العثور على الطلب."
            );
        }

        if(
            requestData.status ===
            "approved"
        ){

            showDashboardMessage(
                "⚠️ هذا الطالب تمت الموافقة عليه مسبقًا.",
                false
            );

            await loadRequests();

            return;
        }

        const code =
        await generateUniqueCode();


        await addDoc(
            collection(
                db,
                "students"
            ),
            {

                name:
                requestData.name || "",

                phone:
                requestData.phone || "",

                age:
                requestData.age || "",

                code:
                code,

                active:
                true,

                status:
                "active",

                teacher:
                "",

                level:
                "",

                lesson:
                "",

                createdAt:
                serverTimestamp()

            }
        );


        await updateDoc(
            requestRef,
            {

                status:
                "approved",

                studentCode:
                code,

                approvedAt:
                serverTimestamp()

            }
        );


        showDashboardMessage(
            "✅ تمت الموافقة بنجاح. كود الطالب هو: " +
            code,
            true
        );

        await loadDashboard();

    }catch(error){

        console.error(error);

        showDashboardMessage(
            "❌ تعذر قبول الطالب: " +
            error.message,
            false
        );

        button.disabled = false;

        button.textContent =
        "✅ قبول وإنشاء كود";
    }
}


/* =========================================
   إرسال كود الطلب مباشرة عبر واتساب
========================================= */

async function sendRequestCodeWhatsApp(
    requestId
){

    try{

        const result =
        await getDocs(
            collection(
                db,
                "bookingRequests"
            )
        );

        let requestData = null;

        result.forEach(
            function(item){

                if(item.id === requestId){

                    requestData =
                    item.data();

                }
            }
        );

        if(!requestData){

            showDashboardMessage(
                "⚠️ لم يتم العثور على الطلب.",
                false
            );

            return;
        }

        if(!requestData.studentCode){

            showDashboardMessage(
                "⚠️ لا يوجد كود لهذا الطالب.",
                false
            );

            return;
        }

        openWhatsApp(
            requestData.phone,
            requestData.name,
            requestData.studentCode
        );

    }catch(error){

        console.error(error);

        showDashboardMessage(
            "❌ تعذر فتح واتساب: " +
            error.message,
            false
        );
    }
}

function openWhatsApp(
    phone,
    studentName,
    code
){

    let whatsappPhone =
    String(
        phone || ""
    ).replace(
        /\D/g,
        ""
    );

    if(!whatsappPhone){

        showDashboardMessage(
            "⚠️ لا يوجد رقم جوال للطالب.",
            false
        );

        return;
    }

    if(
        whatsappPhone.startsWith("05")
    ){

        whatsappPhone =
        "966" +
        whatsappPhone.substring(1);

    }else if(
        whatsappPhone.startsWith("5") &&
        whatsappPhone.length === 9
    ){

        whatsappPhone =
        "966" +
        whatsappPhone;

    }

    const message =
`السلام عليكم ورحمة الله وبركاته 🌹

نبارك لك قبولك في أكاديمية جنود الهدى 🕌

👤 اسم الطالب:
${studentName || "الطالب"}

🔐 كود الدخول:
${code}

📖 استخدم هذا الكود للدخول إلى الحصة المباشرة من موقع الأكاديمية.

وفقك الله وبارك فيك 🤲

أكاديمية جنود الهدى`;

    const url =
    "https://wa.me/" +
    whatsappPhone +
    "?text=" +
    encodeURIComponent(message);

    window.open(
        url,
        "_blank"
    );
}


async function generateUniqueCode(){

    for(
        let attempt = 0;
        attempt < 20;
        attempt++
    ){

        const code =
        String(
            Math.floor(
                100000 +
                Math.random() *
                900000
            )
        );

        const check =
        await getDocs(
            query(
                collection(
                    db,
                    "students"
                ),
                where(
                    "code",
                    "==",
                    code
                )
            )
        );

        if(check.empty){

            return code;
        }
    }

    throw new Error(
        "تعذر إنشاء كود فريد. حاول مرة أخرى."
    );
}


async function deleteRequest(id){

    const confirmed =
    confirm(
        "هل تريد حذف هذا الطلب؟"
    );

    if(!confirmed){
        return;
    }

    try{

        await deleteDoc(
            doc(
                db,
                "bookingRequests",
                id
            )
        );

        showDashboardMessage(
            "✅ تم حذف الطلب.",
            true
        );

        await loadRequests();

    }catch(error){

        console.error(error);

        showDashboardMessage(
            "❌ تعذر حذف الطلب: " +
            error.message,
            false
        );
    }
}


async function copyText(text){

    if(!text){

        showDashboardMessage(
            "⚠️ لا يوجد كود.",
            false
        );

        return;
    }

    try{

        await navigator.clipboard.writeText(
            String(text)
        );

        showDashboardMessage(
            "✅ تم نسخ الكود: " + text,
            true
        );

    }catch(error){

        showDashboardMessage(
            "🔐 كود الطالب: " + text,
            true
        );
    }
}

function showDashboardMessage(
    text,
    success
){

    dashboardMessage.textContent =
    text;

    dashboardMessage.className =
    "message " +
    (
        success
        ?
        "success"
        :
        "error"
    );

    dashboardMessage.style.display =
    "block";

    setTimeout(
        function(){

            dashboardMessage.style.display =
            "none";

        },
        5000
    );
}

function formatDateTime(value){

    const date =
    new Date(value);

    if(isNaN(date.getTime())){

        return "غير محدد";
    }

    return date.toLocaleString(
        "ar-SA",
        {
            year:"numeric",
            month:"long",
            day:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        }
    );
}


function formatCreatedAt(value){

    try{

        if(
            value &&
            typeof value.toDate ===
            "function"
        ){

            return value
            .toDate()
            .toLocaleString(
                "ar-SA"
            );
        }

        return formatDateTime(value);

    }catch(error){

        return "-";
    }
}


function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}
