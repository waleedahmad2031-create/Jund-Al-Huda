<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>أكاديمية جنود الهدى</title><style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    background:#f3f7f5;
    color:#222;
}

header{
    background:linear-gradient(135deg,#064e45,#0b806f);
    color:white;
    text-align:center;
    padding:28px 15px 35px;
}

.logo{
    font-size:52px;
    margin-bottom:8px;
}

header h1{
    font-size:29px;
}

header p{
    margin-top:8px;
    font-size:14px;
    opacity:.95;
}

.container{
    max-width:850px;
    margin:auto;
    padding:16px 13px 30px;
}

/* =========================
   بوابة الإدارة والمدرس
========================= */

.portal-card{
    background:white;
    border-radius:20px;
    padding:18px;
    box-shadow:0 5px 20px rgba(0,0,0,.07);
    margin-bottom:16px;
}

.portal-title{
    text-align:center;
    color:#075e54;
    font-size:21px;
    font-weight:bold;
    margin-bottom:6px;
}

.portal-subtitle{
    text-align:center;
    color:#777;
    font-size:13px;
    margin-bottom:15px;
}

.portal-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.portal-button{
    border:0;
    border-radius:12px;
    padding:15px 8px;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.admin-button{
    background:#075e54;
}

.teacher-button{
    background:#0b806f;
}

.portal-info{
    margin-top:10px;
    background:#eef8f5;
    color:#075e54;
    border-radius:12px;
    padding:12px;
    text-align:center;
    font-size:13px;
    line-height:1.8;
}

/* =========================
   التسجيل
========================= */

.register-card{
    background:white;
    border-radius:22px;
    padding:22px 18px;
    box-shadow:0 5px 22px rgba(0,0,0,.08);
    margin-bottom:16px;
    border-top:5px solid #075e54;
}

.register-title{
    text-align:center;
    color:#075e54;
    font-size:24px;
    font-weight:bold;
    margin-bottom:7px;
}

.register-subtitle{
    text-align:center;
    color:#777;
    font-size:13px;
    line-height:2;
    margin-bottom:18px;
}

.input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:12px;
    margin-bottom:10px;
    font-size:15px;
    outline:none;
    background:#fff;
}

.input:focus{
    border-color:#075e54;
}

.register-button{
    width:100%;
    border:0;
    border-radius:12px;
    padding:15px;
    background:#075e54;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.register-button:disabled{
    background:#aaa;
}

.register-message{
    display:none;
    margin-top:12px;
    padding:13px;
    border-radius:11px;
    text-align:center;
    line-height:1.8;
    font-size:14px;
    word-break:break-word;
}

.success{
    background:#e5f7ed;
    color:#08733d;
}

.danger{
    background:#ffe8e8;
    color:#a00000;
}

/* =========================
   دخول الحصة
========================= */

.class-card{
    background:linear-gradient(135deg,#075e54,#0b806f);
    color:white;
    border-radius:22px;
    padding:24px 18px;
    text-align:center;
    margin-bottom:16px;
    box-shadow:0 5px 22px rgba(0,0,0,.10);
}

.class-icon{
    font-size:43px;
    margin-bottom:8px;
}

.class-card h2{
    font-size:23px;
    margin-bottom:8px;
}

.class-card p{
    font-size:13px;
    line-height:2;
    opacity:.95;
    margin-bottom:15px;
}

.code-input{
    width:100%;
    padding:15px;
    border:0;
    border-radius:12px;
    text-align:center;
    font-size:20px;
    letter-spacing:3px;
    outline:none;
    margin-bottom:10px;
}

.code-button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:12px;
    background:#c9a227;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.code-button:disabled{
    background:#999;
}

.code-message{
    display:none;
    margin-top:12px;
    background:rgba(255,255,255,.15);
    border-radius:10px;
    padding:12px;
    line-height:1.8;
}

/* =========================
   المصحف
========================= */

.quran-card{
    background:#fffdf7;
    border-radius:23px;
    padding:20px 16px;
    box-shadow:0 5px 22px rgba(0,0,0,.08);
    border:1px solid #eee2c3;
    margin-bottom:16px;
}

.quran-title{
    text-align:center;
    color:#075e54;
    font-size:26px;
    font-weight:bold;
    margin-bottom:5px;
}

.quran-subtitle{
    text-align:center;
    color:#888;
    font-size:13px;
    margin-bottom:18px;
}

.select-box{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:12px;
    font-size:16px;
    background:white;
    outline:none;
    margin-bottom:15px;
}

.mushaf{
    background:#fffef8;
    border:2px solid #d8c27a;
    border-radius:18px;
    padding:18px 14px;
    box-shadow:inset 0 0 20px rgba(150,120,30,.06);
}

.surah-header{
    text-align:center;
    margin:5px 0 18px;
    padding:15px 8px;
    border-top:2px solid #c9a227;
    border-bottom:2px solid #c9a227;
    color:#075e54;
    font-size:25px;
    font-weight:bold;
}

.surah-header small{
    display:block;
    color:#8b6b00;
    font-size:12px;
    margin-top:7px;
    font-weight:normal;
}

.basmala{
    text-align:center;
    color:#075e54;
    font-size:20px;
    font-weight:bold;
    line-height:2;
    margin:12px 0 20px;
}

.ayah{
    padding:17px 8px;
    margin-bottom:4px;
    font-family:"Traditional Arabic",Tahoma,Arial,sans-serif;
    font-size:23px;
    line-height:2.5;
    text-align:right;
    color:#222;
    border-bottom:1px solid rgba(201,162,39,.22);
}

.ayah-number{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:29px;
    height:29px;
    border:1px solid #c9a227;
    border-radius:50%;
    color:#075e54;
    font-family:Tahoma,Arial;
    font-size:11px;
    margin-left:8px;
    vertical-align:middle;
    background:#fffdf4;
}

/* =========================
   التفسير
========================= */

.tafsir-card{
    background:white;
    border-radius:20px;
    padding:20px 17px;
    box-shadow:0 4px 17px rgba(0,0,0,.06);
    margin-bottom:16px;
    border-right:5px solid #075e54;
}

.tafsir-title{
    color:#075e54;
    text-align:center;
    font-size:22px;
    font-weight:bold;
    margin-bottom:10px;
}

.tafsir-card p{
    color:#666;
    font-size:14px;
    line-height:2;
    text-align:center;
}

/* =========================
   التنقل
========================= */

.navigation{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:18px;
}

.navigation button{
    border:0;
    border-radius:12px;
    padding:14px;
    background:#075e54;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.navigation button:disabled{
    background:#ccc;
}

/* =========================
   تحميل
========================= */

.loading{
    text-align:center;
    color:#777;
    padding:30px 10px;
    line-height:2;
}

/* =========================
   الفوتر
========================= */

footer{
    background:#075e54;
    color:white;
    text-align:center;
    padding:23px 15px;
    font-size:13px;
    line-height:2.2;
    margin-top:10px;
}

/* =========================
   الجوال
========================= */

@media(max-width:600px){

    header h1{
        font-size:25px;
    }

    .ayah{
        font-size:20px;
        line-height:2.5;
    }

    .navigation{
        grid-template-columns:1fr;
    }

    .portal-buttons{
        grid-template-columns:1fr;
    }

}

    </style>
